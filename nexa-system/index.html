<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexa System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one centered column — live scene art on top, story box under it, System tabs at the bottom. Deliberately dark: it is the System's screen. */
:root{
  --void:#04060d; --deep:#0a1226; --panel:rgba(8,18,40,.94); --panel2:#0d1a36;
  --line:rgba(95,208,255,.38); --cyan:#5fd0ff; --ice:#d6f1ff; --text:#dbe5f3; --muted:#8597b6;
  --red:#ff4d63; --gold:#ffc94a; --violet:#b07bff; --green:#5fe08a;
  --sys:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--void);color:var(--text);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--void)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 84px}

/* HUD */
#hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-family:var(--sys);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--void) 70%,transparent);padding-block:4px 8px}
.brand{font-weight:700;letter-spacing:.18em;font-size:13px;color:var(--cyan);text-shadow:0 0 12px rgba(95,208,255,.6);line-height:1.1}
.brand small{display:block;color:var(--muted);letter-spacing:.12em;font-size:10px;font-weight:600}
.bars{display:grid;gap:4px;min-width:0}
.bar{height:8px;border:1px solid var(--line);background:#071026;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#d23a4f,#ff6b7d);transition:width .3s}
.bar.mp i{background:linear-gradient(90deg,#2b6fe0,#5fd0ff)}
.bar.xp i{background:linear-gradient(90deg,#c99a2a,#ffd86b)}
.hudr{text-align:right;font-size:12px;line-height:1.35;font-variant-numeric:tabular-nums}
.hudr b{color:var(--ice);font-size:15px}
.coin{color:var(--gold)}

/* Stage */
#stage{position:relative;aspect-ratio:16/9;max-width:100%;border:1px solid var(--line);background:#000;overflow:hidden;box-shadow:0 0 30px rgba(40,120,255,.12)}
#art{display:block;width:100%;height:100%}
#cap{position:absolute;left:10px;top:8px;font-family:var(--sys);font-size:11px;letter-spacing:.16em;color:var(--ice);background:rgba(4,8,20,.55);padding:3px 8px;border-left:2px solid var(--cyan);pointer-events:none;max-width:calc(100% - 20px)}
#stage.shake{animation:shake .35s}
#stage.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:flash .35s forwards;pointer-events:none}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes flash{from{opacity:.7}to{opacity:0}}

/* Story box */
#box{position:relative;min-height:190px;background:var(--panel);border:1px solid var(--line);padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px}
#speaker{font-family:var(--sys);font-weight:700;letter-spacing:.08em;font-size:14px;color:var(--cyan);min-height:1em}
#text{font-size:17px;line-height:1.6;max-width:65ch;min-height:3.2em;white-space:pre-wrap}
#text.sysline{font-family:var(--sys);color:var(--ice);text-shadow:0 0 10px rgba(95,208,255,.55)}
#text.thought{font-style:italic;color:#b9c6dc}
#text.big{font-family:var(--sys);font-size:22px;letter-spacing:.06em;color:var(--ice);text-align:center;max-width:none}
#hint{position:absolute;right:14px;bottom:8px;color:var(--cyan);font-size:12px;animation:bob 1s infinite;font-family:var(--sys)}
@keyframes bob{50%{transform:translateY(3px)}}
#choices{display:grid;gap:8px}
.choice{text-align:left;background:linear-gradient(90deg,rgba(95,208,255,.14),rgba(95,208,255,.03));border:1px solid var(--line);padding:11px 14px;font-weight:600;transition:background .15s,transform .1s}
.choice:hover{background:rgba(95,208,255,.22)}
.choice:active{transform:scale(.99)}
.choice::before{content:"▸ ";color:var(--cyan)}

/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(4,7,16,.96);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
#tabs .in{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%;max-width:820px}
#tabs button{background:none;border:1px solid transparent;font-family:var(--sys);font-size:11px;letter-spacing:.08em;padding:6px 2px;color:var(--muted);display:grid;gap:2px;justify-items:center}
#tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
#tabs button:hover,#tabs button.on{color:var(--cyan);border-color:var(--line)}
#tabs button .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}

/* System window (modal) */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(1,3,10,.72);backdrop-filter:blur(2px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.win{width:min(520px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:linear-gradient(180deg,rgba(10,26,58,.97),rgba(5,12,30,.97));border:1px solid var(--cyan);
  box-shadow:0 0 0 1px rgba(95,208,255,.15),0 0 34px rgba(95,208,255,.38),inset 0 0 30px rgba(95,208,255,.10);font-family:var(--sys);animation:winIn .28s ease-out;position:relative}
.win.red{border-color:var(--red);box-shadow:0 0 34px rgba(255,77,99,.45),inset 0 0 30px rgba(255,77,99,.12)}
.win.gold{border-color:var(--gold);box-shadow:0 0 34px rgba(255,201,74,.4),inset 0 0 30px rgba(255,201,74,.1)}
@keyframes winIn{from{transform:scaleY(.04);opacity:.2}to{transform:none;opacity:1}}
.win .hd{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);letter-spacing:.2em;font-weight:700;color:var(--ice);font-size:15px}
.win.red .hd{color:#ffd0d6;border-color:rgba(255,77,99,.4)}
.win .hd .ex{width:22px;height:22px;border:1.5px solid currentColor;display:grid;place-items:center;font-size:13px;border-radius:3px}
.win .bd{padding:16px 18px;font-size:15px;line-height:1.55;color:var(--text)}
.win .bd p{margin:0 0 8px}
.win .bd .em{color:var(--ice);text-shadow:0 0 8px rgba(95,208,255,.5)}
.win .ft{display:flex;gap:10px;justify-content:center;padding:0 18px 16px;flex-wrap:wrap}
.btn{background:rgba(95,208,255,.1);border:1px solid var(--cyan);color:var(--ice);font-family:var(--sys);font-weight:700;letter-spacing:.14em;padding:9px 22px;min-width:110px}
.btn:hover{background:rgba(95,208,255,.25)}
.btn.red{border-color:var(--red);background:rgba(255,77,99,.12);color:#ffd0d6}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.qt{display:inline-block;font-size:11px;letter-spacing:.14em;padding:2px 8px;border:1px solid currentColor;margin-bottom:8px}
.qt.Daily{color:var(--cyan)}.qt.Basic{color:var(--green)}.qt.Special{color:var(--gold)}.qt.Emergency{color:var(--red)}.qt.Hidden{color:var(--violet)}
.goal{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed rgba(95,208,255,.18);padding:5px 0;font-variant-numeric:tabular-nums}
.goal span:last-child{color:var(--ice)}
.lbl{font-size:11px;letter-spacing:.16em;color:var(--muted);margin:12px 0 4px}
.rw{color:var(--ice)}
.rw .r-Special,.rw .hidden{color:var(--gold)}
.warn{color:#ff9aa8;font-size:13px;margin-top:10px}

/* Status window */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(95,208,255,.14);padding:4px 0;min-width:0}
.kv b{color:var(--ice);font-weight:600;text-align:right}
.statrow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(95,208,255,.12)}
.statrow b{color:var(--ice);font-variant-numeric:tabular-nums}
.statrow .k{letter-spacing:.12em;color:var(--cyan)}
.plus{width:30px;height:28px;border:1px solid var(--cyan);background:rgba(95,208,255,.12);color:var(--ice);font-weight:700}
.plus[disabled]{opacity:.25}
.sheet{width:min(640px,100%)}
.tabsx{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabsx button{border:1px solid var(--line);background:none;padding:5px 10px;font-family:var(--sys);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.tabsx button.on{color:var(--ice);border-color:var(--cyan);background:rgba(95,208,255,.12)}

/* Cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.ctile{border:1px solid var(--rc,#556);background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(0,0,0,.25));padding:10px;text-align:left;display:grid;gap:4px;min-height:110px;position:relative;box-shadow:inset 0 0 18px color-mix(in srgb,var(--rc,#556) 22%,transparent)}
.ctile .rr{font-size:10px;letter-spacing:.14em;color:var(--rc)}
.ctile .nm{font-weight:700;color:var(--ice);font-size:14px;line-height:1.25}
.ctile .ty{font-size:11px;color:var(--muted)}
.ctile.locked{--rc:#2a3550;opacity:.55}
.ctile.locked .nm{color:var(--muted)}
.r-Common{--rc:#b8c2cc}.r-Uncommon{--rc:#5fe08a}.r-Rare{--rc:#4aa8ff}.r-Epic{--rc:#b072ff}.r-Legendary{--rc:#ffb02e}.r-Mythic{--rc:#ff4d6a}.r-Beyond{--rc:#ffffff}
.r-Beyond{border-image:linear-gradient(135deg,#ff4d6a,#ffc94a,#5fe08a,#5fd0ff,#b072ff) 1}

/* Card reveal */
.reveal{display:grid;justify-items:center;gap:14px;padding:18px}
.c3{width:220px;height:310px;perspective:900px;cursor:pointer}
.c3 .in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.c3.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--rc,var(--cyan));display:grid;align-content:space-between;padding:16px;
  background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc,#5fd0ff) 30%,transparent),transparent 60%),linear-gradient(180deg,#0d1b3a,#050a18);
  box-shadow:0 0 30px color-mix(in srgb,var(--rc,#5fd0ff) 55%,transparent)}
.face.back{--rc:var(--cyan);place-items:center;align-content:center;font-size:72px;color:var(--cyan);text-shadow:0 0 22px var(--cyan)}
.face.back small{font-size:12px;letter-spacing:.2em;color:var(--muted)}
.face.front{transform:rotateY(180deg)}
.face .rr{letter-spacing:.2em;font-size:12px;color:var(--rc)}
.face .nm{font-size:22px;font-weight:700;color:#fff;line-height:1.15;text-shadow:0 0 14px var(--rc)}
.face .sig{font-size:44px;text-align:center;color:var(--rc);text-shadow:0 0 18px var(--rc)}
.face .ds{font-size:13px;line-height:1.45;color:var(--text);font-family:var(--body)}
.face .fx{font-size:12px;color:var(--ice)}

/* Mini-games */
.mg{display:grid;gap:12px}
.mg h3{margin:0;font-family:var(--sys);letter-spacing:.12em;font-size:15px;color:var(--ice)}
.trow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.tbar{height:14px;border:1px solid var(--line);background:#06102a;position:relative;overflow:hidden}
.tbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2b6fe0,#5fd0ff);transition:width .12s}
.tbar.ok i{background:linear-gradient(90deg,#2bb36a,#5fe08a)}
.tlab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.tap{min-width:118px;padding:12px 10px;border:1px solid var(--cyan);background:rgba(95,208,255,.12);font-family:var(--sys);font-weight:700;letter-spacing:.08em;color:var(--ice);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tap:active{background:rgba(95,208,255,.3)}
.tap[disabled]{border-color:var(--green);color:var(--green);background:rgba(95,224,138,.08)}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qopts button{padding:12px;border:1px solid var(--line);background:rgba(95,208,255,.06);text-align:left}
.qopts button.right{border-color:var(--green);background:rgba(95,224,138,.15)}
.qopts button.wrong{border-color:var(--red);background:rgba(255,77,99,.15)}
.small{font-size:13px;color:var(--muted)}

/* Fight */
.ftop{display:grid;gap:6px}
.fname{display:flex;justify-content:space-between;font-family:var(--sys);letter-spacing:.06em;gap:10px}
.fname b{color:#ffb3bd}
.fname span{color:var(--muted);font-size:12px;text-align:right}
.ebar{height:12px;border:1px solid rgba(255,77,99,.6);background:#1a0710;position:relative;overflow:hidden}
.ebar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#a3172b,#ff4d63);transition:width .3s}
.flog{font-size:14px;line-height:1.5;min-height:6em;display:flex;flex-direction:column;justify-content:flex-end;color:#c9d5e8}
.flog div:last-child{color:var(--ice)}
.flog .hit{color:#ffb3bd}.flog .good{color:var(--green)}.flog .sys{color:var(--cyan);font-family:var(--sys)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.acts button{padding:10px 8px;border:1px solid var(--line);background:rgba(95,208,255,.08);font-family:var(--sys);font-size:13px;text-align:left;line-height:1.25}
.acts button small{display:block;color:var(--muted);font-size:11px}
.acts button.sk{border-color:rgba(255,201,74,.5);background:rgba(255,201,74,.07)}
.acts button[disabled]{opacity:.35}
.mine{display:flex;gap:12px;font-size:12px;color:var(--muted);font-family:var(--sys);flex-wrap:wrap;font-variant-numeric:tabular-nums}

/* Overlays */
#over{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#000;text-align:center;font-family:var(--sys);padding:24px}
#over .t1{font-size:13px;letter-spacing:.4em;color:var(--cyan)}
#over .t2{font-size:clamp(28px,7vw,54px);font-weight:700;color:#fff;letter-spacing:.06em;text-shadow:0 0 30px rgba(95,208,255,.6);text-wrap:balance;margin-top:10px}
#over .t3{color:var(--muted);margin-top:14px;font-size:13px;letter-spacing:.2em}
#over.fade{animation:fadein .6s}
@keyframes fadein{from{opacity:0}}
.letter{background:#efe6d2;color:#2b2318;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.7;padding:26px 24px;width:min(460px,100%);box-shadow:0 10px 40px rgba(0,0,0,.6);transform:rotate(-1deg);white-space:pre-line}
#toasts{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:25;display:grid;gap:6px;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{background:rgba(6,16,38,.95);border:1px solid var(--cyan);padding:8px 12px;font-family:var(--sys);font-size:13px;color:var(--ice);box-shadow:0 0 18px rgba(95,208,255,.35);animation:tin .3s, tout .4s 2.6s forwards}
.toast.gold{border-color:var(--gold);color:#ffe7a8}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
.title-screen{display:grid;gap:16px;justify-items:center}
.title-screen .logo{font-size:clamp(40px,11vw,86px);font-weight:700;letter-spacing:.12em;color:#fff;text-shadow:0 0 40px rgba(95,208,255,.8);line-height:1}
.title-screen .logo span{color:var(--cyan)}
.title-screen p{color:var(--muted);max-width:44ch;font-family:var(--body);line-height:1.6;margin:0}
.crew{border:1px solid var(--line);padding:12px;display:grid;gap:6px;margin-bottom:10px;border-left:3px solid var(--cc)}
.crew h4{margin:0;font-size:15px;letter-spacing:.1em;color:var(--cc)}
.crew .pw{font-size:13px;color:var(--text);font-family:var(--body);line-height:1.5}
.mono{font-variant-numeric:tabular-nums}
@media (max-width:480px){#text{font-size:16px}.qopts{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr}#tabs button{font-size:10px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="app">
  <header id="hud">
    <div class="brand">NEXA<small>SYSTEM</small></div>
    <div class="bars">
      <div class="bar" title="HP"><i id="hpb" style="width:100%"></i></div>
      <div class="bar mp" title="MP"><i id="mpb" style="width:100%"></i></div>
      <div class="bar xp" title="EXP"><i id="xpb" style="width:0%"></i></div>
    </div>
    <div class="hudr"><div><b id="lv">—</b> <span id="lvl">LV</span></div><div><span class="coin" id="coins">0</span> ◈ · <span id="day">Day 1</span></div></div>
  </header>
  <div id="stage"><canvas id="art" width="960" height="540" aria-label="Scene illustration"></canvas><div id="cap">NEXA</div></div>
  <section id="box" aria-live="polite">
    <div id="speaker"></div>
    <div id="text"></div>
    <div id="choices"></div>
    <div id="hint" hidden>TAP ▼</div>
  </section>
</div>
<nav id="tabs"><div class="in">
  <button data-p="status" id="t-status"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>STATUS</button>
  <button data-p="cards" id="t-cards"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="11" height="16" rx="1"/><path d="M9 21h10V7"/></svg>CARDS</button>
  <button data-p="quests" id="t-quests"><svg viewBox="0 0 24 24"><path d="M12 3v12M12 19v1"/><circle cx="12" cy="12" r="10"/></svg>QUESTS</button>
  <button data-p="crews" id="t-crews"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-4 8-8 9-4-1-8-4-8-9V7z"/></svg>CREWS</button>
  <button data-p="shop" id="t-shop"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5zM9 8V6a3 3 0 016 0v2"/></svg>SHOP</button>
  <button data-p="menu" id="t-menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>SYSTEM</button>
</div></nav>
<div id="modal" hidden></div>
<div id="over" hidden></div>
<div id="toasts"></div>

<script>
"use strict";
/* ============================================================
   NEXA SYSTEM — story engine, System, cards, fights, scene art
   ============================================================ */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const TAU=Math.PI*2, W=960, H=540;
const SAVE_KEY='nexa-system-save-v1';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function rnd(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=(a,b)=>a+Math.random()*(b-a);
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* ---------------- CARDS ---------------- */
const RAR=['Common','Uncommon','Rare','Epic','Legendary','Mythic','Beyond'];
const CARDS={
 // basic cards — from small quests
 iron:{n:'Iron Lungs',r:'Common',k:'Basic',sig:'◎',d:'Your stamina stops betraying you. Breathing deepens, recovery speeds up.',fx:{vit:3},fxt:'VIT +3'},

/* ---------------- STATE ---------------- */
function newState(){return{level:1,exp:0,coins:0,pts:0,st:{str:4,agi:5,vit:4,int:18,per:7},hp:100,mp:90,height:160,looks:12,build:'Skinny',title:'Powerless',job:'None',
 cards:[],quests:[],day:1,items:{potion:1},flags:{},scene:'start',systemOn:false,army:'—',aura:'None',ring:'None',textSpeed:1,ended:false}}
let S=newState();
const expNext=L=>Math.round(60+40*L*L);
const maxHP=()=>Math.round(50+S.st.vit*12+S.level*5);
const maxMP=()=>Math.round(20+S.st.int*4);
const has=id=>S.cards.includes(id);
const atkPow=()=>(S.st.str*2.2+S.level*1.5)*(1+(has('boxing')?.1:0)+(has('martial')?.1:0));
function fullHeal(){S.hp=maxHP();S.mp=maxMP()}
function heightStr(cm){const t=Math.round(cm/2.54);return `${Math.floor(t/12)}'${t%12}" (${Math.round(cm)} cm)`}

/* ---------------- HUD ---------------- */
function hud(){
  const on=S.systemOn;
  $('#lv').textContent=on?S.level:'—';$('#lvl').textContent=on?'LV':'NO SYSTEM';
  $('#hpb').style.width=Math.max(0,Math.min(100,S.hp/maxHP()*100))+'%';
  $('#mpb').style.width=Math.max(0,Math.min(100,S.mp/maxMP()*100))+'%';
  $('#xpb').style.width=on?Math.min(100,S.exp/expNext(S.level)*100)+'%':'0%';
  $('#coins').textContent=fmt(S.coins);
  $('#day').textContent=S.flags.yearsLabel||('Day '+S.day);
  const st=$('#t-status');st.querySelector('.dot')?.remove();
  if(on&&S.pts>0){const d=document.createElement('span');d.className='dot';st.appendChild(d)}
}
function toast(msg,cls=''){const t=document.createElement('div');t.className='toast '+cls;t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200)}

/* ---------------- REWARDS ---------------- */
function applyCardFx(id){const f=CARDS[id].fx||{};
  for(const k of ['str','agi','vit','int','per'])if(f[k])S.st[k]+=f[k];
  if(f.looks)S.looks=Math.min(100,S.looks+f.looks);
  if(f.height)S.height+=f.height;
  if(f.build)S.build=f.build;
  if(f.appraisal)S.flags.appraisal=true;
}
function gainExp(n){if(!n)return;S.exp+=n;let ups=0;while(S.exp>=expNext(S.level)){S.exp-=expNext(S.level);S.level++;S.pts+=5;ups++}
  if(ups){fullHeal();toast(`LEVEL UP!  Lv.${S.level}  (+${ups*5} stat points)`,'gold')}hud()}
function gainLevels(n,statEach){S.level+=n;S.exp=0;if(statEach)for(const k in S.st)S.st[k]+=statEach*n;fullHeal();hud()}
async function giveCard(id,silent){if(has(id))return;S.cards.push(id);applyCardFx(id);fullHeal();hud();if(!silent)await revealCard(id)}

 copy:{n:'Mimic',mp:12,d:'Copy enemy move ×2'},drain:{n:'Devour',mp:14,d:'Damage + heal'},light:{n:'Lightspeed Barrage',mp:20,d:'8 hits'},
 whitering:{n:'White Light',mp:25,d:'Full heal + 3× blast'},arise:{n:'Shadow Legion',mp:30,d:'Army strikes ×6'},limit:{n:'Serious Punch',mp:40,d:'×25 — one punch'},

function fight(def){return new Promise(res=>{
  const E={name:def.name,title:def.title||'',max:typeof def.hp==='function'?def.hp():def.hp,atk:typeof def.atk==='function'?def.atk():def.atk,def:def.def||0};E.hp=E.max;
  if(def.art)setArt(def.art,def.artOpt);fullHeal();hud();
  const F={turn:0,mirror:false,silver:0,guard:false,log:[]};const box=$('#choices');clearBox();
  const lv=def.lv?` · Lv.${def.lv}`:'';
  function render(){box.innerHTML=`<div class="mg"><div class="ftop"><div class="fname"><b>${E.name}</b><span>${S.flags.appraisal||def.showStats?`ATK ${fmt(E.atk)} · HP ${fmt(Math.max(0,E.hp))}/${fmt(E.max)}${lv}`:'Stats: ??? (needs Eye of Appraisal)'}</span></div><div class="ebar"><i style="width:${Math.max(0,E.hp/E.max*100)}%"></i></div></div>
   <div class="flog">${F.log.slice(-5).map(l=>`<div class="${l[1]||''}">${l[0]}</div>`).join('')}</div>
   <div class="mine"><span>HP ${fmt(S.hp)}/${fmt(maxHP())}</span><span>MP ${fmt(S.mp)}/${fmt(maxMP())}</span>${def.turns?`<span>TURN ${F.turn+1}${def.scripted==='survive'?' / '+def.turns:''}</span>`:''}${S.items.potion?`<span>Potions ${S.items.potion}</span>`:''}</div>
   <div class="acts"><button data-a="atk">⚔ Attack<small>${fmt(atkPow())} dmg</small></button><button data-a="guard">🛡 Guard<small>-60% dmg · +MP</small></button>
   ${S.items.potion?'<button data-a="potion">✚ Potion<small>Heal 50%</small></button>':''}
   ${S.cards.filter(id=>SK[id]).map(id=>`<button class="sk" data-a="${id}" ${S.mp<SK[id].mp?'disabled':''}>${SK[id].n}<small>${SK[id].d} · ${SK[id].mp} MP</small></button>`).join('')}</div></div>`;
   box.querySelectorAll('[data-a]').forEach(b=>b.onclick=e=>{e.stopPropagation();act(b.dataset.a)});hud()}
  const log=(s,c)=>F.log.push([s,c]);
  const hit=(mult)=>{const d=Math.max(1,atkPow()*mult*R(.88,1.12)-E.def);const crit=Math.random()<Math.min(.4,S.st.per*.004);const dd=Math.round(crit?d*1.8:d);E.hp-=dd;return [dd,crit]};
  function act(a){let busy=box.querySelectorAll('button');busy.forEach(b=>b.disabled=true);F.guard=false;
   if(a!=='atk'&&a!=='guard'&&a!=='potion')S.mp-=SK[a].mp;
   const sayHit=(name,m,n=1)=>{let tot=0,crit=false;for(let i=0;i<n;i++){const [d,c2]=hit(m);tot+=d;crit=crit||c2}log(`${name} → ${fmt(tot)} damage${crit?' · CRITICAL!':''}`,'good');shake()};
   switch(a){case'atk':sayHit('You strike',1);break;case'guard':F.guard=true;S.mp=Math.min(maxMP(),S.mp+maxMP()*.25);log('You raise your guard and steady your breath.');break;
    case'potion':S.items.potion--;S.hp=Math.min(maxHP(),S.hp+maxHP()*.5);log('Potion — HP restored.','good');break;
    case'boxing':sayHit('Jab-Cross',1.6);break;case'martial':sayHit('Thousand-Style Combo',.95,3);break;case'mirror':F.mirror=true;log('Mirror Stance — the next blow will come back to them.','sys');break;
    case'ui':F.silver=2;log('Silver Flow — your body moves on its own.','sys');break;case'teleport':sayHit('Void Step Strike',2.2);break;case'regen':S.hp=Math.min(maxHP(),S.hp+maxHP()*.4);log('Undying Cells — wounds close.','good');break;
    case'copy':{const d=Math.round(E.atk*2);E.hp-=d;log(`Mimic — you copy their technique → ${fmt(d)} damage`,'good');shake();break}
    case'drain':{const [d]=hit(1.8);S.hp=Math.min(maxHP(),S.hp+d*.5);log(`Devour → ${fmt(d)} damage, life absorbed`,'good');shake();break}
    case'light':sayHit('Lightspeed Barrage',.8,8);break;case'whitering':S.hp=maxHP();sayHit('White Light',3);break;case'arise':sayHit('Shadow Legion',1.4,6);break;case'limit':sayHit('SERIOUS PUNCH',25);break}
   render();setTimeout(enemyTurn,520)}
  function enemyTurn(){if(E.hp<=0)return end('win');
   const att=def.attackers?def.attackers[F.turn%def.attackers.length]:{name:E.name,moves:def.moves||['Strike']};const mv=att.moves[Math.floor(Math.random()*att.moves.length)];
   let dmg=Math.max(1,E.atk*R(.85,1.15)-S.st.vit*.5);const dodge=Math.min(.6,S.st.agi*.008+S.st.per*.003+(has('ui')?.25:0));
   if(F.silver>0){F.silver--;const [d]=hit(1.2);log(`${att.name} uses ${mv} — Silver Flow dodges and counters → ${fmt(d)}`,'good');shake()}
   else if(F.mirror){F.mirror=false;const d=Math.round(dmg*1.5);E.hp-=d;log(`${att.name} uses ${mv} — MIRROR! ${fmt(d)} damage reflected!`,'good');shake()}
   else if(Math.random()<dodge&&!def.noDodge){log(`${att.name} uses ${mv} — you dodge!`)}
   else{if(F.guard)dmg*=.4;dmg=Math.round(dmg);S.hp-=dmg;log(`${att.name} uses ${mv} → you take ${fmt(dmg)}`,'hit');shake();
    if(has('mirror')){const rf=Math.round(dmg*.4);E.hp-=rf;log(`Retribution Mirror reflects ${fmt(rf)}.`,'sys')}}
   if(has('regen')&&S.hp>0)S.hp=Math.min(maxHP(),S.hp+maxHP()*.06);
   F.turn++;
   if(def.scripted==='lose'&&(F.turn>=def.turns||S.hp<=0)){S.hp=Math.max(1,S.hp);render();return setTimeout(()=>end('scripted'),700)}
   if(E.hp<=0)return end('win');
   if(S.hp<=0){S.hp=0;render();return setTimeout(()=>end('lose'),600)}
   if(def.scripted==='survive'&&F.turn>=def.turns)return end('win');
   render()}
  function end(r){box.innerHTML='';hud();res(r)}
  log(def.intro||`${E.name} attacks!`,'sys');render()})}
async function runFight(def){let tries=0;for(;;){const r=await fight(def);if(r!=='lose'){fullHeal();hud();return r}tries++;
  const v=await win({title:'YOU HAVE FALLEN',tone:'red',body:`<p>Your HP reached zero.</p><p class="em">The System refuses to let you die here.</p>${tries>=2?'<p>Tip: spend stat points in STATUS, use skills, and Guard to refill MP.</p>':''}`,buttons:[{t:'RETRY',v:'retry'},...(tries>=2?[{t:'PUSH PAST THE LIMIT',v:'force',cls:'ghost'}]:[])]});
  if(v==='force'){await say('![Limit Override] Your body moves on its own. The enemy collapses.');fullHeal();return 'win'}}}

function overlay(html,ms){return new Promise(res=>{const o=$('#over');o.hidden=false;o.className='fade';o.innerHTML=html;let t;const close=()=>{clearTimeout(t);o.hidden=true;o.onclick=null;overWait=null;res()};o.onclick=close;overWait=close;if(ms)t=setTimeout(close,ms)})}
const titleCard=(a,b)=>overlay(`<div><div class="t1">${a}</div><div class="t2">${b}</div><div class="t3">TAP TO CONTINUE</div></div>`,3200);
function letter(text){return new Promise(res=>{const m=$('#modal');m.hidden=false;m.innerHTML=`<div style="display:grid;gap:16px;justify-items:center"><div class="letter">${text}</div><button class="btn">FOLD THE LETTER</button></div>`;m.querySelector('.btn').onclick=()=>{m.hidden=true;m.innerHTML='';res()}})}

  if(m.st){for(const k in m.st)S.st[k]+=m.st[k];toast(Object.entries(m.st).map(([k,v])=>`${k.toUpperCase()} +${v}`).join(' · '))}
  gainLevels(70,0);if(m.card)await giveCard(m.card);hud()}
 for(const id of CARD_ORDER)if(!has(id)&&id!=='aura')await giveCard(id,true);hud();setArt('multiverse',{hue:280})}

/* ---------------- ENGINE ---------------- */
async function step(st){
 if(typeof st==='string')return say(st);
 if(st.art)setArt(st.art,st.opt);
 if(st.title)return titleCard(st.title[0],st.title[1]);
 if(st.day){S.day=st.day;hud();return}
 if(st.fx)return st.fx();
 if(st.win)return win(st.win);
 if(st.quest)return questOffer(st.quest);
 if(st.done)return questDone(st.done);
 if(st.card)return giveCard(st.card);
 if(st.quiz){for(;;){const sc=await quiz();if(sc>=2){await say(`!Score: ${sc} / 3. Quest goal met.`);return}await say(`!Score: ${sc} / 3. Not enough. The teacher hands you a second sheet...`)}}
 if(st.train){if(st.train==='daily')return training(DAILY_TRAIN());
   return training({title:'LANTERN TRAINING',sub:'Train with the Corps. Tap or hold.',items:[{label:'Willpower constructs',goal:100,unit:'',btn:'FORGE',per:()=>8},{label:'Orbital flight laps',goal:50,unit:'laps',btn:'FLY',per:()=>4},{label:'Ring meditation',goal:60,unit:'min',btn:'FOCUS',per:()=>5}]}).then(()=>{gainLevels(25,6);toast('Lantern training: +25 levels, all stats +150','gold')})}
 if(st.fight){const r=await runFight(st.fight);return}
 if(st.cave)return caveSurvival();
 if(st.yesno){const v=await win({title:'NOTIFICATION',body:'<p class="em" style="font-size:18px;text-align:center">Do you want to start the System?</p>',buttons:[{t:'YES',v:'yes'},{t:'NO',v:'no',cls:'ghost'}]});
   await say('~What is this? What\'s going on with me?');await say('Footsteps in the corridor. Someone was coming.');
   await say(v==='no'?'I panicked — my hand jerked — and instead of NO, my finger hit YES.':'I panicked — and my finger slipped straight onto YES.');return}
 if(st.status){await win({title:'STATUS',cls:'sheet',body:statusHTML().replace(/<button class="plus"[^>]*>\+<\/button>/g,'')});return}
 if(st.appraise){const a=st.appraise;if(!S.flags.appraisal)return;await win({title:'EYE OF APPRAISAL',body:`<div class="kv"><span>NAME</span><b>${a.name}</b></div><div class="kv"><span>CREW</span><b>${a.crew}</b></div><div class="kv"><span>LEVEL</span><b>${a.lv}</b></div><div class="kv"><span>POWER</span><b>${a.power}</b></div><div class="kv"><span>STATS</span><b>${a.st}</b></div><p class="small" style="margin-top:10px">Your level: ${S.level}. Spend your points before the fight.</p>`});return}
 if(st.letter)return letter(st.letter);
 if(st.choice){const ch=await choose(st.choice);if(ch.steps)for(const s2 of ch.steps)await step(s2);return}
 if(st.montage)return montage();
 if(st.timeskip){S.flags.age=26;S.flags.yearsLabel='10 years later';gainLevels(Math.max(0,1000-S.level),0);S.title='The One Beyond';S.height=188;S.looks=100;S.build='Perfect';hud();
   return overlay(`<div><div class="t1">TIME PASSES</div><div class="t2">10 YEARS LATER</div><div class="t3">LEVEL ${fmt(S.level)} · ALL CARDS · EVERY AURA</div></div>`,4200)}
 if(st.end)return ending();
}
async function run(id){const sc=SCENES[id];if(!sc)return;S.scene=id;save();setCap(sc.ch,sc.loc);if(sc.art)setArt(sc.art,sc.opt);
 for(const st of sc.steps)await step(st);
 if(sc.next)return run(sc.next)}
async function ending(){S.ended=true;save();await overlay(`<div class="title-screen"><div class="t1">END OF ARC 1</div><div class="t2">The Silent Return</div><p>Next arc: <b style="color:var(--gold)">The Power Competition</b> — the four crews, Bruce Kane, and the first step toward Zero.</p><div class="t3">TAP TO CONTINUE</div></div>`);
 clearBox();$('#speaker').textContent='SYSTEM';$('#text').className='sysline';$('#text').textContent='Arc 1 complete. Your save is kept. Replay from the start, or keep checking your Status and Cards.';
 for(;;){const ch=await choose([{t:'Replay Arc 1 from the beginning',v:'re'},{t:'View my Status',v:'st'},{t:'View my Cards',v:'cards'}]);if(ch.v==='re'){S=newState();fullHeal();hud();return run('start')}openPanel(ch.v==='st'?'status':'cards')}}

/* ---------------- SAVE ---------------- */
function save(){store.set(SAVE_KEY,JSON.stringify(S))}
function load(){const raw=store.get(SAVE_KEY);if(!raw)return null;try{return JSON.parse(raw)}catch(e){return null}}

let panelTab='all';
function openPanel(p){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));const close=()=>document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('on'));

 if(need)return win({title:'LOCKED',body:'<p style="text-align:center">You don\'t have a System... yet.</p><p class="small" style="text-align:center">Keep reading the story.</p>'}).then(close);
 const m=$('#modal');m.hidden=false;let html='',title='';

  if(p==='cards'){title='CARD COLLECTION';const list=CARD_ORDER.filter(id=>panelTab==='all'||CARDS[id].k.toLowerCase()===panelTab);
   html=`<div class="tabsx">${['all','special','basic'].map(k=>`<button data-t="${k}" class="${panelTab===k?'on':''}">${k.toUpperCase()}</button>`).join('')}<span class="small" style="margin-left:auto;align-self:center">${S.cards.length} / ${CARD_ORDER.length} collected</span></div>
   <div class="cgrid">${list.map(id=>{const cd=CARDS[id],own=has(id);return own?`<button class="ctile r-${cd.r}" data-c="${id}"><span class="rr">${cd.r.toUpperCase()}</span><span class="nm">${cd.n}</span><span class="ty">${cd.k} · ${cd.fxt}</span></button>`:`<div class="ctile locked"><span class="rr">${cd.k==='Special'?'SPECIAL':'BASIC'}</span><span class="nm">???</span><span class="ty">Locked</span></div>`}).join('')}</div>`}
  if(p==='quests'){title='QUEST LOG';const act=S.quests.filter(q=>q.status==='active'),dn=S.quests.filter(q=>q.status==='done');
   html=`<div class="lbl">ACTIVE</div>${act.length?act.map(q=>`<div class="goal"><span><span class="qt ${q.type}" style="margin:0 6px 0 0">${q.type.toUpperCase()}</span>${q.title}</span><span>…</span></div>`).join(''):'<p class="small">No active quests.</p>'}
   <div class="lbl">COMPLETED (${dn.length})</div>${dn.slice().reverse().map(q=>`<div class="goal"><span><span class="qt ${q.type}" style="margin:0 6px 0 0">${q.type.toUpperCase()}</span>${q.title}</span><span style="color:var(--green)">✓</span></div>`).join('')}`}
  if(p==='crews'){title='NEXA ACADEMY CREWS';const ap=S.flags.appraisal;const back=S.flags.age;
   const crews=[['Crimson Throne','#ff5a4a','Bruce Kane','Rank #1. Teleports anywhere. Right side fire, left side ice (like Shoto Todoroki). Trained by Garou. Father linked to Zero.',48,'STR 140 · AGI 165 · VIT 120 · INT 60'],
    ['Storm Fang','#ffd84a','Kira Voss','Rank #2. Lightning body; can become a bolt of electricity. Member: Dex Holt.',42,'STR 90 · AGI 180 · VIT 85 · INT 70'],
    ['Iron Veil','#aab4c6','Magnus Drake','Rank #3. Living-metal skin and gravity crushing. Nearly impossible to hurt.',41,'STR 170 · AGI 60 · VIT 200 · INT 40'],
    ['Phantom Lotus','#b07bff','Sera Nyx','Rank #4. Illusions and shadow blades. You never know which Sera is real.',40,'STR 70 · AGI 150 · VIT 75 · INT 160']];
   html=crews.map(([n,cc,l,pw,lv,st])=>`<div class="crew" style="--cc:${cc}"><h4>${n.toUpperCase()}</h4><div class="kv"><span>Leader</span><b>${l}</b></div><div class="pw">${pw}</div><div class="kv"><span>Appraisal</span><b class="mono">${ap?`Lv.${lv} · ${st}`:'??? — needs Eye of Appraisal'}</b></div>${back?`<div class="small">Compared to you: an ant next to a galaxy.</div>`:''}</div>`).join('')+
    `<div class="crew" style="--cc:var(--cyan)"><h4>YOUR CREW</h4><div class="pw">${back?'Locked until the Power Competition. Your Shadow Army is waiting.':'Locked. Become the strongest first.'}</div></div>`}
  if(p==='shop'){title='SYSTEM SHOP';const items=[['elixir','Stat Elixir','+1 stat point',150],['potion','Healing Potion','Heals 50% HP in battle',60],['pack','Basic Card Pack','A random basic card you don’t own',400]];
   html=`<p>Coins: <b class="coin">◈ ${fmt(S.coins)}</b> · Potions: ${S.items.potion||0}</p>`+items.map(([id,n,d,cost])=>`<div class="goal" style="align-items:center"><span><b class="em">${n}</b><br><span class="small">${d}</span></span><button class="btn" data-buy="${id}" data-cost="${cost}" ${S.coins<cost||!S.systemOn?'disabled':''}>◈ ${cost}</button></div>`).join('')+(S.systemOn?'':'<p class="small">The shop opens once you have a System.</p>')}
  if(p==='menu'){title='SYSTEM MENU';html=`<p>Your progress saves automatically at the start of every scene.</p>
   <div class="lbl">TEXT SPEED</div><div class="tabsx">${['SLOW','NORMAL','FAST'].map((k,i)=>`<button data-sp="${i}" class="${(S.textSpeed??1)===i?'on':''}">${k}</button>`).join('')}</div>

  m.innerHTML=`<div class="win sheet"><div class="hd"><span class="ex">!</span>${title}</div><div class="bd">${html}</div><div class="ft"><button class="btn" id="pclose">CLOSE</button></div></div>`;

   m.querySelector('#no').onclick=render;m.querySelector('#yes').onclick=()=>{store.del(SAVE_KEY);location.reload()}});
 };render()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>openPanel(b.dataset.p));

/* ---------------- BOOT ---------------- */
async function boot(){const saved=load();fullHeal();hud();setArt('planet');
 const o=$('#over');o.hidden=false;o.className='fade';
 o.innerHTML=`<div class="title-screen"><div class="t1">A STORY GAME</div><div class="logo">NEXA <span>SYSTEM</span></div><p>Planet Nexa. Everyone has a power — except Peter Parker. Then a cave, a death, and a screen only he can see.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${saved?'<button class="btn" id="cont">CONTINUE</button>':''}<button class="btn ${saved?'ghost':''}" id="newg">${saved?'NEW GAME':'START'}</button></div>
  ${saved?`<p class="small">Saved: ${SCENES[saved.scene]?.ch||''} · Lv.${saved.systemOn?saved.level:'—'}</p>`:''}</div>`;
 const pick=await new Promise(r=>{o.querySelector('#newg').onclick=()=>r('new');o.querySelector('#cont')?.addEventListener('click',()=>r('cont'))});o.hidden=true;
 if(pick==='cont'&&saved){S=Object.assign(newState(),saved);hud();S.ended?ending():run(S.scene)}else{S=newState();fullHeal();hud();run('start')}}
window.claude?.hot?.snapshot?.(()=>({}));
boot();
</script>
