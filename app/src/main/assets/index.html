<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reel Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* VOICE: a prestige studio boss's private office at night, calm and expensive
   IDEA: the studio lot seen from the executive tower; premieres behind velvet rope
   PICTURE: an isometric gold-lined lot you can tap; a curtain-and-gold premiere reveal
   COLOUR and TYPE: midnight #0E1320, panels #1A2133/#242C42, ivory #F5EFE3, gold #D4AF37, velvet #B3122E; Lora titles, DM Sans UI
   LAYOUT: top status bar, left rail (desktop) or bottom tabs (phone), one task in the centre */
:root{color-scheme:dark;--bg:#0E1320;--p1:#1A2133;--p2:#242C42;--line:#323B55;--ivory:#F5EFE3;--silver:#A9B0C3;--gold:#D4AF37;--gold2:#E9C95B;--velvet:#B3122E;--ok:#3FB27F;--warn:#E9A23B;--bad:#E5484D;--info:#5B8DEF;
--serif:Lora,Georgia,"Times New Roman",serif;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ivory);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:26px}h3{font-size:19px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--silver)}.gold{color:var(--gold)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.info{color:var(--info)}
/* shell */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top));background:rgba(14,19,32,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font:600 17px var(--serif);color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.rank{font-size:12px;color:var(--silver);white-space:nowrap}
.stats{display:flex;gap:16px;margin-left:auto;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.stat small{font-size:11px;color:var(--silver)}
.stat b{font-weight:600;font-size:15px}
.stat.cash b{color:var(--gold);font-size:17px}
.date{font:500 14px var(--sans);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 16px;border-radius:6px;border:1px solid transparent;background:none;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);color:#141a29}.btn.gold:hover{background:var(--gold2)}
.btn.ghost{border-color:var(--gold);color:var(--gold)}.btn.ghost:hover{background:rgba(212,175,55,.1)}
.btn.plain{border-color:var(--line);color:var(--ivory)}.btn.plain:hover{border-color:var(--silver)}
.btn.text{color:var(--silver);padding-inline:8px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:32px;padding:4px 12px;font-size:13px}
.next{min-width:132px}
.auto[aria-pressed=true]{background:var(--p2);border-color:var(--gold);color:var(--gold)}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 62px)}
.rail{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:62px;height:calc(100vh - 62px)}
.tab{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;border:0;background:none;color:var(--silver);text-align:left;font-weight:500;font-size:15px;position:relative}
.tab svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{color:var(--ivory);background:var(--p1)}
.tab[aria-current=page]{color:var(--gold);background:var(--p1)}
.tab .dot{position:absolute;right:10px;top:50%;width:7px;height:7px;margin-top:-3px;border-radius:50%;background:var(--gold)}
.rail .foot{margin-top:auto;font-size:12px;color:var(--silver);padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.rail .foot button{background:none;border:0;color:var(--silver);text-align:left;padding:4px 0}
.rail .foot button:hover{color:var(--ivory)}
main{padding:24px clamp(16px,3vw,40px) 120px;max-width:1180px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head p{margin:4px 0 0;color:var(--silver)}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.sec{margin:26px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h3{font-size:18px}
.bar{height:6px;background:var(--p2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .4s ease-out}
.srow{display:grid;grid-template-columns:86px minmax(0,1fr) 32px;gap:10px;align-items:center;font-size:13px;margin-top:6px}
.srow span:last-child{text-align:right}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--p2);font-size:12px;color:var(--silver);white-space:nowrap}
.pill.g{color:var(--gold)}.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.hint{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(90deg,rgba(212,175,55,.14),rgba(212,175,55,.03));border:1px solid rgba(212,175,55,.45);border-radius:12px;padding:12px 16px;margin-bottom:18px}
.hint b{color:var(--gold);font-weight:600}
/* lot */
.lot{position:relative;background:radial-gradient(120% 90% at 50% 40%,#18213a 0%,#0E1320 75%);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lot svg{display:block;width:100%;height:auto}
.lot .b{cursor:pointer}
.lot .b:hover .tp,.lot .b:focus .tp{fill:#3a466a}
.lot .lbl{font:500 11px var(--sans);fill:var(--ivory);pointer-events:none}
.lot .sub{font:400 10px var(--sans);fill:var(--silver);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.rec{animation:blink 1.4s ease-in-out infinite}.idle{animation:glow 2.4s ease-in-out infinite}}
@keyframes blink{50%{opacity:.25}}
@keyframes glow{50%{stroke-opacity:.25}}
.cast2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bld-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.bld{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bld:hover{border-color:var(--gold)}
.bld b{font-weight:600;font-size:14px}.bld small{font-size:12px;color:var(--silver)}
.news{list-style:none;margin:0;padding:0}
.news li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;display:grid;grid-template-columns:62px 1fr;gap:10px}
.news li:last-child{border:0}
.news time{font-size:12px;color:var(--silver);padding-top:1px}
.pipe{display:flex;gap:8px;flex-wrap:wrap}
.pipe span{background:var(--p2);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--silver)}
.pipe span b{color:var(--ivory);font-weight:600;margin-left:4px}
.pipe span.on{background:rgba(212,175,55,.16);color:var(--gold)}
/* film + script cards */
.card{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card.mine{border-left:3px solid var(--gold)}
.card .ttl{font:600 19px var(--serif)}
.card .meta{font-size:13px;color:var(--silver)}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--silver)}
.stars{color:var(--gold);letter-spacing:1px}
.heat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.heat div{background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.heat b{display:block;font-weight:600;font-size:14px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;font-size:12px;color:var(--silver);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
tr.mine td:first-child{box-shadow:inset 3px 0 var(--gold)}
tr.mine .tt{color:var(--gold)}
.scroll{overflow-x:auto}
/* modal */
.veil{position:fixed;inset:0;z-index:50;background:rgba(5,8,15,.72);display:none;align-items:center;justify-content:center;padding:16px}
.veil.show{display:flex}
.modal{background:var(--p1);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal.wide{width:min(860px,100%)}
.mh{padding:20px 22px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mh small{display:block;color:var(--silver);font-size:13px;margin-bottom:4px}
.mb{padding:16px 22px}
.mf{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--p1)}
.x{background:none;border:0;color:var(--silver);font-size:22px;line-height:1;width:40px;height:40px;border-radius:8px}
.x:hover{background:var(--p2);color:var(--ivory)}
@media (prefers-reduced-motion:no-preference){.veil.show .modal{animation:rise .22s ease-out}}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.opt{display:block;width:100%;text-align:left;background:var(--p2);border:1px solid transparent;border-radius:10px;padding:10px 12px;margin-top:8px}
.opt:hover{border-color:var(--line)}
.opt[aria-pressed=true]{border-color:var(--gold);background:rgba(212,175,55,.08)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.opt b{font-weight:600}
.opt small{color:var(--silver);font-size:12px}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.segs .opt{margin:0}
.person{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1.5px solid var(--gold);display:grid;place-items:center;font:600 13px var(--sans);color:var(--gold)}
.est{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;background:var(--bg);border-radius:10px;padding:12px;margin-top:14px}
.est small{display:block;color:var(--silver);font-size:12px}
.est b{font:600 20px var(--sans)}
.choice{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.choice small{color:var(--silver)}
input[type=range]{width:100%;accent-color:var(--gold);height:32px}
input[type=text]{width:100%;font:16px var(--sans);color:var(--ivory);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:6px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.cal .opt{margin:0;padding:8px 10px}
.cal .opt b{font-size:14px}
.cal .opt small{display:block}
.pm{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.pm span:last-child{text-align:right}
/* premiere */
.prem{position:fixed;inset:0;z-index:70;display:none;background:#06080e;color:var(--ivory);overflow:hidden}
.prem.show{display:block}
.curtain{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,#7d0c20 0 18px,#B3122E 18px 34px,#8f0f25 34px 48px);box-shadow:inset -20px 0 40px rgba(0,0,0,.5);transition:transform 1.4s cubic-bezier(.7,0,.2,1)}
.curtain.l{left:0}.curtain.r{right:0;box-shadow:inset 20px 0 40px rgba(0,0,0,.5)}
.prem.open .curtain.l{transform:translateX(-100%)}.prem.open .curtain.r{transform:translateX(100%)}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(60% 50% at 50% 45%,rgba(212,175,55,.16),transparent 70%)}
.stage .k{font-size:14px;color:var(--silver);letter-spacing:.04em}
.stage h1{font-size:clamp(30px,6vw,52px);margin:10px 0 8px}
.big{font:600 clamp(44px,11vw,96px)/1 var(--sans);color:var(--gold);font-variant-numeric:tabular-nums;margin:8px 0}
.stage .line{font-size:16px;margin-top:6px}
.stage .btn{margin-top:28px}
.burst{position:absolute;inset:0;pointer-events:none;opacity:0}
.prem.win .burst{opacity:1}
@media (prefers-reduced-motion:no-preference){.prem.win .burst{animation:burst 1.6s ease-out forwards}}
@keyframes burst{from{transform:scale(.6);opacity:1}to{transform:scale(1.4);opacity:0}}
.toast{position:fixed;right:16px;bottom:88px;z-index:40;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast div{background:var(--p2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:14px;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
/* splash */
.splash{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(70% 60% at 50% 30%,#1c2540,#0E1320 70%)}
.splash .in{width:min(440px,100%);text-align:center}
.splash h1{font-size:clamp(48px,12vw,76px);color:var(--gold);letter-spacing:.01em;font-weight:500}
.splash .tag{color:var(--silver);margin:10px 0 28px;font-family:var(--serif);font-style:italic;font-size:18px}
.splash form{text-align:left;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:20px}
.splash label{font-size:13px;color:var(--silver)}
.splash .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.splash .row .btn{flex:1}
.deco{width:100%;max-width:320px;margin:0 auto 18px;display:block}
.tabs{display:none}
@media (max-width:900px){
 .layout{grid-template-columns:1fr}
 .rail{display:none}
 .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(26,33,51,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 4px max(6px,env(safe-area-inset-bottom))}
 .tabs .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;justify-content:center;align-items:center}
 .tabs .tab[aria-current=page]{background:none}
 .tabs .tab .dot{top:6px;right:calc(50% - 16px)}
 .grid2{grid-template-columns:1fr}
 .stat.hide{display:none}
 .rank{display:none}
 main{padding-bottom:140px}
}
@media (max-width:560px){
 .top{flex-wrap:wrap;gap:8px 12px}
 .brand{max-width:150px;font-size:15px}
 .stats{gap:12px}
 .next{min-width:0;flex:1}
 .tbtns{display:flex;gap:8px;width:100%}
 .segs{grid-template-columns:1fr}
 .cast2{grid-template-columns:1fr}
 .bld-list{grid-template-columns:repeat(2,minmax(0,1fr))}
 table{font-size:13px}td,th{padding:8px 6px}
 .hide-s{display:none}
}

:root{--era:#D4AF37}
body[data-era="1930"]{--era:#D4AF37}body[data-era="1950"]{--era:#E86A7A}body[data-era="1960"]{--era:#5FC4B8}body[data-era="1970"]{--era:#E8913A}body[data-era="1980"]{--era:#E25BC0}body[data-era="1990"]{--era:#8FB3E8}body[data-era="2000"]{--era:#B9C3D6}body[data-era="2010"]{--era:#7FA6FF}body[data-era="2020"]{--era:#E0485F}
.brand{color:var(--era)}
.eraTag{display:inline-block;font-size:11px;color:var(--era);border:1px solid var(--era);border-radius:999px;padding:0 8px;margin-left:6px;opacity:.85}
.portrait{display:block;border-radius:50%;flex:none}
.poster{display:block;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.45);flex:none}
.card .top2{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start}
.person{grid-template-columns:44px minmax(0,1fr) auto}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tcard{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;text-align:left}
.tcard:hover{border-color:var(--gold)}
.tcard b{font-weight:600}
.tcard small{display:block;color:var(--silver);font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters .opt{width:auto;margin:0;padding:6px 14px}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.more button{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left}
.more button:hover{border-color:var(--gold)}
.more svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.more b{font-weight:600}.more small{color:var(--silver);font-size:12px}
.tech{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tech .card{gap:4px}
.tech .card.done{border-color:rgba(63,178,127,.5)}
.tech .card.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.tech .card.lock{opacity:.5}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ach div{background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center}
.ach div.got{border-color:rgba(212,175,55,.6)}
.ach i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--p2);color:var(--silver);font-size:14px}
.ach div.got i{background:var(--gold);color:#141a29}
.ach small{display:block;color:var(--silver);font-size:12px}
.quote{background:var(--p2);border-radius:10px;padding:10px 12px;margin-top:8px}
.quote q{font-family:var(--serif);font-style:italic;font-size:15px}
.quote small{display:block;color:var(--silver);font-size:12px;margin-top:4px}
.ip{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0}
.split i{display:block;height:100%}
.setup .segs{grid-template-columns:repeat(2,1fr)}
.setup h3{font-size:15px;margin:14px 0 4px;font-family:var(--sans);font-weight:600;color:var(--silver)}
.splash .in{width:min(520px,100%)}
.splash form{max-height:calc(100vh - 220px);overflow:auto}
.prem .posterWrap{margin-bottom:10px}
.lot svg .park{fill:#2a3a2c}
@media (max-width:560px){.setup .segs{grid-template-columns:1fr 1fr}.card .top2{grid-template-columns:60px minmax(0,1fr)}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div class="layout">
 <nav class="rail" id="rail" aria-label="Main"></nav>
 <main id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<div class="veil" id="veil" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="prem" id="prem" aria-live="polite"></div>
<div class="toast" id="toast" aria-live="polite"></div>
<div class="splash" id="splash"></div>

 S.upcoming.push({id:'f'+(S.seq++),title:newTitle(g),genre:g,theme:th,studio:r.n,tier,rel:w,Q,appeal:rnd(30,88)*rv,aw:rnd(.4,.88)*(tier==='high'?1.1:1),tone:R()<.3,critic:clamp(Math.round(Q+G[g].crit+rnd(-8,8)),3,99),mine:false});
}

/* ---------- film maths ---------- */
function specBonus(g){let b=0;if(has('color'))b+=(['Musical','Fantasy','Adventure','Animation'].includes(g)?8:4);if(has('animatronics')&&['Horror','Sci-Fi','Fantasy'].includes(g))b+=10;if(has('cgi')&&['Action','Sci-Fi','Fantasy','Adventure','Animation'].includes(g))b+=15;return b}
function qualBonus(g){let b=0;if(has('stereo'))b+=2;if(has('steadicam'))b+=2;if(has('mocap')&&['Animation','Fantasy'].includes(g))b+=3;return b}
function fitOf(p,cast){const c=cast||p;const d=tal(c.dir),l=tal(c.lead),s=tal(c.sup);let f=themeFit(p.genre,p.theme);if(d&&d.genres.includes(p.genre))f+=1;if(l&&l.genres.includes(p.genre))f+=1;const r1=relOf(c.dir,c.lead),r2=relOf(c.lead,c.sup);[r1,r2].forEach(r=>{if(r>=40)f+=1;else if(r<=-40)f-=1.5});return f}
function craftOf(p,level,pace,cast){
 const c=cast||p;const d=tal(c.dir),l=tal(c.lead),s=tal(c.sup);const lv=LEVELS[level??p.level??1],pc=PACES[pace??p.pace??1];
 const crew=48+S.b.post*6,post=45+S.b.post*10;
 const craft=.28*scriptAvg(p.sc)+.24*(d?d.skill:50)+.18*(l?l.skill:50)+.07*(s?s.skill:45)+.09*crew+.09*post+.05*lv.pv;
 return clamp((craft+qualBonus(p.genre))*(1+.025*clamp(fitOf(p,c),-4,4))*pc.q,5,96);
}
function appealOf(p,level,cast){const c=cast||p;const d=tal(c.dir),l=tal(c.lead),s=tal(c.sup);const lv=LEVELS[level??p.level??1];const sp=Math.min(100,lv.pv+specBonus(p.genre))*G[p.genre].spec+(1-G[p.genre].spec)*50;return clamp(.32*p.sc.comm+.28*(l?l.fame:30)+.08*(s?s.fame:20)+.08*(d?d.fame:30)+.24*sp+(p.appealMod||0),5,99)}
function awarenessOf(pa,tier,bonus){const k=(1+.15*(S.b.marketing-1));const base=1-Math.exp(-(pa*k)/(2.4*cEra()*TIER[tier].screens));return clamp(1-(1-base)*(1-S.fame/260)+(bonus||0),.02,.99)}
function strengthOf(f){return f.aw*(.25+f.appeal/100)*(f.tone?1.15:1)*(.8+f.critic/250)*(f.boost||1)}
function grade(v){const g=['F','D','C−','C','C+','B−','B','B+','A−','A','A+'];return g[clamp(Math.round((v-30)/6.5),0,10)]}
function techOpen(tier){let m=1;if(has('wide'))m*=1.06;if(tier==='high'&&has('imax'))m*=1.1;if(tier==='high'&&has('3d'))m*=yearOf(S.week)>=2015?1.03:1.08;return m}
function costMods(p){let m=1;if(has('digital'))m*=.85;BACKLOTS.forEach((b,i)=>{if(S.b.backlot>i&&b[1].includes(p.genre))m*=.85});return m}
function reviewsOf(p){return CRITICS.map((c,i)=>{const sc=clamp(Math.round(p.critic+(c.b[p.genre]||0)+rnd(-7,7)),2,99);const band=QUOTES.find(q=>sc>=q[0]);return{n:c.n,o:c.o,sc,q:band[1][(hashN(p.title)+i)%band[1].length]}})}

/* ---------- week advance ---------- */
function advance(){
 if(busy||!S||S.over)return;
 S.week++;
 const k=wkOf(S.week),yr=yearOf(S.week);
 document.body.dataset.era=decade();
 const upkeep=(S.b.stage*.02+S.b.writers*.008+S.b.post*.01+S.b.marketing*.01+S.b.lab*.012+S.b.backlot*.015+S.b.park*.15)*era();
 S.cash-=upkeep;
 if(S.loans>0)S.cash-=S.loans*S.mods.rate/52;
 // research
 if(S.b.lab>0&&S.tech.cur){S.tech.pts+=S.b.lab*(1+S.prestige/200);const t=TECH.find(x=>x.id===S.tech.cur);if(S.tech.pts>=t.c){S.tech.done.push(t.id);S.tech.pts=0;S.tech.cur=null;news('Your lab has perfected '+t.n.toLowerCase()+'.','gold');toast('<b>Research complete:</b> '+t.n);if(t.id==='ai'){S.union=clamp(S.union-20,0,100);news('The unions are furious about your AI tools.','bad')}}}
 // heat
 const dec=decade();
 for(const g of GENRES){const target=(DECADE_HEAT[g]||{})[dec]||1;S.heat[g]=clamp(S.heat[g]+rnd(-.03,.03)+(target-S.heat[g])*.03,.6,1.45)}
 if(R()<.05){const g=pick(GENRES);const up=R()<.55;S.heat[g]=clamp(S.heat[g]+(up?.18:-.15),.6,1.45);news(up?g+' films are suddenly hot with audiences.':'Audiences are tiring of '+g.toLowerCase()+' films.',up?'info':'')}
 // history
 if(S.hist){EVENTS_HIST.filter(e=>e.y===yr&&e.w===k).forEach(e=>{e.f(S);news(e.t,'info');queue.push(()=>infoModal(String(yr),'Headline news',e.t))});
  HIST_STRIKES.filter(h=>h[0]===yr&&h[1]===k).forEach(h=>startStrike(h[2],true))}
 if(S.mods.closed&&S.mods.closed===S.week){news('Theaters have reopened.','ok')}
 // strike
 const striking=S.strike&&S.strike.until>S.week;
 if(S.strike&&S.strike.until===S.week){news('The strike is over. Cameras roll again.','ok');unlock('strike');S.strike=null}
 // union talks
 if(S.week===S.nextTalks){S.nextTalks=nextTalksWeek();if(!striking)queue.push(()=>unionModal())}
 // rivals
 if(!striking){if(R()<.85)scheduleRival(ri(5,13));if(R()<.45)scheduleRival(ri(5,13))}
 const closed=S.mods.closed>S.week;
 if(closed||striking)S.upcoming.forEach(f=>{if(f.rel<=S.week+1)f.rel+=closed?(S.mods.closed-S.week+ri(1,6)):ri(2,5)});
 // scripts
 S.scripts=S.scripts.filter(s=>s.expires>S.week);
 if(R()<.12&&S.scripts.length>2){const s=pick(S.scripts);S.scripts=S.scripts.filter(x=>x!==s);news(pick(RIVALS).n+' bought the script "'+s.title+'".')}
 const want=5+S.b.writers;if(!striking&&S.scripts.length<want&&(S.week%2===0||S.scripts.length<3))S.scripts.push(mkScript());
 S.talent.forEach(t=>{if(t.busy&&t.busy<=S.week&&!S.projects.some(p=>[p.dir,p.lead,p.sup].includes(t.id)&&['dev','ready','rewrite','shoot','post'].includes(p.stage)))t.busy=0;t.mood=clamp(t.mood+(70-t.mood)*.01,0,100)});
 if(k===1&&S.week>1)newYear(yr);
 // merch, park, streamer, ipo
 let merch=0;S.ips.forEach(ip=>{merch+=ip.brand*G[ip.genre].fam*.0012*era();ip.brand=clamp(ip.brand-.12,0,100)});
 if(merch>.0005)earn(merch,'Merchandise and licensing');
 if(S.b.park>0){const top=[...S.ips].sort((a,b)=>b.brand-a.brand).slice(0,5).reduce((a,ip)=>a+ip.brand,0);const pk=S.b.park*(.6+top*.0018)*era()*.5;earn(pk,'Theme park')}
 if(S.streamer){const st=S.streamer;const lib=S.projects.filter(p=>p.stage==='done').length;st.subs=clamp(st.subs*.99+.004*Math.sqrt(lib+1)*(1+S.fame/100),0,250);const net=st.subs*st.price/4.33*.35-.35*era();earn(net,'Streaming service')}
 if(S.ipo){S.ipo.price=clamp(S.ipo.price*(1+rnd(-.025,.027)),1,9999);if(k%13===0){news('Quarterly earnings call: '+S.name+' shares at $'+S.ipo.price.toFixed(2)+'.')}}
 // scandals
 if(!busy&&R()<.022*DEC().scandal){const ps=S.projects.filter(p=>p.lead&&['ready','shoot','post','market','scheduled','dev'].includes(p.stage));if(ps.length){const p=pick(ps);queue.push(()=>scandalModal(p))}}
 // investor offer
 if(!S.investor&&!S.offer&&R()<.02&&S.projects.length>0){S.offer=true;news('A private investor wants to co-finance your films. See Money.','info')}
 // projects
 for(const p of S.projects){
  if(p.stage==='writing'){p.left--;if(p.left<=0)finishWriting(p)}
  else if(p.stage==='rewrite'){p.left--;if(p.left<=0){p.stage=p.lead?'ready':'dev';toast('Rewrite finished on <b>'+esc(p.title)+'</b>.')}}
  else if(p.stage==='shoot'){if(striking){p.paused=true;continue}p.paused=false;spend(p.weekly,'Shooting: '+p.title,p);p.left--;p.shot++;
   if(p.events<2&&R()<.3&&p.left>0){p.events++;queue.push(()=>eventModal(p))}
   if(p.left<=0){p.stage='post';p.left=Math.max(1,4-Math.floor(S.b.post/2));news('Cameras stopped rolling on "'+p.title+'". Post-production begins.')}}
  else if(p.stage==='post'){p.left--;if(p.left<=0)finishPost(p)}
 }
 // releases
 const openers=[];
 S.projects.filter(p=>p.stage==='scheduled'&&p.rel===S.week).forEach(p=>{
  if(closed){homePremiere(p);return}
  openers.push({id:p.id,title:p.title,genre:p.genre,theme:p.theme,studio:S.name,tier:p.tier,Q:p.Q,appeal:p.appeal,aw:p.aw,tone:p.tone,critic:p.critic,mine:true,proj:p.id,boost:p.boost||1,window:p.window||0,seq:p.seq||1})});
 S.upcoming=S.upcoming.filter(f=>{if(f.rel===S.week&&!closed){openers.push(f);return false}return f.rel>S.week});
 if(closed&&S.films.length){S.films.forEach(f=>{f.gross=0});}
 const total=openers.reduce((a,f)=>a+strengthOf(f),0);
 S.films.forEach(f=>f.prev=f.gross);
 const im=intlOf();
 for(const f of S.films){f.wk++;let drop=f.drop+(f.wk>4?.03:0)+rnd(-.03,.03);drop=clamp(drop,.05,.9);f.gross=closed?0:f.gross*(1-drop);f.total+=f.gross;f.intl+=f.gross*f.im}
 for(const f of openers){
  const st=strengthOf(f),comp=1/(1+.35*(total-st));
  const hold=S.films.filter(x=>x.wk<=2).reduce((a,x)=>a+x.gross,0);
  const holdF=1/(1+hold/(40*era()));
  const lr=R();const L=DEC().luck;const luck=lr<.04?rnd(2.4,4.5):lr<.16*L?rnd(.5,.75):rnd(.8,1.25);
  const heat=S.heat[f.genre],sea=seasonG(S.week,f.genre);
  const fameB=f.mine?(1+S.fame/220):1.12;
  const exh=f.mine?(.85+S.exhib/650):1;
  const codeP=S.mods.code&&['Crime','Horror'].includes(f.genre)?.9:1;
  const open=9*era()*S.mods.attend*st*heat*sea*comp*holdF*TIER[f.tier].screens*luck*fameB*techOpen(f.tier)*exh*codeP;
  const wdrop=[0,.03,.08][f.window||0];
  const drop=clamp(.42-(f.Q-55)*.005+(f.tone?.07:0)+(f.critic<40?.06:0)+wdrop+rnd(-.04,.04),.12,.82);
  const fim=im.m*G[f.genre].intl;
  const film={...f,wk:1,gross:open,prev:0,total:open,intl:open*fim,im:fim,china:im.china,open,drop,factors:{st,comp:comp*holdF,luck,heat,sea},relW:S.week};
  S.films.push(film);
  S.heat[f.genre]=clamp(S.heat[f.genre]-.025,.6,1.45);
  if(f.mine){const p=S.projects.find(x=>x.id===f.proj);p.stage='theaters';p.open=open;p.factors=film.factors;queue.push(()=>premiere(p,film))}
 }
 const ended=[];
 for(const f of S.films){
  if(f.mine){const p=S.projects.find(x=>x.id===f.proj);const intlW=f.gross*f.im;const rev=f.gross*.53+intlW*(1-f.china)*.4+intlW*f.china*.25;earn(rev,'Box office: '+f.title,p);p.total=f.total;p.intl=f.intl;p.wk=f.wk;p.lastGross=f.gross}
  if(f.wk>=2&&(f.gross<.12*era()||f.wk>=16||closed))ended.push(f);
 }
 S.films=S.films.filter(f=>!ended.includes(f));
 for(const f of ended){
  S.released.push({title:f.title,studio:f.studio,Q:f.Q,critic:f.critic,year:yearOf(f.relW),mine:f.mine,total:f.total,genre:f.genre,proj:f.proj||null,dir:f.mine?S.projects.find(x=>x.id===f.proj).dir:null,lead:f.mine?S.projects.find(x=>x.id===f.proj).lead:null});
  if(f.total>14*era()&&f.total>f.open*4){S.heat[f.genre]=clamp(S.heat[f.genre]+.1,.6,1.45);news('"'+f.title+'" had remarkable legs. Expect copycat '+f.genre.toLowerCase()+' films.','info')}
  if(f.mine){const p=S.projects.find(x=>x.id===f.proj);endRun(p,f)}
 }
 if(k===10&&yr>S.startYear)queue.push(()=>awards(yr-1));
 if(k===48&&S.projects.some(p=>p.rel&&yearOf(p.rel)===yr&&['theaters','done'].includes(p.stage)))news('Awards season is here. Campaign for your films in Box office.','info');
 // ranks
 const rk=rankOf().r[1];if(rk!==S.lastRank){if(S.lastRank){news(S.name+' is now a '+rk+'.','gold');toast('<b>New rank:</b> '+rk);chime('win')}S.lastRank=rk}
 if(rk==='Major studio'||rk==='Hollywood legend')unlock('major');if(rk==='Hollywood legend')unlock('legend');
 if(yr-S.startYear>=10)unlock('decade');
 S.cashHist.push(S.cash);if(S.cashHist.length>260)S.cashHist.shift();
 if(S.cash<-12*cEra()){S.over=true;queue.push(gameOver)}
 save();render();runQueue();
}
function newYear(yr){
 const debut=[];
 S.talent.forEach(t=>{const age=yr-t.born;const lim=t.role==='actor'?76:82;
  if(!t.on&&!t.retired&&age>=21){t.on=true;t.fame=ri(8,22);debut.push(t)}
  if(t.on&&!t.retired){if(age>lim){t.retired=true;t.on=false;news(t.name+' has retired after a long career.')}
   else{t.fame=clamp(t.fame-1,3,99);if(t.role==='actor'&&age>60){t.skill=clamp(t.skill-.6,5,99);t.fame=clamp(t.fame-1,3,99)}if(age<35&&R()<.5)t.skill=clamp(t.skill+1,5,99)}}});
 if(debut.length)news('New faces in town: '+debut.slice(0,3).map(t=>t.name).join(', ')+'.','info');
 for(let i=0;i<4;i++)newcomer(i===3?'writer':R()<.65?'actor':'director');
 if(S.ipo){const yp=S.ledger.filter(l=>yearOf(l.w)===yr-1).reduce((a,l)=>a+l.a,0);if(yp<0){S.fame=clamp(S.fame-3,0,100);news('Shareholders are unhappy after a losing year. Share price falls.','bad');S.ipo.price*=.85}else{S.ipo.price*=1.08;news('A profitable year. Shareholders are pleased.','ok')}}
}
function startStrike(weeks,hist){S.strike={until:S.week+weeks};news((hist?'History repeats: ':'')+'Writers and actors walk out. Hollywood is on strike.','bad');queue.push(()=>infoModal('Industry news','Hollywood is on strike','Shooting stops on every film and no new films can be greenlit for about '+weeks+' weeks. Rival studios are frozen too.'))}
function finishWriting(p){
 const w=tal(p.writer);const sk=w?w.skill:50;const match=w&&w.genres.includes(p.genre)?8:0;
 const base=sk*.6+6+S.b.writers*3+match*.75+themeFit(p.genre,p.theme)*3+rnd(-10,10);
 p.sc={hook:clamp(Math.round(base+rnd(-12,12)),10,97),story:clamp(Math.round(base+rnd(-12,12)),10,97),chars:clamp(Math.round(base+rnd(-12,12)),10,97),comm:clamp(Math.round(35+(w?w.fame:20)*.25+(S.heat[p.genre]-1)*60+{low:0,mid:6,high:12}[p.tier]+rnd(-12,12)),10,98)};
 p.stage='dev';p.logline=pick(LOGLINES[p.theme]||['A story only Hollywood could tell.']);
 if(w){w.busy=0;w.films++;w.fame=clamp(w.fame+1,3,99)}
 news((w?w.name:'Your writers')+' finished the script for "'+p.title+'".','gold');

 p.Q=Math.round(clamp(base*rnd(.88,1.12)+p.qMod,5,98));
 p.critic=clamp(Math.round(p.Q+G[p.genre].crit+S.rep/12+rnd(-9,9)),3,99);

 p.test=clamp(Math.round(.6*p.Q+.4*p.appeal+rnd(-6,6)),5,99);

 p.pears=clamp(Math.round(p.critic*1.2-14+rnd(-5,5)),0,100);

 [p.dir,p.lead,p.sup].forEach(id=>{const t=tal(id);if(t)t.busy=S.week+2});
 news('Test screening for "'+p.title+'": audiences scored it '+p.test+'/100.',p.test>=70?'ok':p.test<45?'bad':'');

 const est=10*era()*st*S.heat[p.genre]*TIER[p.tier].screens*2.4;
 p.stage='theaters';p.open=0;p.total=0;p.wk=0;p.factors={st,comp:1,luck:1,heat:S.heat[p.genre],sea:1};
 const f={title:p.title,total:0,open:0,genre:p.genre};

 S.totalProfit+=p.profit;
 const ratio=(f.total+(p.intl||0)*.5)/(10*era());
 S.fame=clamp(S.fame+clamp(ratio*2,0,9)-(p.profit<0?1:0),0,100);
 S.prestige=clamp(S.prestige+Math.max(0,(p.critic-62)/4),0,100);
 [p.dir,p.lead,p.sup].forEach((id,i)=>{const t=tal(id);if(t){t.fame=clamp(t.fame+clamp(ratio*(i===2?.8:1.5),-2,8)+(p.critic>75?2:0)-(p.profit<0?2:0),3,99);t.skill=clamp(t.skill+(R()<.4?1:0),5,99);t.busy=0;t.films++;t.mood=clamp(t.mood+(p.profit>0?10:-8),0,100)}});
 if(S.ipo)S.ipo.price*=1+clamp(p.profit/Math.max(p.cost,.01)*.06,-.12,.15);
 unlock('first');if(p.profit>0)unlock('hit');if(p.profit/era()<-20)unlock('flop');
 if(p.tier==='low'&&f.total>12*p.cost)unlock('nka');
 // IP

 else if(p.profit>0&&f.total>5*era()&&!p.teamup){S.ips.push({id:'ip'+(S.seq++),title:p.title,genre:p.genre,theme:p.theme,tier:p.tier,sc:{...p.sc},brand:clamp(20+(f.total/era())/1.5+(p.critic-50)/3,10,100),entries:1,last:yearOf(S.week),lead:p.lead,dir:p.dir});news('"'+p.title+'" is now a franchise you can build on.','gold')}
 if(p.teamup)unlock('teamup');
 const verdict=p.profit>p.cost*1.5?'A smash hit':p.profit>0?'In the black':p.profit>-p.cost*.4?'A modest loss':'A flop';

 if(key==='tower'){openModal(mh('Executive tower',esc(S.name))+`<div class="mb"><p>You are a <b class="gold">${r.r[1]}</b>.</p>${r.nx?`<p class="muted">Next rank: ${r.nx[1]}. Grow fame, prestige and profit to rise.</p><div class="bar"><i style="width:${clamp((r.sc-r.r[0])/(r.nx[0]-r.r[0])*100,2,100)}%"></i></div>`:'<p>You have reached the top of Hollywood.</p>'}<div class="est"><div><small>Fame</small><b>${Math.round(S.fame)}</b></div><div><small>Prestige</small><b>${Math.round(S.prestige)}</b></div><div><small>Reputation</small><b class="${S.rep>=0?'ok':'bad'}">${S.rep>0?'+':''}${Math.round(S.rep)}</b></div><div><small>Lifetime profit</small><b class="${S.totalProfit>=0?'ok':'bad'}">${money(S.totalProfit)}</b></div><div><small>Goldies won</small><b class="gold">${S.awards.filter(a=>a.mine).length}</b></div></div></div><div class="mf"><button class="btn gold" data-act="close">Done</button></div>`);return}
 const max=l>=b.max,cost=b.cost(l)*era();
 const parkLocked=key==='park'&&l===0&&!['Major studio','Hollywood legend'].includes(r.r[1]);
 const eff={stage:`You have ${l} sound stage${l!==1?'s':''}. ${freeStages()} free right now.`,writers:`Writes ${l} original script${l>1?'s':''} at a time, ${Math.max(2,7-l)} weeks for a mid-budget film. Rewrites add +${4+2*l} story. ${5+l} scripts on the market.`,post:`Post takes ${Math.max(1,4-Math.floor(l/2))} weeks. Post quality ${45+l*10}/100.`,marketing:`Marketing reach ×${(1+.15*(l-1)).toFixed(2)}.`,lab:l?`${l} research point${l>1?'s':''} a week, plus a prestige bonus.`:'Not built yet. You need a lab to research new technology.',backlot:l?`Built: ${BACKLOTS.slice(0,l).map(x=>x[0]).join(', ')}. Matching films cost 15% less to shoot.`:'No standing sets yet.',park:l?`Level ${l}. Earns more when your franchises are strong.`:'Not built. Needs Major studio rank and at least one franchise.'}[key];
 const next={stage:`Add sound stage ${l+1}: shoot ${l+1} films at once.`,writers:`Level ${l+1}: write ${l+1} scripts at once, faster and better. One more script on the market.`,post:`Level ${l+1}: post quality ${55+l*10}/100, faster post.`,marketing:`Level ${l+1}: marketing reach ×${(1+.15*l).toFixed(2)}.`,lab:l?`Level ${l+1}: ${l+1} research points a week.`:'Build the lab and start researching.',backlot:BACKLOTS[l]?`Build the ${BACKLOTS[l][0].toLowerCase()}: ${BACKLOTS[l][1].join(', ').toLowerCase()} films cost 15% less.`:'',park:`Level ${l+1}: more rides, more visitors.`}[key];
 openModal(mh(b.max>1?'Level '+l+' of '+b.max:'Studio',b.n)+`<div class="mb"><p class="muted">${b.d}</p><p>${eff}</p>${max?'<p class="gold">Fully upgraded.</p>':`<div class="panel" style="background:var(--p2)"><b>${next}</b><div class="muted" style="margin-top:4px">Costs ${money(cost)}. Adds weekly upkeep.</div></div>`}${parkLocked?'<p class="warn">Reach Major studio rank to build a theme park.</p>':''}</div><div class="mf"><button class="btn text" data-act="close">Close</button>${key==='lab'&&l>0?'<button class="btn plain" data-act="tab" data-t="research">Open research</button>':''}${max?'':`<button class="btn gold" data-act="upgrade" data-k="${key}" ${S.cash<cost||parkLocked?'disabled':''}>${l===0||key==='stage'?'Build for ':'Upgrade for '}${money(cost)}</button>`}</div>`);
}
function upgrade(key){const b=BLD[key],l=S.b[key];const cost=b.cost(l)*era();if(S.cash<cost||l>=b.max)return;spend(cost,'Built: '+b.n);S.b[key]++;news((key==='stage'?'Sound stage '+S.b[key]+' is open for business':b.n+' '+(l===0?'built':'upgraded to level '+S.b[key]))+'.','gold');toast('<b>'+b.n+'</b> '+(l===0||key==='stage'?'built':'upgraded')+'.');if(key==='park')unlock('park');chime('ok');save();closeModal();render()}

function scriptModal(id){
 const s=S.scripts.find(x=>x.id===id);if(!s)return;
 const fit=themeFit(s.genre,s.theme);
 const heatP=S.heat[s.genre]>1.12?'<span class="pill ok">'+s.genre+' is hot</span>':S.heat[s.genre]<.85?'<span class="pill bad">'+s.genre+' is cold</span>':'<span class="pill">'+s.genre+' is steady</span>';
 openModal(mh(s.genre+', '+s.theme.toLowerCase()+', '+TIER[s.tier].n.toLowerCase(),esc(s.title))+`<div class="mb"><div class="top2" style="display:grid;grid-template-columns:90px minmax(0,1fr);gap:14px">${poster({title:s.title,genre:s.genre,theme:s.theme,studio:S.name},90)}<div><p style="font-family:var(--serif);font-style:italic;font-size:17px;margin-top:0">${esc(s.logline)}</p><div class="tags">${heatP}<span class="pill ${fit>0?'ok':fit<0?'bad':''}">${fit>0?'Great genre and theme combo':fit<0?'Awkward genre and theme combo':'Neutral combo'}</span><span class="pill">${s.source}</span><span class="pill">Option ends ${weekLbl(s.expires)}</span></div></div></div>
 ${statRows(s.sc)}
 <p class="muted" style="margin-top:12px">Script reader's note: ${coverage(s)}</p>
 <div class="est"><div><small>Price</small><b class="gold">${money(s.price)}</b></div><div><small>Typical shoot cost</small><b>${money(TIER[s.tier].prod*cEra())}</b></div><div><small>Typical marketing</small><b>${money(TIER[s.tier].pa*cEra())}</b></div></div></div>
 <div class="mf"><button class="btn text" data-act="close">Pass</button><button class="btn gold" data-act="buy" data-id="${s.id}" ${S.cash<s.price?'disabled':''}>Buy script for ${money(s.price)}</button></div>`);
}
function coverage(s){const a=s.sc;const best=Object.entries({hook:a.hook,story:a.story,characters:a.chars}).sort((x,y)=>y[1]-x[1]);const lo=best[2],hi=best[0];return `Strong ${hi[0]}${hi[1]>75?', genuinely exciting':''}. The ${lo[0]} ${lo[1]<40?'needs real work':'could be sharper'}. ${a.comm>70?'Very commercial.':a.comm<40?'A hard sell to a wide audience.':'Decent mainstream appeal.'}`}
function statRows(sc){return [['Hook',sc.hook],['Story',sc.story],['Characters',sc.chars],['Commercial',sc.comm]].map(([n,v])=>`<div class="srow"><span class="muted">${n}</span><span class="bar"><i style="width:${v}%"></i></span><span class="num">${Math.round(v)}</span></div>`).join('')}
function newProject(o){const p=Object.assign({id:'p'+(S.seq++),stage:'dev',cost:0,rev:0,rewrites:0,qMod:0,events:0,shot:0,appealMod:0,seq:1},o);S.projects.push(p);return p}
function buyScript(id){const s=S.scripts.find(x=>x.id===id);if(!s||S.cash<s.price)return;spend(s.price,'Script: '+s.title);S.scripts=S.scripts.filter(x=>x!==s);
 newProject({title:s.title,genre:s.genre,theme:s.theme,tier:s.tier,sc:{...s.sc},logline:s.logline,source:s.source,cost:s.price});
 news('You bought "'+s.title+'".');toast('<b>'+esc(s.title)+'</b> is yours. Next: cast it in Films.');chime('ok');save();closeModal();tab='films';render()}
function rewrite(id){const p=S.projects.find(x=>x.id===id);const c=(.08*TIER[p.tier].m)*era();if(S.cash<c)return;spend(c,'Rewrite: '+p.title,p);
 const boost=4+2*S.b.writers;p.rewrites++;if(p.rewrites>2){p.sc.story=clamp(p.sc.story-3,5,99);toast('Too many cooks: the extra rewrite hurt the story.')}else{p.sc.story=clamp(p.sc.story+boost,5,99);p.sc.chars=clamp(p.sc.chars+Math.round(boost*.6),5,99)}
 p.stage='rewrite';p.left=2;save();render()}

/* casting */
let castSel={};
function castModal(id){const p=S.projects.find(x=>x.id===id);castSel={pid:id,dir:p.dir||null,lead:p.lead||null,sup:p.sup||null,role:'dir'};drawCast()}
function lockReason(t){if(needP(t)>S.prestige)return 'Needs prestige '+needP(t);if(t.mood<25)return 'Won\'t work with you';if(S.rep<-20&&t.fame>55)return 'Avoids your studio';return ''}
function drawCast(){
 const p=S.projects.find(x=>x.id===castSel.pid);
 const mine=[p.dir,p.lead,p.sup];
 const avail=t=>active(t)&&(!t.busy||mine.includes(t.id));
 const role=castSel.role;const want=role==='dir'?'director':'actor';
 const others=[castSel.dir,castSel.lead,castSel.sup].filter((x,i)=>x&&['dir','lead','sup'][i]!==role);
 const list=S.talent.filter(t=>t.role===want&&avail(t)&&!others.includes(t.id)).map(t=>({t,fit:(t.genres.includes(p.genre)?18:0)+t.skill*.6+t.fame*.4-(lockReason(t)?30:0)})).sort((a,b)=>b.fit-a.fit).slice(0,10);
 const row=t=>{const lk=lockReason(t);const f=role==='sup'?feeOf(t)*.45:feeOf(t);const sel=castSel[role]===t.id;const match=t.genres.includes(p.genre);
  const rel=role!=='dir'?relOf(t.id,castSel.dir)+(role==='sup'?relOf(t.id,castSel.lead):0):relOf(t.id,castSel.lead);
  return `<button class="opt" data-act="pick" data-id="${t.id}" aria-pressed="${sel}" ${lk?'disabled':''}><div class="person">${portrait(t,44,ageOf(t))}<div><b>${esc(t.name)}</b><br><small>Skill ${Math.round(t.skill)} · Fame ${Math.round(t.fame)} · Age ${ageOf(t)} · ${t.genres.map(g=>g===p.genre?'<span class="gold">'+g+'</span>':g).join(', ')}</small>${rel>=40?'<br><small class="ok">Friends with your cast</small>':rel<=-40?'<br><small class="bad">Feuds with your cast</small>':''}</div><div style="text-align:right"><b class="num">${money(f)}</b><br><small>${lk||(match?'Genre match':(t.ego>78?'Big ego':''))}</small></div></div></button>`};
 const cast={dir:castSel.dir,lead:castSel.lead,sup:castSel.sup};
 const ok=cast.dir&&cast.lead&&cast.sup;
 const q=ok?craftOf(p,1,1,cast):0,ap=ok?appealOf(p,1,cast):0;
 const fees=['dir','lead','sup'].reduce((a,k)=>{const id=castSel[k];if(!id||id===p[k])return a;const t=tal(id);return a+(k==='sup'?feeOf(t)*.45:feeOf(t))},0);
 const chip=(k,lab)=>{const t=tal(castSel[k]);return `<button class="opt" data-act="crole" data-k="${k}" aria-pressed="${role===k}" style="margin:0"><small>${lab}</small><br><b>${t?esc(t.name):'Choose'}</b></button>`};
 openModal(mh('Casting, '+p.genre.toLowerCase()+' about '+p.theme.toLowerCase(),esc(p.title))+`<div class="mb"><div class="segs">${chip('dir','Director')}${chip('lead','Lead actor')}${chip('sup','Supporting actor')}</div>
 <h3 style="margin-top:14px">${{dir:'Choose a director',lead:'Choose a lead actor',sup:'Choose a supporting actor'}[role]}</h3>${list.map(x=>row(x.t)).join('')||'<p class="muted">Nobody is available right now.</p>'}
 <div class="est"><div><small>Expected quality</small><b class="gold">${ok?Math.round(q)+' ±10':'—'}</b></div><div><small>Audience appeal</small><b>${ok?Math.round(ap):'—'}</b></div><div><small>Fees to pay now</small><b>${money(fees)}</b></div></div>
 <p class="muted" style="margin-top:10px;font-size:13px">Gold genres match this film. Friends work well together; feuds hurt quality. Famous stars need more studio prestige.</p></div>
 <div class="mf"><button class="btn text" data-act="close">Cancel</button><button class="btn gold" data-act="cast" ${ok&&S.cash>=fees?'':'disabled'}>Sign the cast for ${money(fees)}</button></div>`,true);
}
function pickTalent(id){castSel[castSel.role]=id;const order=['dir','lead','sup'];const nx=order.find(k=>!castSel[k]);if(nx)castSel.role=nx;drawCast()}
function confirmCast(){const p=S.projects.find(x=>x.id===castSel.pid);let fees=0;['dir','lead','sup'].forEach(k=>{const id=castSel[k];if(p[k]!==id){if(p[k]){const o=tal(p[k]);if(o)o.busy=0}const t=tal(id);fees+=k==='sup'?feeOf(t)*.45:feeOf(t);p[k]=id;t.busy=S.week+60}});
 if(fees>0)spend(fees,'Talent fees: '+p.title,p);p.stage='ready';
 news(tal(p.lead).name+' and '+tal(p.sup).name+' star in "'+p.title+'", directed by '+tal(p.dir).name+'.');toast('Cast signed. Next: greenlight <b>'+esc(p.title)+'</b>.');chime('ok');save();closeModal();render()}

/* greenlight */
let glSel={};
function greenlightModal(id){const p=S.projects.find(x=>x.id===id);glSel={pid:id,level:1,pace:1};drawGL()}
function glNumbers(p){const T=TIER[p.tier];const pc=PACES[glSel.pace],lv=LEVELS[glSel.level];const wk=Math.max(2,Math.round(T.weeks*pc.w*(has('virtual')?.8:1)));const prod=T.prod*lv.m*(pc.w<1?.9:pc.w>1?1.12:1)*cEra()*costMods(p);return{wk,prod}}
function drawGL(){
 const p=S.projects.find(x=>x.id===glSel.pid);const T=TIER[p.tier];
 const {wk,prod}=glNumbers(p);
 const q=craftOf(p,glSel.level,glSel.pace),ap=appealOf(p,glSel.level);
 const fs=freeStages(),striking=S.strike&&S.strike.until>S.week;
 const inv=S.investor&&S.investor.left>0;const broke=S.cash-prod<-10*cEra();
 openModal(mh('Greenlight meeting',esc(p.title))+`<div class="mb"><h3>Production budget</h3><div class="segs">${LEVELS.map((l,i)=>`<button class="opt" data-act="gl" data-k="level" data-v="${i}" aria-pressed="${glSel.level===i}"><b>${l.n}</b><br><small>${l.d}</small><br><small class="gold">${money(T.prod*l.m*cEra()*costMods(p))}</small></button>`).join('')}</div>
 <h3 style="margin-top:16px">Shooting pace</h3><div class="segs">${PACES.map((l,i)=>`<button class="opt" data-act="gl" data-k="pace" data-v="${i}" aria-pressed="${glSel.pace===i}"><b>${l.n}</b><br><small>${l.d}</small><br><small>${Math.max(2,Math.round(T.weeks*l.w*(has('virtual')?.8:1)))} weeks</small></button>`).join('')}</div>
 <div class="est"><div><small>Shoot cost</small><b class="gold">${money(prod)}</b></div><div><small>Weeks on a stage</small><b>${wk}</b></div><div><small>Expected quality</small><b>${Math.round(q)} ±10</b></div><div><small>Audience appeal</small><b>${Math.round(ap)}</b></div></div>
 ${inv?`<p class="info" style="margin-top:10px">Your investor will pay ${money(prod*.4)} of this and take 35% of the film's profit.</p>`:''}
 ${costMods(p)<1?'<p class="ok" style="font-size:13px;margin-top:8px">Your technology and backlot sets lower this film\'s costs.</p>':''}
 <p class="muted" style="font-size:13px;margin-top:10px">${dept(p,q,ap,prod)}</p>
 ${broke&&!striking?'<p class="err">This shoot would bankrupt the studio. Pick a cheaper budget, borrow from the bank, or wait for more cash.</p>':''}${striking?'<p class="warn">Hollywood is on strike. Nothing can be greenlit until it ends.</p>':fs<=0?'<p class="warn">All sound stages are busy. Wait for a shoot to finish, or build another stage.</p>':''}</div>
 <div class="mf"><button class="btn text" data-act="close">Not yet</button><button class="btn gold" data-act="greenlight" ${fs<=0||striking||broke?'disabled':''}>Greenlight: start shooting</button></div>`,true);
}
function dept(p,q,ap,prod){const m=ap>65?'Marketing loves it: "Easy to sell."':ap<40?'Marketing is worried: "Who is this for?"':'Marketing: "We can work with this."';const f=prod>S.cash?' Finance warns this will push you into debt.':' Finance signs off.';const c=q>72?' Creative: "This could be special."':q<50?' Creative: "The script needs help."':'';return m+f+c}
function greenlight(){const p=S.projects.find(x=>x.id===glSel.pid);if(freeStages()<=0)return;const {wk,prod}=glNumbers(p);p.level=glSel.level;p.pace=glSel.pace;p.stage='shoot';p.left=wk;p.weeks=wk;p.weekly=prod/wk;p.budget=prod;
 if(S.investor&&S.investor.left>0){earn(prod*.4,'Investor funding: '+p.title,p);p.inv=.35;S.investor.left--;if(S.investor.left<=0){S.investor=null;news('Your investor deal is complete.')}}
 news('"'+p.title+'" is greenlit. Cameras roll next week.','gold');toast('<b>'+esc(p.title)+'</b> is greenlit.');chime('ok');save();closeModal();render()}

  {l:'Insist they do it',x:()=>'Half chance of a great shot (+3), half chance of injury',f:p=>{if(R()<.5){p.qMod+=3;toast('They nailed it. The shot looks incredible.')}else{p.qMod-=2;p.left++;tal(p.lead).mood-=10;toast('An injury. One extra week of shooting.')}}},

  {l:'Add a second unit',x:p=>'Costs '+money(p.budget*.08)+', quality +2',f:p=>{spend(p.budget*.08,'Second unit',p);p.qMod+=2}}]},
 {t:'A tantrum in the star trailer',d:p=>tal(p.lead).name+' won\'t come out until demands are met.',c:[
  {l:'Meet the demands',x:p=>'Costs '+money(.05*TIER[p.tier].m*era()),f:p=>spend(.05*TIER[p.tier].m*era(),'Star perks',p)},

  {l:'Have a firm talk',x:()=>'Could inspire (+2) or backfire (−4)',f:p=>{if(R()<.55){p.qMod+=2;toast('They came back focused. Quality +2.')}else{p.qMod-=4;tal(p.lead).mood-=12;toast('It backfired badly. Quality −4.')}}}]},
 {t:'Pages leak to the press',d:()=>'A trade paper printed the ending. Everyone is talking about it.',c:[

 {t:'Magic on set',d:p=>tal(p.lead).name+' and '+tal(p.sup).name+' improvised a scene that left the crew in tears.',c:[

  {l:'Stick to the script',x:()=>'No effect',f:()=>{}}]},
 {t:'Co-stars at war',d:p=>tal(p.lead).name+' and '+tal(p.sup).name+' refuse to share a scene.',c:[
  {l:'Shoot them separately',x:()=>'Quality −2',f:p=>{p.qMod-=2}},

 {t:'The effects are over budget',d:()=>'The effects team needs more money to finish the big sequence.',c:[

function eventModal(p){
 if(p.stage!=='shoot'){done();return}
 const e=pick(EVENTS);S._ev={pid:p.id,e:EVENTS.indexOf(e)};
 openModal(mh('On set: '+esc(p.title)+', week '+(p.shot)+' of '+(p.shot+p.left),e.t,false)+`<div class="mb"><p class="muted">${esc(e.d(p))}</p>${e.c.map((c,i)=>`<button class="opt" data-act="evc" data-i="${i}"><div class="choice"><b>${c.l}</b><small>${c.x(p)}</small></div></button>`).join('')}</div>`);
}
function eventChoice(i){const p=S.projects.find(x=>x.id===S._ev.pid);EVENTS[S._ev.e].c[i].f(p);delete S._ev;save();done()}

/* scandal */
function scandalModal(p){
 const t=tal(pick([p.lead,p.sup,p.dir].filter(Boolean)));if(!t){done();return}
 const what=pick(['was arrested after a late-night car crash','had private letters leaked to the papers','was caught in a bitter public feud','made shocking remarks in an interview','was photographed at a wild party','is accused of mistreating the crew']);
 S._sc={pid:p.id,tid:t.id};const early=yearOf(S.week)<1970;const pre=['dev','ready'].includes(p.stage);
 const ch=[['stand','Stand by them','Reputation −4, their mood +15, film appeal −4'],['distance','Distance the studio','Reputation +3, their mood −20'],pre?['recast','Recast the role','They leave the film. Their mood −30']:null,early?['cover','Cover it up','Costs '+money(.1*era())+'. If it comes out later: reputation −10']:null].filter(Boolean);
 openModal(mh('Scandal: '+esc(p.title),esc(t.name)+' '+what,false)+`<div class="mb"><div class="person" style="grid-template-columns:64px 1fr">${portrait(t,64,ageOf(t))}<p class="muted" style="margin:0">The press wants a statement from ${esc(S.name)} by tonight.</p></div>${ch.map(c=>`<button class="opt" data-act="scc" data-v="${c[0]}"><div class="choice"><b>${c[1]}</b><small>${c[2]}</small></div></button>`).join('')}</div>`);
}
function scandalChoice(v){const p=S.projects.find(x=>x.id===S._sc.pid),t=tal(S._sc.tid);

 ${yr>=2000?`<h3 style="margin-top:12px">Home release window</h3><div class="segs">${[['90 days','Theaters happy, less home money'],['45 days','The usual balance'],['17 days','More home money, faster theater drop']].map((w,i)=>`<button class="opt" data-act="win" data-v="${i}" aria-pressed="${relSel.window===i}"><b>${w[0]}</b><br><small>${w[1]}</small></button>`).join('')}</div>`:''}

function lotSVG(){
 const s=21,ox=196,oy=100;
 const P=(x,y,z=0)=>[(ox+(x-y)*s*.866).toFixed(1),(oy+(x+y)*s*.5-z).toFixed(1)];
 const poly=(pts,a)=>`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" ${a}/>`;
 const box=(x,y,w,d,h,o)=>{const own=o.own;const st=own?'stroke="#D4AF37" stroke-opacity=".55" stroke-width="1"':'stroke="#5a6585" stroke-dasharray="4 3" stroke-width="1" fill="none"';
  if(!own)return poly([P(x,y),P(x+w,y),P(x+w,y+d),P(x,y+d)],st+' class="tp"');
  if(o.flat){let g=poly([P(x,y),P(x+w,y),P(x+w,y+d),P(x,y+d)],'fill="'+o.top+'" '+st+' class="tp"');(o.deco||[]).forEach(dd=>g+=dd(P));return g}
  let g=poly([P(x,y+d,0),P(x+w,y+d,0),P(x+w,y+d,h),P(x,y+d,h)],'fill="#1c2440" '+st)+poly([P(x+w,y,0),P(x+w,y+d,0),P(x+w,y+d,h),P(x+w,y,h)],'fill="#252e4c" '+st)+poly([P(x,y,h),P(x+w,y,h),P(x+w,y+d,h),P(x,y+d,h)],'fill="'+(o.top||'#2E3854')+'" class="tp" '+st);
  if(o.win){for(let i=1;i<o.win;i++){const z=h*i/o.win;g+=`<line x1="${P(x,y+d,z)[0]}" y1="${P(x,y+d,z)[1]}" x2="${P(x+w,y+d,z)[0]}" y2="${P(x+w,y+d,z)[1]}" stroke="var(--era)" stroke-opacity=".3"/>`}}
  if(o.arch){const a=P(x+w,y+d*.3,0),b=P(x+w,y+d*.7,0),c=P(x+w,y+d*.7,h*.45),e=P(x+w,y+d*.3,h*.45);g+=poly([a,b,c,e],'fill="#141a2e" stroke="#D4AF37" stroke-opacity=".4"')}
  if(o.dome){const c=P(x+w/2,y+d/2,h);g+=`<ellipse cx="${c[0]}" cy="${c[1]}" rx="${s*.7}" ry="${s*.4}" fill="#3a466a" stroke="#D4AF37" stroke-opacity=".6"/>`}
  return g};
 const shooting=S.projects.filter(p=>p.stage==='shoot');
 const B=[
  {k:'tower',x:.5,y:.5,w:2,d:2,h:70+rankOf().sc/8,own:true,win:8,top:'#3a3220',label:'Tower'},
  {k:'writers',x:3.6,y:.5,w:1.8,d:1.6,h:26+S.b.writers*3,own:true,win:2,label:'Writers'},
  {k:'marketing',x:6.3,y:.5,w:2,d:1.6,h:30+S.b.marketing*4,own:true,win:3,label:'Marketing'},

 <div class="sec"><h3>Franchises</h3><span class="muted">Merchandise ${money(merch)} a week</span></div>
 ${S.ips.length?`<div class="cards">${S.ips.map(ip=>{const busy=S.projects.some(p=>p.ip===ip.id&&p.stage!=='done');return `<article class="card"><div class="top2">${poster({title:ip.title,genre:ip.genre,theme:ip.theme,studio:S.name},64)}<div><div class="ttl">${esc(ip.title)}</div><div class="meta">${ip.genre} · ${ip.entries} film${ip.entries>1?'s':''} · last in ${ip.last}</div><div class="srow"><span class="muted">Brand</span><span class="bar"><i style="width:${ip.brand}%"></i></span><span>${Math.round(ip.brand)}</span></div></div></div><div class="acts"><button class="btn gold sm" data-act="seq" data-id="${ip.id}" ${busy?'disabled':''}>${busy?'Sequel in progress':'Make a sequel'}</button></div></article>`}).join('')}</div>`:'<div class="panel"><p class="muted" style="margin:0">Profitable hits become franchises. Then you can make sequels, sell toys and build rides.</p></div>'}
 <div class="grid2" style="margin-top:16px"><div class="panel"><h3>Streaming service</h3>${S.streamer?`<div class="kv"><span>Subscribers</span><b>${S.streamer.subs.toFixed(2)}M</b></div><div class="kv"><span>Price</span><b>$${S.streamer.price} a month</b></div>`:`<p class="muted">${has('stream')?'Ready to launch.':'Research "Own streaming service" first (from 2007).'}</p>`}<button class="btn ghost sm" data-act="stream" style="margin-top:10px">${S.streamer?'Manage':'Learn more'}</button></div>
 <div class="panel"><h3>Theme park</h3><p class="muted">${S.b.park?'Level '+S.b.park+'. Rides based on your strongest franchises.':'Open a park once you are a Major studio with franchises.'}</p><button class="btn ghost sm" data-act="bld" data-k="park">${S.b.park?'Upgrade':'See details'}</button></div></div>`;
}
function vMoney(){
 const h=S.cashHist,mx=Math.max(...h,1),mn=Math.min(...h,0);const W=600,H=160;
 const pts=h.map((v,i)=>[(i/(Math.max(h.length-1,1)))*W,H-((v-mn)/(mx-mn||1))*H]);
 const zero=H-((0-mn)/(mx-mn||1))*H;
 const upkeep=(S.b.stage*.02+S.b.writers*.008+S.b.post*.01+S.b.marketing*.01+S.b.lab*.012+S.b.backlot*.015+S.b.park*.15)*era();
 const yr=yearOf(S.week);const yrInc=S.ledger.filter(l=>yearOf(l.w)===yr&&l.a>0).reduce((a,l)=>a+l.a,0);
 return `<div class="head"><div><h2>Money</h2><p>Cash, costs, loans and investors.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-act="loan">Bank loans</button>${S.offer&&!S.investor?'<button class="btn gold" data-act="inv">Investor offer</button>':''}<button class="btn plain" data-act="ipom">${S.ipo?'Shares':'Go public'}</button></div></div>
 <div class="est" style="margin:0 0 16px"><div><small>Cash</small><b class="gold">${money(S.cash)}</b></div><div><small>Income this year</small><b>${money(yrInc)}</b></div><div><small>Weekly upkeep</small><b>${money(upkeep+S.loans*S.mods.rate/52)}</b></div><div><small>Loans</small><b>${money(S.loans)}</b></div><div><small>Lifetime profit</small><b class="${S.totalProfit>=0?'ok':'bad'}">${money(S.totalProfit)}</b></div>${S.ipo?`<div><small>Share price</small><b>$${S.ipo.price.toFixed(2)}</b></div>`:''}${S.investor?`<div><small>Investor deal</small><b>${S.investor.left} film${S.investor.left>1?'s':''} left</b></div>`:''}</div>
 <div class="panel"><h3>Cash over time</h3><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:160px;display:block;margin-top:10px" role="img" aria-label="Cash over time"><line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="#323B55" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/><polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#D4AF37" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="prog" style="margin-top:4px"><span>${money(mn)} low</span><span>${money(mx)} high</span></div></div>
 <div class="sec"><h3>Recent transactions</h3></div><div class="panel scroll" style="padding:0"><table><tbody>${S.ledger.slice(0,25).map(l=>`<tr><td class="muted" style="white-space:nowrap">${dateStr(l.w)}</td><td>${esc(l.t)}</td><td class="r num ${l.a>=0?'ok':''}">${l.a>=0?'+':''}${money(l.a)}</td></tr>`).join('')||'<tr><td class="muted">No transactions yet.</td></tr>'}</tbody></table></div>`;
}
function vFame(){
 const got=ACH.filter(a=>S.ach[a[0]]).length;const mine=S.awards.filter(a=>a.mine);
 const best=S.projects.filter(p=>p.stage==='done').sort((a,b)=>(b.total+(b.intl||0))-(a.total+(a.intl||0))).slice(0,5);
 return `<div class="head"><div><h2>Hall of Fame</h2><p>${got} of ${ACH.length} achievements · ${mine.length} Goldie${mine.length!==1?'s':''}.</p></div></div>
 <div class="ach">${ACH.map(a=>`<div class="${S.ach[a[0]]?'got':''}"><i>${S.ach[a[0]]?'★':'☆'}</i><span><b>${a[1]}</b><small>${a[2]}</small></span></div>`).join('')}</div>
 <div class="grid2" style="margin-top:16px"><div class="panel"><h3>Your biggest hits</h3>${best.length?best.map(p=>`<div class="kv"><span>${esc(p.title)}</span><b class="num">${money(p.total+(p.intl||0))}</b></div>`).join(''):'<p class="muted">No films released yet.</p>'}</div>
 <div class="panel"><h3>Your Goldies</h3>${mine.length?mine.map(a=>`<div class="kv"><span class="muted">${a.year} ${a.cat}</span><span class="gold">${esc(a.title)}</span></div>`).join(''):'<p class="muted">None yet. Critics\' favourites win.</p>'}</div></div>`;
}
function vMore(){return `<div class="head"><div><h2>More</h2><p>${dateStr(S.week)} · ${rankOf().r[1]}</p></div></div><div class="more">${[['talent','Talent','Stars and directors'],['research','Research','New technology'],['empire','Empire','Franchises, streaming, park'],['money','Money','Cash, loans, investors'],['fame','Hall of Fame','Awards and achievements']].map(([k,n,d])=>`<button data-act="tab" data-t="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg><b>${n}</b><small>${d}</small></button>`).join('')}<button data-act="help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg><b>How to play</b><small>The basics</small></button><button data-act="mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/></svg><b>${muted?'Sound off':'Sound on'}</b><small>Tap to switch</small></button><button data-act="newgame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><b>New studio</b><small>Start over</small></button></div>`}

/* ---------- auto ---------- */
function stopAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null}}
function toggleAuto(){if(autoTimer){stopAuto();render();return}autoTimer=setInterval(()=>{if(!busy)advance()},1100);render()}

/* ---------- splash ---------- */
let setup={start:2,diff:1,hist:true};
function splash(){
 const saved=load();const sv=saved&&!saved.over&&saved.v===2;
 $('#splash').style.display='flex';
 $('#splash').innerHTML=`<div class="in"><svg class="deco" viewBox="0 0 320 60" aria-hidden="true"><line x1="0" y1="30" x2="120" y2="30" stroke="#D4AF37" stroke-opacity=".5"/><line x1="200" y1="30" x2="320" y2="30" stroke="#D4AF37" stroke-opacity=".5"/><circle cx="160" cy="30" r="22" fill="none" stroke="#D4AF37"/><circle cx="160" cy="30" r="5" fill="#D4AF37"/>${[0,1,2,3,4].map(i=>{const a=i/5*Math.PI*2-Math.PI/2;return `<circle cx="${160+Math.cos(a)*13}" cy="${30+Math.sin(a)*13}" r="4" fill="none" stroke="#D4AF37"/>`}).join('')}</svg>
 <h1>Reel Empire</h1><p class="tag">From garage filmmaker to Hollywood legend</p>
 <form id="nf" class="setup" novalidate>${sv?`<button type="button" class="btn gold" style="width:100%;margin-bottom:16px" data-act="continue">Continue ${esc(saved.name)}, ${MONTHS[Math.min(11,Math.floor((((saved.week-1)%52))/4.34))]} ${saved.startYear+Math.floor((saved.week-1)/52)}</button>`:''}
 <label for="sn" class="muted" style="font-size:13px">Name your studio</label><input type="text" id="sn" maxlength="28" placeholder="Silver Lantern Pictures" autocomplete="off"><div class="err" id="snerr"></div>
 <h3>Starting era</h3><div class="segs">${STARTS.map((s,i)=>`<button type="button" class="opt" data-act="su" data-k="start" data-v="${i}" aria-pressed="${setup.start===i}"><b>${s.y}: ${s.n}</b><br><small>${s.d}</small></button>`).join('')}</div>
 <h3>Difficulty</h3><div class="segs" style="grid-template-columns:repeat(3,1fr)">${DIFFS.map((d,i)=>`<button type="button" class="opt" data-act="su" data-k="diff" data-v="${i}" aria-pressed="${setup.diff===i}"><b>${d.n}</b><br><small>${d.d}</small></button>`).join('')}</div>
 <h3>History</h3><button type="button" class="opt" data-act="su" data-k="hist" data-v="${setup.hist?0:1}" aria-pressed="${setup.hist}"><div class="choice"><b>Real Hollywood history</b><small>${setup.hist?'On: wars, TV, strikes, a pandemic and more':'Off: a calmer, invented timeline'}</small></div></button>
 <div class="row"><button type="submit" class="btn ${sv?'ghost':'gold'}">Open the studio gates</button></div>
 ${sv?'<p class="muted" style="font-size:12px;margin:12px 0 0">Starting a new studio replaces your saved game.</p>':''}</form></div>`;
 const nm=$('#sn');if(splash._name)nm.value=splash._name;
 nm.addEventListener('input',()=>{$('#snerr').textContent='';splash._name=nm.value});
 $('#nf').addEventListener('submit',e=>{e.preventDefault();const v=nm.value.trim();if(!v){$('#snerr').textContent='Enter a studio name first.';nm.focus();return}newGame(v,setup.start,setup.diff,setup.hist);$('#splash').style.display='none';tab='studio';render();help()});
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
 const a=t.dataset.act,id=t.dataset.id;
 switch(a){
  case 'tab':tab=t.dataset.t;closeModal();render();window.scrollTo(0,0);break;
  case 'next':advance();break;
  case 'auto':toggleAuto();break;
  case 'close':closeModal();break;
  case 'qdone':done();break;
  case 'bld':buildingModal(t.dataset.k);break;
  case 'upgrade':upgrade(t.dataset.k);break;
  case 'script':scriptModal(id);break;
  case 'write':writeModal();break;
  case 'wg':writeSel.genre=t.dataset.v;writeSel.sugg=null;writeSel.theme=null;{const sc=$('#modal').scrollTop;drawWrite();$('#modal').scrollTop=sc}break;
  case 'wth':writeSel.theme=t.dataset.v;{const sc=$('#modal').scrollTop;drawWrite();$('#modal').scrollTop=sc}break;
  case 'wtier':writeSel.tier=t.dataset.v;{const sc=$('#modal').scrollTop;drawWrite();$('#modal').scrollTop=sc}break;
  case 'wpick':writeSel.writer=id;{const sc=$('#modal').scrollTop;drawWrite();$('#modal').scrollTop=sc}break;
  case 'wgo':startWriting();break;
  case 'buy':buyScript(id);break;
  case 'castm':castModal(id);break;
  case 'crole':castSel.role=t.dataset.k;drawCast();break;
  case 'pick':pickTalent(id);break;
  case 'cast':confirmCast();break;
  case 'rewrite':rewrite(id);break;
  case 'drop':{const p=S.projects.find(x=>x.id===id);[p.dir,p.lead,p.sup].forEach(i=>{const tt=tal(i);if(tt)tt.busy=0});S.projects=S.projects.filter(x=>x!==p);news('"'+p.title+'" was shelved.');save();render();break}
  case 'glm':greenlightModal(id);break;
  case 'gl':glSel[t.dataset.k]=+t.dataset.v;drawGL();break;
  case 'greenlight':greenlight();break;
  case 'evc':eventChoice(+t.dataset.i);break;
  case 'scc':scandalChoice(t.dataset.v);break;
  case 'union':unionChoice(t.dataset.v);break;
  case 'relm':releaseModal(id);break;
  case 'tone':relSel.tone=t.dataset.v==='1';drawRel();break;
  case 'win':relSel.window=+t.dataset.v;drawRel();break;
  case 'fest':relSel.fest=!relSel.fest;drawRel();break;
  case 'wk':relSel.w=+t.dataset.w;drawRel();break;
  case 'schedule':schedule();break;
  case 'premdone':premDone();break;
  case 'revs':{const p=S.projects.find(x=>x.id===id);openModal(mh('Rotten Pears '+p.pears+'%','Reviews: '+esc(p.title))+`<div class="mb">${reviewsHTML(p)}</div><div class="mf"><button class="btn gold" data-act="close">Close</button></div>`);break}
  case 'pm':postMortem(S.projects.find(x=>x.id===id));break;
  case 'pmdone':if(busy)done();else closeModal();break;
  case 'camp0':campaignModal();break;
  case 'camp':{const v=+t.dataset.v*era();spend(v,'Awards campaign');S.campaign[id]=(S.campaign[id]||0)+v;save();campaignModal();render();break}
  case 'envelope':envelope();break;
  case 'awnext':S._aw.i++;drawAward();break;
  case 'awdone':delete S._aw;save();done();break;
  case 'loan':loanModal();break;
  case 'borrow':S.loans+=5*era();earn(5*era(),'Bank loan');save();loanModal();render();break;
  case 'repay':{const r=Math.min(S.loans,5*era());S.loans-=r;spend(r,'Loan repaid');save();loanModal();render();break}
  case 'inv':investorModal();break;
  case 'invyes':S.investor={left:3};S.offer=false;news('You signed a co-financing deal for your next three films.','ok');save();closeModal();render();break;
  case 'invno':S.offer=false;save();closeModal();render();break;
  case 'ipom':ipoModal();break;
  case 'ipo':{const v=ipoValue();S.ipo={price:20};earn(v*.25,'Stock market listing');news(S.name+' rings the opening bell. Shares list at $20.','gold');unlock('ipo');chime('win');save();closeModal();render();break}
  case 'stream':streamerModal();break;
  case 'slaunch':{const c=12*era();spend(c,'Streaming launch');S.streamer={subs:.5,price:9};news(S.name+'+ launches. Your library is now streaming.','gold');unlock('streamer');chime('win');save();streamerModal();render();break}
  case 'sprice':S.streamer.price=+t.dataset.v;save();streamerModal();break;
  case 'seq':sequelModal(id);break;
  case 'mkseq':makeSequel(id);break;
  case 'teamup':teamupModal();break;
  case 'mkteam':makeTeamup();break;
  case 'res':S.tech.cur=id;S.tech.pts=0;toast('Research started.');save();render();break;
  case 'tfilter':talentFilter=t.dataset.v;render();break;
  case 'tmodal':talentModal(id);break;
  case 'su':{const k=t.dataset.k;setup[k]=k==='hist'?t.dataset.v==='1':+t.dataset.v;splash();break}
  case 'help':help();break;
  case 'mute':muted=!muted;render();break;
  case 'newgame':stopAuto();closeModal();splash();break;
  case 'continue':S=load();$('#splash').style.display='none';render();break;
  case 'restart':busy=false;queue=[];closeModal();try{localStorage.removeItem(SAVE)}catch(e){}splash();break;
 }
});
document.addEventListener('input',e=>{if(e.target.dataset.act==='pa'){relSel.pa=+e.target.value;const sc=$('#modal').scrollTop;drawRel();$('#modal').scrollTop=sc;const r=$('#modal input[type=range]');r&&r.focus({preventScroll:true})}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#veil').classList.contains('show')&&$('#modal .x'))closeModal();
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g.b')){e.preventDefault();buildingModal(e.target.dataset.k)}
 if(e.key==='n'&&!e.target.matches('input')&&!$('#veil').classList.contains('show')&&S&&$('#splash').style.display==='none')advance();
});
$('#veil').addEventListener('click',e=>{if(e.target.id==='veil'&&$('#modal .x'))closeModal()});
splash();

</script>
</body>
</html>
