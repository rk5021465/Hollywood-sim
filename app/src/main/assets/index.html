<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hollywood Studio Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&family=Playfair+Display:wght@700;900&family=Creepster&family=Orbitron:wght@700&family=Cinzel:wght@700&family=Bangers&family=Pacifico&family=Special+Elite&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b10;--card:#1a1620;--card2:#241e2c;--gold:#e8b84a;--gold2:#ffd77a;--text:#f3ece0;--muted:#a99f92;--red:#ff5d62;--green:#3dd68c;--blue:#6aa8ff;--line:#2e2737}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#0d0b10}
body{background:radial-gradient(ellipse at top,#2a1d10 0%,var(--bg) 55%) fixed;color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
#app{max-width:540px;margin:0 auto;padding:12px 12px 90px}
h1,h2,h3,.bebas{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px;font-weight:400}
h1{font-size:44px;line-height:.95;color:var(--gold);text-shadow:0 0 24px rgba(232,184,74,.35)}
h2{font-size:28px;color:var(--gold);margin:4px 0 10px}
h3{font-size:21px}
small,.lbl{color:var(--muted);font-size:11px;letter-spacing:.7px;text-transform:uppercase}
p{line-height:1.45}
.muted{color:var(--muted)}.neg{color:var(--red)}.pos{color:var(--green)}.gold{color:var(--gold)}
.hud{display:grid;grid-template-columns:1.1fr .9fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:12px;position:sticky;top:6px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.hud div{display:flex;flex-direction:column}.hud b{font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px}
.opt{cursor:pointer;transition:.12s}.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px rgba(232,184,74,.18)}
.opt.locked{opacity:.42;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{background:var(--card2);border-radius:20px;padding:3px 9px;font-size:12px;color:var(--muted)}
.tag.hot{color:#ffb35c;background:#3a2412}.tag.good{color:var(--green);background:#123224}.tag.bad{color:var(--red);background:#3a1416}.tag.blue{color:var(--blue);background:#14243a}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;margin-top:9px;font-family:inherit;color:var(--text)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1206}
.btn.ghost{background:var(--card2);border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:14px;width:auto;display:inline-block;margin:6px 6px 0 0}
.btn:disabled{opacity:.38;cursor:not-allowed}
.bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.big{font-size:26px;font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;letter-spacing:1px}
input[type=text],textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;margin-top:6px;font-family:inherit}
input[type=range]{width:100%;accent-color:var(--gold);margin:8px 0 2px;height:28px}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.seg button{flex:1;min-width:60px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.seg button.on{border-color:var(--gold);color:var(--gold);background:#2e2414}
.steps{display:flex;gap:4px;margin-bottom:10px}.steps i{flex:1;height:4px;border-radius:3px;background:var(--card2)}.steps i.on{background:var(--gold)}
.film{display:flex;gap:10px;align-items:center}
.poster{width:44px;height:62px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid rgba(255,255,255,.08)}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}
.chart div{flex:1;background:linear-gradient(180deg,var(--gold2),#a8792a);border-radius:4px 4px 0 0;position:relative;min-height:2px;animation:grow .5s ease-out both}
.chart span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.news{font-size:14px;padding:8px 0;border-bottom:1px dashed var(--line)}.news:last-child{border:0}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(18,15,22,.97);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:9;padding-bottom:env(safe-area-inset-bottom)}
.tabbar div{display:flex;max-width:540px;width:100%}
.tabbar button{flex:1;min-width:0;background:none;border:0;color:var(--muted);padding:9px 0 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.tabbar button b{display:block;font-size:20px;margin-bottom:1px}
.tabbar button.on{color:var(--gold)}
.marquee{text-align:center;padding:22px 8px 8px}.lights{letter-spacing:5px;color:var(--gold);font-size:12px}
.trophy{font-size:54px;text-align:center;animation:pop .6s}@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.center{text-align:center}.section{margin:16px 0 8px;display:flex;justify-content:space-between;align-items:end}
.grade{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:42px;line-height:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:540px;max-height:85vh;overflow:auto;padding:16px 14px 28px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:600}td.r,th.r{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:var(--card2)}

/* ===== v3 visual layer ===== */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.scene{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;background:#0b0820}
.bulb{animation:blink 1s infinite}@keyframes blink{50%{fill:#fff8d0;opacity:.45}}
.beam1{transform-origin:90px 300px;animation:sweep 4s ease-in-out infinite alternate}.beam2{transform-origin:290px 300px;animation:sweep 5s ease-in-out infinite alternate-reverse}
@keyframes sweep{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.countup{font-family:'Bebas Neue',Impact;font-size:54px;color:var(--green);text-align:center;letter-spacing:1px;line-height:1}
.popcard{background:var(--card);border:2px solid var(--gold);border-radius:6px;padding:22px 16px;text-align:center;margin:10px 0;animation:pop .5s}
.stage{position:relative;background:radial-gradient(ellipse at 50% 0%,#5a3b10 0%,#160c06 60%,#0b0604 100%);border-radius:14px;overflow:hidden;min-height:430px;margin-bottom:10px;border:1px solid #5a3b10}
.curtain{position:absolute;top:0;bottom:0;width:22%;background:repeating-linear-gradient(90deg,#6b0f18 0 10px,#8a1622 10px 20px);box-shadow:inset -10px 0 20px #0008;z-index:2}
.curtain.l{left:0;border-bottom-right-radius:60% 10%}.curtain.r{right:0;border-bottom-left-radius:60% 10%;box-shadow:inset 10px 0 20px #0008}
.spot{position:absolute;left:50%;top:-20px;width:300px;height:520px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 0%,#fff6c855 0%,#fff6c811 50%,transparent 70%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);z-index:1}
.stage-in{position:relative;z-index:3;padding:18px 24% 18px;text-align:center}
@media(max-width:420px){.stage-in{padding:16px 18%}}
.nominee{display:flex;align-items:center;gap:8px;background:#0008;border:1px solid #5a3b10;border-radius:10px;padding:6px;margin:6px 0;text-align:left;font-size:13px}
.nominee.win{border-color:var(--gold);box-shadow:0 0 18px #ffd77a66;background:#3a2a0a}
.envelope{width:120px;height:80px;margin:16px auto;background:#f5e6c8;border-radius:4px;position:relative;box-shadow:0 6px 20px #000a;animation:wobble .6s infinite alternate}
.envelope:after{content:'';position:absolute;left:0;right:0;top:0;border-left:60px solid transparent;border-right:60px solid transparent;border-top:44px solid #e2cfa5}
@keyframes wobble{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.spinner{width:46px;height:46px;border:4px solid #ffd77a33;border-top-color:var(--gold);border-radius:50%;margin:14px auto;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.paper{background:#f3ead7;color:#1d1a14;border-radius:4px;padding:14px;font-family:Georgia,'Times New Roman',serif;box-shadow:0 8px 24px #000a;margin-bottom:10px}
.paper h1{font-family:Georgia,serif;color:#1d1a14;font-size:30px;text-align:center;letter-spacing:2px;text-shadow:none;font-weight:900;margin:0}
.paper .rule{border-top:2px solid #1d1a14;border-bottom:1px solid #1d1a14;height:4px;margin:6px 0 10px}
.paper .crit{border-bottom:1px dashed #1d1a1455;padding:8px 0}.paper .stars{color:#a8792a;letter-spacing:2px}
.vid{background:#d9c8ff;color:#1b1030;border-radius:16px;padding:12px;margin-bottom:10px}
.vid .thumb{background:#1b1030;border-radius:10px;display:flex;gap:10px;align-items:center;padding:8px;position:relative}
.vid .play{width:44px;height:44px;border-radius:50%;background:#7b2cff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;box-shadow:0 0 20px #7b2cff}
.vid .meta{background:#fff;border-radius:10px;padding:10px;margin-top:8px;font-size:13px}
.phone{background:linear-gradient(180deg,#1e2a1e,#0f160f);border:1px solid #2f4a2f;border-radius:18px;padding:16px;text-align:center;margin-bottom:10px}
.ring{animation:ring .25s infinite alternate;display:inline-block}@keyframes ring{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.pcard{display:flex;gap:10px;align-items:center}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;font-weight:700;font-size:13px}
.tile b{display:block;font-size:30px;margin-bottom:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.hype{height:12px;border-radius:6px;background:#2a2430;overflow:hidden}.hype i{display:block;height:100%;background:linear-gradient(90deg,#ff5d62,#ffd77a,#3dd68c)}
.ceo{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#2a2230,#1a1620);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.statgrid div{border-radius:8px;padding:8px;font-size:12px;background:#ffffff0d}.statgrid b{display:block;font-size:17px}
.sg-good{background:#1d3a28!important}.sg-bad{background:#3a1d1f!important}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.chips button{flex:0 0 auto;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:12px;font-weight:700;font-family:inherit}
.chips button.on{border-color:var(--gold);color:var(--gold);background:#2e2414}
.meter{height:10px;border-radius:5px;background:#2a2430;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%}
.ep{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.ep input[type=text]{margin:0;padding:8px;font-size:14px}
.reveal{animation:pop .6s}
select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:15px;margin-top:6px;font-family:inherit}
/* ---------- light theme ---------- */
body.light{--bg:#f7f4ee;--card:#ffffff;--card2:#f3eee5;--gold:#b5821c;--gold2:#e8b84a;--text:#1f1a14;--muted:#7a7064;--red:#d63a3f;--green:#1f9d5c;--blue:#2f6fd6;--line:#e6dfd3;background:linear-gradient(180deg,#fffaf0 0%,#f7f4ee 60%) fixed}
html:has(body.light){background:#f7f4ee}
body.light h1{text-shadow:none}
body.light .hud{box-shadow:0 6px 18px rgba(80,60,30,.12)}
body.light .card{box-shadow:0 2px 8px rgba(80,60,30,.06)}
body.light .tag{background:#f1ece3}
body.light .tag.hot{color:#c0620a;background:#ffeedd}body.light .tag.good{background:#e1f5ea}body.light .tag.bad{background:#fde5e5}body.light .tag.blue{background:#e5eefc}
body.light .seg button.on,body.light .chips button.on{background:#fff4dc}
body.light .hype,body.light .meter{background:#ebe5da}
body.light .ceo{background:linear-gradient(135deg,#fff,#f6f0e4)}
body.light .statgrid div{background:#f5f0e7}body.light .sg-good{background:#dff3e7!important}body.light .sg-bad{background:#fbe2e2!important}
body.light .nominee{background:#fffaf0;color:#1f1a14}body.light .nominee.win{background:#fff0c8}
body.light .modal{background:rgba(40,30,20,.45)}
body.light .phone{background:linear-gradient(180deg,#eaf6ea,#d6ecd6);border-color:#b8d8b8;color:#1f1a14}
body.light input,body.light select,body.light textarea{background:#fff;color:#1f1a14;border-color:#ddd3c4}
body.light .btn.ghost{background:#fff;color:#1f1a14;border-color:#ddd3c4}
body.light .tabbar{background:rgba(255,255,255,.96);border-color:#e6dfd3;box-shadow:0 -4px 16px rgba(80,60,30,.08)}
/* ---------- v5 ---------- */
.opt.sel{border:2px solid var(--gold)!important;background:linear-gradient(0deg,rgba(232,184,74,.12),rgba(232,184,74,.12)),var(--card)!important;position:relative;box-shadow:0 0 0 3px rgba(232,184,74,.18)}
.card.opt.sel::after{content:'✔ Selected';position:absolute;top:-9px;right:12px;background:var(--gold);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px}
.warnbox{border:1.5px solid #e0a030!important;background:#fff4dc!important;color:#5a3a00}
.warnbox b{color:#b5650a}
body:not(.light) .warnbox{background:#2a1d0a!important;color:var(--text)}body:not(.light) .warnbox b{color:#ffb35c}
.sbadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;white-space:nowrap;padding:2px 7px 2px 2px;border-radius:9px;background:var(--card2);border:1px solid var(--line);cursor:pointer}
.sbadge i{font-style:normal;width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:900}
.sbadge.sm{font-size:11px}.sbadge.sm i{width:15px;height:15px;font-size:9px}
.crow{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}.crow:last-child{border-bottom:0}
.crow svg{flex:0 0 auto;border-radius:4px}
.crow.mine{background:linear-gradient(90deg,rgba(232,184,74,.16),transparent);border-radius:8px;padding-left:6px}
.card.mine{border:2px solid var(--gold)}
.tvthumb{width:34px;height:51px;border-radius:4px;background:linear-gradient(160deg,#2d6a8a,#123040);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.tvthumb.big{width:96px;height:144px;font-size:46px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.pgrid>div{text-align:center;cursor:pointer}.pgrid svg{width:100%;height:auto}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.weeks button{padding:8px 2px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:12px;font-weight:700;font-family:inherit}
.weeks button.on{border:2px solid var(--gold);background:var(--gold);color:#fff}
.stg{display:flex;gap:4px;margin-top:10px}.stg div{flex:1;text-align:center}
.stg i{display:block;height:9px;border-radius:5px;background:var(--line)}
.stg span{display:block;font-size:10px;margin-top:4px;color:var(--muted);font-weight:600}
.stg .done i{background:var(--green)}.stg .done span{color:var(--green)}
.stg .cur i{background:var(--c);animation:stpulse 1.1s ease-in-out infinite}.stg .cur span{color:var(--c);font-weight:900}
@keyframes stpulse{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--c)}50%{opacity:.6;box-shadow:0 0 8px 1px var(--c)}}
.stbadge{display:inline-block;background:var(--c);color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:10px;margin-top:4px}
.plat{border-left:5px solid var(--c)}
.plat .chips button{border-color:var(--c)}
.feed{border:2px solid var(--c);border-radius:14px;padding:12px;margin:8px 0;background:var(--card)}
.sched{margin-top:8px;max-height:260px;overflow:auto}.sched .row{font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line);gap:8px}
/* light theme contrast */
body.light .tag.good{color:#11753f;background:#d6f2e1;font-weight:700}
body.light .tag.bad{color:#b3232b;background:#fde0e0;font-weight:700}
body.light .tag.hot{color:#a8520a;background:#ffe6cc;font-weight:700}
body.light .tag.blue{color:#1f58b8;background:#dde9fc;font-weight:700}
body.light .tabbar{background:#ffffff;box-shadow:0 -4px 16px rgba(80,60,30,.12)}
body.light input[type=range]{accent-color:#c8901e}
body.light input[type=range]::-webkit-slider-runnable-track{background:#e3dccf;height:6px;border-radius:3px}
body.light input[type=range]{-webkit-appearance:none;appearance:none;background:transparent}
body.light input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#c8901e;margin-top:-8px;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
body.light .muted,body.light small{color:#6b6156}
body.light .sbadge{background:#fff}
.weeks button.on small{color:#fff}
/* v6 */
.stg i{position:relative;overflow:hidden;background:var(--line)}.stg i b{display:block;height:100%;background:var(--c);border-radius:5px;transition:width .4s}
.stg .done i b{background:var(--green)}.stg .cur i{background:var(--line);animation:none}.stg .cur i b{animation:stpulse 1.1s ease-in-out infinite}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.scores .sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.scores .sc b{display:block;font-size:22px;margin:3px 0}.scores .sc span{font-size:11px;color:var(--muted)}
.scores .meta{display:inline-block!important;color:#fff;border-radius:6px;padding:2px 10px;font-size:20px!important}
.gradeb{color:var(--gold)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:8px 0;font-size:11px;text-align:center}
.cgrid b{color:var(--muted);font-size:10px}.cgrid span{padding:5px 0;border-radius:6px;position:relative;background:var(--card2)}
.cgrid span:empty{background:none}.cgrid span.has{background:#ffe1d6;color:#a33;font-weight:800}.cgrid span.mine{background:var(--gold);color:#fff}
.cgrid span.now{outline:2px solid var(--blue)}.cgrid i{position:absolute;top:-4px;right:-2px;font-style:normal;background:var(--red);color:#fff;border-radius:7px;font-size:8px;padding:0 4px}
body:not(.light) .cgrid span.has{background:#4a2a20;color:#ffb39a}
/* v7 */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f1a14;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:60;box-shadow:0 6px 20px #0006;animation:toastin .3s ease;max-width:90%}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.twp{border:2px solid var(--gold)}.twi{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;cursor:pointer}.twi:last-child{border-bottom:0}

/* ===================== v8 DESIGN SYSTEM ===================== */
body.light{--bg:#F7F4EE;--card:#FFFFFF;--card2:#F3EEE5;--gold:#B5821C;--gold2:#E8B84A;--text:#1F1A14;--muted:#6B6156;--red:#D63A3F;--green:#1F9D5C;--blue:#2F6FD6;--line:#E6DFD3;--ink:#1F1A14;--soft:#EBE5DA;background:#F7F4EE}

body{font-size:15px}
#app{padding:0 14px 96px}
.page{animation:pagein .28s ease both}@keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(60,40,10,.04)}

.btn{border-radius:14px;min-height:50px;font-size:15px;transition:transform .1s,filter .15s}

.btn.gold{background:var(--gold2);color:#1F1A14;box-shadow:0 4px 14px rgba(232,184,74,.35)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
.btn.sm{min-height:40px;border-radius:11px}
.tag{border-radius:9px;padding:4px 9px;font-size:12px;font-weight:700}
.hud{display:none}
/* top bar */
.topbar{position:sticky;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0 10px;background:var(--bg)}
.tb-l{display:flex;align-items:center;gap:10px;min-width:0}.tb-logo{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:22px;flex:0 0 auto}
.tb-t{display:flex;flex-direction:column;min-width:0}.tb-t b{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;font-weight:400;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tb-t span{font-size:12px;color:var(--muted)}
.tb-r{display:flex;align-items:center;gap:8px}.tb-cash{font-weight:800;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.tb-ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);position:relative;display:flex;align-items:center;justify-content:center}
.tb-ib i{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:800;border-radius:9px;padding:1px 6px}
/* tab bar */
.tabbar{background:var(--card)!important;border-top:1px solid var(--line)}

.tabbar button svg{transition:transform .15s}.tabbar button.on{color:var(--gold);font-weight:800}.tabbar button.on svg{transform:translateY(-2px)}
/* hero */

.hero-s{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.hero-s div{display:flex;flex-direction:column}.hero-s small{color:#CFC6B8}.hero-s b{font-size:20px;font-weight:800}.hero-s .gold{color:#E8B84A}

.pbar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.pbar i{display:block;height:100%;border-radius:3px}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 4px}.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qt{position:relative;min-height:76px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 4px;transition:transform .1s}.qt:active{transform:scale(.96)}

.paper2{background:#F4ECDD;color:#1F1A14;border-radius:16px;padding:6px 14px;font-family:'Playfair Display',Georgia,serif;border:1px solid #E2D6BF}.paper2 p{font-size:14px;font-weight:700;padding:8px 0;border-bottom:1px solid #1F1A1418;line-height:1.35}.paper2 p:last-child{border-bottom:0}

/* segmented */
.segbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);border-radius:12px;padding:4px;margin:6px 0 12px}
.segbar button{min-height:40px;border:0;border-radius:9px;background:transparent;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted)}.segbar button.on{background:var(--card);color:var(--text);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.08)}

@keyframes sheetin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

 if(['Action','Drama','Comedy','Romance','Thriller'].includes(g))sm*=1-lotLv('backlot')*.05;

 // franchises

  ${S.park&&!S.lands.some(l=>l.fid===fr.id)&&fr.fans>=55?`<button class="btn sm ghost" onclick="if(S.cash+creditLimit()>=LAND_COST()){buildLand('${fr.id}');save();render()}">🏰 Build a park land (${M(LAND_COST())})</button>`:''}</div>`).join(''):'<p class="muted" style="font-size:13px;margin-top:6px">Hits and adaptations become franchises. Sequels, spinoffs and crossovers then show up in the script market, and toys and merchandise earn money every month.</p>'}</div>`;
 // park
 h+=`<div class="card"><h3>🎢 Theme park</h3>${!S.park?`<p class="muted" style="font-size:13px;margin:6px 0">Takes 30 months to build. Earns money from visitors; lands themed on your franchises earn more.</p><button class="btn ghost" ${S.cash+creditLimit()<PARK_COST()*.2?'disabled':''} onclick="buildPark();save();render()">Build a park (${M(PARK_COST())}, paid over 30 months)</button>`:
  `<p style="margin-top:6px"><b>${esc(S.park.name)}</b> · ${t>=S.park.openT?'Open':'Opens '+tLabel(S.park.openT)}</p>${S.lands.map(l=>{const fr=S.franchises.find(f=>f.id===l.fid);return `<div class="muted" style="font-size:13px">🏰 ${esc(fr?fr.name:'?')} land · ${t>=l.openT?'open':'opens '+tLabel(l.openT)}</div>`}).join('')}<p class="muted" style="font-size:13px;margin-top:4px">Last month: ${M((S.log.last||{}).park||0)}</p>`}</div>`;
 // theaters

 // acquisitions
 h+=`<div class="card"><h3>🤝 Acquisitions</h3>${S.rivals.filter(r=>r.alive).map(r=>`<div class="row news"><span>${esc(r.n)}<br><small>${r.svc?esc(r.svc)+' · '+fmtN(r.subs)+' subs':'No streamer'}</small></span><button class="btn sm ghost" style="margin:0" ${S.cash+creditLimit()<rivalValue(r)*1.3?'disabled':''} onclick="acquire('${esc(r.n)}');save();render()">Buy ${M(rivalValue(r)*1.3)}</button></div>`).join('')+'<p class="muted" style="font-size:12px;margin-top:6px">Regulators block deals that would give you 35%+ of the domestic box office combined.</p>'||'<p class="muted">No rivals left. You own Hollywood.</p>'}${S.rivals.some(r=>r.ownedByMe)?`<p class="muted" style="font-size:12px;margin-top:6px">Owned: ${S.rivals.filter(r=>r.ownedByMe).map(r=>esc(r.n)).join(', ')}</p>`:''}</div>`;
 // stock
 const V=valuation();
 h+=`<div class="card"><h3>🔔 Wall Street</h3>${!S.stock.public?`<p class="muted" style="font-size:13px;margin:6px 0">Estimated valuation: <b style="color:var(--text)">${M(V)}</b>. An IPO sells 25% of the company for cash. After that, shareholders expect growth every quarter, and if the share price crashes for a year, the board can fire you.</p><button class="btn gold" ${S.rep<35||S.films.length<5?'disabled':''} onclick="ipo();save();render()">Go public (raise ~${M(V*.25*.93)})</button>${S.rep<35||S.films.length<5?'<p class="muted" style="font-size:12px;margin-top:4px">Needs 35+ prestige and 5+ released films.</p>':''}`:
  `<div class="row" style="margin-top:6px"><span class="muted">Share price</span><span class="big ${S.stock.price>=S.stock.ipo?'pos':'neg'}">$${S.stock.price.toFixed(2)}</span></div><small>IPO $${S.stock.ipo.toFixed(2)} · market cap ${M(S.stock.price*100)}</small>${spark(S.stock.hist,S.stock.price>=S.stock.ipo?'#3dd68c':'#ff5d62')}<button class="btn sm ghost" onclick="raiseCapital();save();render()">Sell 10% more shares (~${M(V*.1*.95)})</button>`}</div>`;
 return h}
function svcName(){modal(`<h3>Name your streaming service</h3><input type="text" id="sn" maxlength="20" value="${esc(S.name.split(' ')[0])}+"><p class="muted" style="font-size:13px;margin-top:6px">Costs ${M(SVC_COST())} to build. Goes live in 6 months.</p><button class="btn gold" onclick="launchService(document.getElementById('sn').value.trim());save();modal();render()">Launch</button><button class="btn ghost" onclick="modal()">Cancel</button>`)}

function viewMoney(){const t=tNow();const rec=sum(S.receivables.filter(r=>r.t>t),r=>r.amt);const lim=creditLimit();const L=S.log.last||{};
 const yrs={};S.films.forEach(f=>{const y=yearOf(f.releaseT);yrs[y]=yrs[y]||{n:0,ww:0,p:0};yrs[y].n++;yrs[y].ww+=f.ww;yrs[y].p+=f.profit});
 const ms=S.market[S.year-1];
 return `<h2>Money</h2>
 <div class="grid2"><div class="card stat"><small>Cash</small><span class="big ${S.cash<0?'neg':''}">${M(S.cash)}</span></div><div class="card stat"><small>Credit line</small><span class="big">${M(lim)}</span></div><div class="card stat"><small>Money coming in</small><span class="big pos">${M(rec)}</span></div><div class="card stat"><small>Overhead / month</small><span class="big">${M(overhead())}</span></div></div>
 <div class="card"><h3>Last month by business</h3>${[['📡 Streaming',L.stream],['🧸 Merchandise',L.merch],['🎢 Theme park',L.park],['🎦 Cinemas',L.theaters]].map(r=>`<div class="row" style="margin-top:6px"><span class="muted">${r[0]}</span><b class="${(r[1]||0)>=0?'':'neg'}">${M(r[1]||0)}</b></div>`).join('')}
 ${S.log.cf&&S.log.cf.length>1?`<small style="display:block;margin-top:10px">Monthly cash flow</small>${spark(S.log.cf)}`:''}</div>
 <div class="card"><p class="muted" style="font-size:13px">Cash can go negative up to your credit line (0.8% interest a month). Below <b class="neg">−${M(lim)}</b>, the bank takes the studio. Ticket money arrives the month after release. Home and digital money arrives after the theatrical window. Tax rebates are paid when production finishes.</p></div>
 ${ms?`<div class="card"><h3>${S.year-1} domestic market share</h3><table>${ms.map((r,i)=>`<tr><td>${i+1}. ${r.me?'<b class="gold">'+esc(r.n)+'</b>':esc(r.n)}</td><td class="r">${M(r.dom)}</td><td class="r">${pct(r.share)}</td></tr>`).join('')}</table></div>`:''}
 <div class="card"><h3>Films by year</h3><table><tr><th>Year</th><th class="r">Films</th><th class="r">Gross</th><th class="r">Profit</th></tr>${Object.keys(yrs).map(y=>`<tr><td>${y}</td><td class="r">${yrs[y].n}</td><td class="r">${M(yrs[y].ww)}</td><td class="r ${yrs[y].p>=0?'pos':'neg'}">${M(yrs[y].p)}</td></tr>`).join('')||'<tr><td colspan=4 class="muted">No releases yet</td></tr>'}</table></div>`}

/* ---------- Film wizard ---------- */
function startFilm(){
 if(ev('wga'))return modal(`<h3>✊ Writers are on strike</h3><p class="muted" style="margin-top:6px">No scripts can be bought or written until ${tLabel(S.ev.wga.until+1)}. You can still buy finished films at Sundance in January.</p><button class="btn ghost" onclick="modal()">OK</button>`);
 const pool=(k,n)=>shuffle(S.people[k].filter(x=>!busy(x))).slice(0,n);
 W={step:0,sc:scripts(),dirs:pool('directors',5).sort((a,b)=>b.fame-a.fame),acts:pool('actors',10).sort((a,b)=>b.star-a.star),comps:pool('composers',4),dps:pool('dps',4),wrs:pool('writers',4),
  script:null,dir:null,lead:null,co:null,sup:[],role:'lead',backend:false,comp:null,dp:null,rewriter:null,rating:null,prod:null,mkt:null,depts:null,loc:'Atlanta',days:null,dist:'wide',plf:false,cofi:false,releaseT:null};
 wiz()}
const STEPS=['Idea','Director','Cast','Crew','Production','Release'];
function committed(){return sum(S.projects,p=>(p.spend-p.prodPaid)*(1-(p.cofi||0))+(p.dist==='wide'||p.dist==='platform'?p.mkt*(1-(p.cofi||0)):0))+sum(S.shows.filter(s=>s.status==='prod'),s=>s.eps*s.epB-s.spent)+(S.park?S.park.cost-S.park.paid:0)}
function myCost(){if(!W.prod)return wizFees(W);return wizFees(W)+(prodSpend(W)+(W.dist==='stream'?0:W.mkt))*(W.cofi?.6:1)}
function cfoWarn(){const need=committed()+myCost(),have=S.cash+creditLimit();return need>have?'⚠️ CFO: commitments ('+M(need)+') exceed cash + credit. One flop could sink the studio.':need>have*.75?'CFO: this stretches the balance sheet thin.':''}
function personCard(x,sel,onclick,isA,locked,extra){const fee=isA?actorFee(x):crewFee(x,W._role);
 return `<div class="card opt ${sel?'sel':''} ${locked?'locked':''}" onclick="${locked?'':onclick}"><div class="row"><b>${isA?'⭐':'🎬'} ${esc(x.n)}${isA?(x.g==='F'?' ♀':' ♂'):''}</b><span class="muted">${M(fee)}</span></div><div class="grid2" style="margin-top:7px"><div><small>${isA?'Star power':'Fame'} ${isA?x.star:x.fame}</small>${bar(isA?x.star:x.fame,isA?'#ff8a5c':'#b07cff')}</div><div><small>Craft ${x.skill}</small>${bar(x.skill)}</div></div><div class="tags"><span class="tag ${W.script&&x.spec===W.script.genre?'good':''}">${GEN[x.spec].icon} ${x.spec}</span><span class="tag">Age ${x.age}</span>${x.hits?`<span class="tag good">${x.hits} hits</span>`:''}${extra||''}${locked&&!extra?'<span class="tag bad">🔒 Wants a bigger studio</span>':''}</div></div>`}
function wiz(){const back=`<button class="btn ghost" onclick="${W.step?'W.step--;wiz()':'render()'}">← ${W.step?'Back':'Cancel'}</button>`;
 let h=hud()+`<div class="steps">${STEPS.map((s,i)=>`<i class="${i<=W.step?'on':''}"></i>`).join('')}</div><small>Step ${W.step+1} of 6 · ${STEPS[W.step]}</small>`;
 const g=W.script?W.script.genre:null;
 if(W.step===0){
  h+=`<h2>Buy a script</h2>`+(W.sc.length?W.sc.map((s,i)=>`<div class="card opt ${W.script===s?'sel':''}" onclick="W.script=W.sc[${i}];wiz()"><div class="row"><b>${GEN[s.genre].icon} ${esc(s.title)}</b><span class="muted">${s._draft?'<span class="pos">✔ Owned</span>':M(s.cost)}</span></div><div class="muted" style="font-size:13px;margin-top:5px">Coverage ${(s.q/10).toFixed(1)}/10 · by ${esc(pname(s.writer))}</div>${bar(s.q)}${covNote(s)}<div class="tags"><span class="tag">${s.genre}</span><span class="tag ${s.hype>=10?'good':''}">${s.type}</span>${s.hype?`<span class="tag good">+${Math.round(s.hype)} awareness</span>`:''}${s.fr>=.5?'<span class="tag hot">Franchise potential</span>':''}</div></div>`).join(''):'<p class="muted card">No scripts on the market this month.</p>');
  h+=`<button class="btn gold" ${W.script?'':'disabled'} onclick="W.step=1;wiz()">Next →</button>`+back;
 }else if(W.step===1){W._role='directors';
  h+=`<h2>Hire a director</h2>`+W.dirs.map((d,i)=>personCard(d,W.dir===d.id,`W.dir='${d.id}';wiz()`,false,lockC(d))).join('');
  h+=`<button class="btn gold" ${W.dir?'':'disabled'} onclick="W.step=2;wiz()">Next →</button>`+back;
 }else if(W.step===2){
  const role=W.role;const roleBtn=(r,l)=>`<button class="${role===r?'on':''}" onclick="W.role='${r}';wiz()">${l}<br><small>${r==='sup'?(W.sup.length?W.sup.map(id=>esc(pname(id).split(' ')[0])).join(', '):'none'):W[r]?esc(pname(W[r]).split(' ')[0]):r==='lead'?'required':'optional'}</small></button>`;
  h+=`<h2>Cast the film</h2><div class="seg">${roleBtn('lead','Lead')}${roleBtn('co','Co-star')}${roleBtn('sup','Supporting')}</div><p class="muted" style="font-size:12px;margin:8px 0">${role==='sup'?'Pick up to 2 supporting actors (tap again to remove).':'Tap an actor to cast them in this role.'} Lead + co-star chemistry is revealed at the table read.</p>`;
  h+=W.acts.map(a=>{const inRole=role==='sup'?W.sup.includes(a.id):W[role]===a.id;const elsewhere=(W.lead===a.id||W.co===a.id||W.sup.includes(a.id))&&!inRole;
   return personCard(a,inRole,`castPick('${a.id}')`,true,lockA(a)||elsewhere,elsewhere?'<span class="tag blue">Already cast</span>':'')}).join('');
  if(W.lead)h+=`<div class="card"><small>Lead's deal</small><div class="seg"><button class="${!W.backend?'on':''}" onclick="W.backend=false;wiz()">Full fee</button><button class="${W.backend?'on':''}" onclick="W.backend=true;wiz()">40% fee + 5% of gross</button></div></div>`;
  h+=`<button class="btn gold" ${W.lead?'':'disabled'} onclick="W.step=3;wiz()">Next →</button>`+back;
 }else if(W.step===3){
  const opt=(arr,key,role,lbl)=>{W._role=role;return `<h3 style="margin-top:12px">${lbl}</h3><div class="card opt ${!W[key]?'sel':''}" onclick="W.${key}=null;wiz()"><b>House ${key==='rewriter'?'(no rewrite)':'crew'}</b><span class="muted" style="font-size:13px"> · ${key==='rewriter'?'keep the script as is':'craft 55, no fee'}</span></div>`+arr.map(x=>personCard(x,W[key]===x.id,`W.${key}='${x.id}';wiz()`,false,lockC(x))).join('')};
  h+=`<h2>Crew up</h2><p class="muted" style="font-size:13px">A great cinematographer and composer lift the film and can win craft awards.</p>`+opt(W.dps,'dp','dps','🎥 Cinematographer')+opt(W.comps,'comp','composers','🎼 Composer')+opt(W.wrs,'rewriter','writers','✍️ Script doctor (rewrite)');
  h+=`<button class="btn gold" onclick="W.step=4;wiz()">Next →</button>`+back;
 }else if(W.step===4){
  const ib=Math.round(GEN[g].budget*I());if(!W.rating)W.rating=GEN[g].rating;if(!W.depts)W.depts={sets:Math.round(NEEDS[g].sets*100),vfx:Math.round(NEEDS[g].vfx*100),stunts:Math.round(NEEDS[g].stunts*100),music:Math.round(NEEDS[g].music*100)};if(W.days==null)W.days=GEN[g].days;
  if(W.prod==null){const room=S.cash+creditLimit()-committed()-wizFees(W);W.prod=Math.max(3,Math.min(ib,Math.floor(room/1.7)))}
  const ds=deptScore(g,W.depts);const sch=schedule(g,W.prod,W.days);const loc=LOCS.find(l=>l.k===W.loc);
  h+=`<h2>Production plan</h2>
  <div class="card"><small>Target rating</small><div class="seg">${RATINGS.map(r=>`<button class="${W.rating===r?'on':''}" onclick="W.rating='${r}';wiz()">${r}</button>`).join('')}</div><p class="muted" style="font-size:12px;margin-top:6px">Audience reach for ${g} at ${W.rating}: <b style="color:var(--text)">${pct(ratingMult(g,W.rating))}</b>${W.rating==='R'?'. R cuts China approval odds and some Middle East markets.':''}</p></div>
  <div class="card"><div class="row"><small>Production budget</small><b id="pv">${M(W.prod)}</b></div><input type="range" min="2" max="${Math.round(350*I())}" value="${W.prod}" oninput="W.prod=+this.value;wizLive()"><p class="muted" style="font-size:12px">Typical ${g}: ${M(ib)}.</p></div>
  <div class="card"><div class="row"><small>Where the money goes</small><span class="tag ${ds>=.85?'good':ds<.65?'bad':''}">Fit ${Math.round(ds*100)}%</span></div>${DEPTS.map(d=>`<div class="row" style="margin-top:8px"><span style="font-size:14px">${d[2]} ${d[1]}</span><b id="d_${d[0]}">${M(W.prod*W.depts[d[0]]/(sum(DEPTS,x=>W.depts[x[0]])||1))}</b></div><input type="range" min="0" max="100" value="${W.depts[d[0]]}" onchange="W.depts.${d[0]}=+this.value;wiz()" oninput="W.depts.${d[0]}=+this.value;wizLive()">`).join('')}<p class="muted" style="font-size:12px">${g} films usually need: ${DEPTS.filter(d=>NEEDS[g][d[0]]>=.25).map(d=>d[1].toLowerCase()).join(' & ')}.</p></div>
  <div class="card"><small>Shooting location</small>${LOCS.map(l=>`<div class="opt ${W.loc===l.k?'sel':''}" style="padding:9px;border-radius:10px;border:1px solid var(--line);margin-top:6px" onclick="W.loc='${l.k}';wiz()"><div class="row"><b>${l.f} ${l.k}</b><span class="tag good">${Math.round((l.rebate+(!l.foreign?S.ev.usRebate:0))*100)}% rebate</span></div><small style="text-transform:none;letter-spacing:0">${l.note}${(l.look||{})[g]?' · great look for '+g:''}${l.foreign&&ev('tariff')?' · ⚠️ tariff +20%':''}${l.cost>1.05?' · pricier crews':l.cost<.95?' · cheaper crews':''}</small></div>`).join('')}</div>
  ${GEN[g].days?`<div class="card"><div class="row"><small>Shooting days</small><b id="dv">${W.days} days</b></div><input type="range" min="15" max="180" value="${W.days}" oninput="W.days=+this.value;wizLive()"><p class="muted" style="font-size:12px">Typical: ${GEN[g].days} days. Rushing hurts quality; extra days cost more.</p></div>`:''}
  <div class="card"><div class="row"><span class="muted">Production spend</span><b id="sp">${M(prodSpend(W))}</b></div><div class="row" style="margin-top:5px"><span class="muted">Tax rebate (paid at wrap)</span><b class="pos" id="rb">${M(rebateOf(W))}</b></div><div class="row" style="margin-top:5px"><span class="muted">Schedule</span><b id="sv">${sch.total} months</b></div></div>

 if(w.comp)f+=fee(w.comp,'composers');if(w.dp)f+=fee(w.dp,'dps');if(w.rewriter)f+=fee(w.rewriter,'writers');return f+(w.pen||0)}

 const prem=fr&&S.films.some(f=>f.fid===fr.id&&(f.cast.lead===id||f.dir===id))?1.25:1;

 S.shows.filter(s=>s.status==='prod'&&s.readyT===x).forEach(s=>items.push({mine:1,tv:1,wk:s.premWk||0,title:s.title,g:s.genre,studio:S.name,click:`showModal(${s.id})`}));

 return items.sort((a,b)=>a.wk-b.wk)}
function calRow(it){return `<div class="crow ${it.mine?'mine':''}" ${it.click?`onclick="${it.click}"`:''}>${it.tv?`<div class="tvthumb">${TV_GENRES[it.g].icon}</div>`:posterSVG(it.obj,34)}<div style="flex:1;min-width:0"><b class="ellip" style="display:block;font-size:14px">${it.tv?'':GEN[it.g].icon+' '}${esc(it.title)}${it.big?' ⚠️':''}</b><div class="muted" style="font-size:12px">${it.tv?'📺 TV premiere':it.stream?'📡 Streaming':it.lim?'🌏 Limited release':'🎟️ In cinemas'} · ${fmtDay(it.o?relD(it.o):dateOf(it.cal,it.wk,5))}${it.done?' · released':''}</div></div>${studioBadge(it.studio)}</div>`}
function viewCal(){const t=tNow();let h=`<h2>Release calendar</h2><p class="muted" style="font-size:13px;margin-bottom:10px">Two years of announced releases. ⚠️ = tentpole · tap a studio to see its history.</p>`;

 return h}

 const curWk=wiz?(W.relWk||0):pid?((S.projects.find(p=>p.id==pid)||{}).relWk||0):0;
 for(let t=from;t<from+24;t++){const m=t%12;const fit=CAL[m].mult*(CAL[m].g[g]||1);const riv=rivalsAt(t);const mine=S.projects.filter(p=>p.releaseT===t&&p.dist!=='stream'&&(!wiz||true)&&String(p.id)!==String(pid));const cf=compFactor(t);const sel=cur===t;

  ${sel?`<div class="weeks" onclick="event.stopPropagation()">${[0,1,2,3].map(k=>{const clash=riv.some(r=>(r.wk||0)===k&&r.hype>85);const act=wiz?`W.relWk=${k};wiz()`:pid?`setWk(${pid},${k})`:'';return `<button class="${curWk===k?'on':''}" onclick="${act}">${fmtDay(dateOf(t,k,5))}${clash?'<br><small>⚔️ clash</small>':''}</button>`}).join('')}</div><p class="muted" style="font-size:11px;margin-top:4px">Pick your opening Friday. Avoid ⚔️ weeks where a rival tentpole opens.</p>`:''}</div>`}

const CRIT_OUT=['The Daily Reel','Screen Gazette','CineFile','The Hollywood Ledger','Film Pulse','Frame & Focus','Popcorn Weekly','The Celluloid Times','Marquee Monthly','Indie Lens','The Projector','Big Screen Review'];
const CRIT_NAMES=['Dana Whitlock','Marcus Obi','Priya Raman','Leo Castellano','June Park','Sam Ortega','Helen Varga','Theo Brandt','Aisha Bello','Ruth Kimura','Felix Navarro','Nora Quinn'];
function critScores(f,p){const r=srng(f.title+'crit');f.nrev=Math.round(60+(f.hype||p.hype||30)*2.5+r()*120);f.meta=Math.round(clamp(f.critic*.62+22+(r()-.5)*14,8,98));
 f.pop=Math.round(clamp(f.aud*1.05+(r()-.5)*10,10,99));f.cert=f.critic>=75&&f.nrev>=80&&f.meta>=60}
function freshIcon(s){return s>=60?'🍅':'🤢'}
function metaColor(m){return m>=61?'#2e9e5b':m>=40?'#e0a020':'#d0393b'}
function critList(f){const r=srng(f.title+'list');return CRIT_OUT.slice(0,8).map((o,i)=>{const s=clamp(Math.round(f.critic+(r()-.5)*40),5,100);
 const q=s>=88?['An instant classic.','Breathtaking from start to finish.','The year\'s best.','Pure cinema.'][i%4]:s>=72?['Smart, moving and confident.','A crowd-pleaser with brains.','Rewards the ticket price.','Beautifully crafted.'][i%4]:s>=58?['Flawed but fun.','Solid if unspectacular.','Worth a matinee.','Entertaining enough.'][i%4]:s>=40?['Uneven and overlong.','A missed opportunity.','Has a few good scenes.','Forgettable.'][i%4]:['A mess.','Painful to sit through.','Avoid.','Dead on arrival.'][i%4];
 return{o,c:CRIT_NAMES[(i+Math.floor(r()*12))%12],s,q,fresh:s>=60}})}
function scorePanel(f){if(f.meta==null)critScores(f,{});return `<div class="scores">
 <div class="sc"><small>Fresh-o-Meter</small><b style="color:${f.critic>=60?'#d0393b':'#5a9e2f'}">${freshIcon(f.critic)} ${f.critic}%</b><span>${f.cert?'⭐ Certified Fresh':f.critic>=60?'Fresh':'Rotten'} · ${f.nrev} reviews</span></div>

 <div class="sc"><small>MetaMark</small><b class="meta" style="background:${metaColor(f.meta)}">${f.meta}</b><span>${f.meta>=81?'Universal acclaim':f.meta>=61?'Generally favorable':f.meta>=40?'Mixed':'Generally unfavorable'}</span></div></div>`}

 const n=f.ended?f.weeks.length:clamp(f.shown||f.weeks.length,1,f.weeks.length);const dom=sum(f.weeks.slice(0,n),x=>x);const fr=f.dom?dom/f.dom:1;return{dom,intl:f.intl*fr,ww:dom+f.intl*fr,n,done:!!f.ended||n>=f.weeks.length}}

 S.shows.forEach(sh=>{if(sh.status!=='airing')return;const se=sh.seasons[sh.seasons.length-1];if(!se)return;const ds=epDates(se.t,se.wk||0,se.day==null?5:se.day,se.mode||sh.mode,sh.eps);const now=addDays(curDate(),1);

 if(lines.length){if(!WKREP.length)QUEUE.push(showWeekRep);WKREP=WKREP.concat(lines)}}

function wkNear(t,d){let best=0,bd=99;for(let k=0;k<4;k++){const f=dateOf(t,k,5).getDate();const dd=Math.abs(f-d);if(dd<bd){bd=dd;best=k}}return best}

function articleBody(raw){const s=raw.replace(/<[^>]+>/g,'');const r=srng(s);const m=s.match(/(\$[\d.]+[MB])/);const amt=m?m[1]:null;const t=(raw.match(/<[bi]>(.*?)<\/[bi]>/)||[])[1]||'';const studio=(S.rivals.find(x=>s.includes(x.n))||{}).n||(s.includes(S.name)?S.name:'the studio');

 else if(/signs|deal|joins|poached|exits/.test(s)){P.push(`${s.split('.')[0]}. The agreement, which insiders describe as one of the most competitive talent negotiations of the year, reshuffles the casting landscape for several upcoming productions.`);P.push(`Agents for rival studios had circled for months. The move leaves at least one competing project scrambling for a replacement, according to people familiar with the matter.`);P.push(`Neither side disclosed financial terms, though sources put the package well above industry average.`)}
 else if(/trailer|views|viral|post/.test(s)){P.push(`${s.split('.')[0]}. Online reaction has been swift, with fans dissecting every frame and debating what the footage reveals about the plot.`);P.push(`Marketing analysts say early online engagement is one of the strongest predictors of opening weekend for event films, though positive sentiment does not always convert into ticket sales.`);P.push(`The studio is expected to roll out further materials, including character posters and a final trailer, in the weeks before release.`)}
 else if(/award|nominat|Golden|wins/.test(s)){P.push(`${s.split('.')[0]}. The result caps a campaign season that saw studios spend heavily on screenings, trade advertising and Q&A events.`);P.push(`Voters this year rewarded ${['bold, original storytelling','big crowd-pleasers','intimate character dramas','technical ambition'][Math.floor(r()*4)]}, according to members who spoke on condition of anonymity.`);P.push(`The win is expected to give a box office bump in the weeks ahead, as well as raising the profile of everyone involved.`)}
 else if(/feud|romance|tabloid|scandal|backlash|controversy/.test(s)){P.push(`${s.split('.')[0]}. Representatives for those involved did not respond to requests for comment.`);P.push(`Industry observers say off-screen headlines can cut both ways: they generate awareness, but can also distract from a film's marketing message or unsettle a production.`);P.push(`Social media lit up within minutes, with fans taking sides and hashtags trending across several platforms.`)}

function rsym(n){return n.replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,4)}
function RS(){S.rstock=S.rstock||{};S.rivals.forEach(r=>{if(!S.rstock[r.n]){const g=srng(r.n+'stk');const p=+(15+r.p*60+g()*40).toFixed(2);S.rstock[r.n]={p,hist:[p],open:p}}});return S.rstock}

function portValue(){const st=RS();return sum(Object.entries(PORT()),([n,h])=>h.sh*(n==='__me'?(S.stock.price||0):(st[n]?st[n].p:0))/1e6)}
function stockWeek(){const st=RS();S.rivals.forEach(r=>{const s=st[r.n];if(!s||s.dead)return;s.open=s.p;const rel=rivalsAt(tNow()).filter(x=>x.studio===r.n&&(x.wk||0)===(S.wk||0)&&x.dom);const perf=rel.length?clamp(sum(rel,x=>x.dom)/(30*r.p*inf(tNow()))-1,-.6,1.2)*.05:0;
  s.p=+Math.max(1,s.p*(1+gauss()*.028+perf+.0012)).toFixed(2);s.hist.push(s.p);if(s.hist.length>60)s.hist.shift();if(!r.alive){s.dead=1;const h=PORT()[r.n];if(h&&h.sh){const v=h.sh*s.p/1e6*1.25;S.cash+=v;TX(v,`${r.n} takeover payout`);delete PORT()[r.n];addNews(`💼 Your ${esc(r.n)} shares are bought out at a premium: ${M(v)}.`)}}})}
function trade(n,side,amtM){const st=RS();const me=n==='__me';const price=me?S.stock.price:(st[n]&&st[n].p);if(!price)return;const P=PORT();const h=P[n]||(P[n]={sh:0,cost:0});
 if(side==='buy'){const amt=Math.min(amtM,Math.max(0,S.cash));if(amt<=0)return toast('Not enough cash');const sh=amt*1e6/price;h.sh+=sh;h.cost+=amt;S.cash-=amt;TX(-amt,`Bought ${rsym(me?S.name:n)} shares`);if(me){S.stock.price=+(S.stock.price*(1+amt/Math.max(50,valuation())*.6)).toFixed(2)}}
 else{const val=h.sh*price/1e6;const amt=Math.min(amtM,val);if(amt<=0)return toast('You don’t own any');const sh=amt*1e6/price;const frac=sh/h.sh;h.cost*=1-frac;h.sh-=sh;S.cash+=amt;TX(amt,`Sold ${rsym(me?S.name:n)} shares`);if(h.sh<1)delete P[n]}
 sfx('cash');save();keepScroll();phoneRender()}

function commission(){const c=W.com;const w=person(c.writer);if(!w)return toast('Pick a writer');if(drActive().length>=drCap())return toast(`Your writers' room is full (${drCap()} at once)`);
 const fee=drFee(w,c.speed);if(S.cash<fee-creditLimit())return toast('Not enough cash');
 const wk=drWeeks(w,c.genre,c.speed);const d={id:S.id++,title:(c.title||genTitle(c.genre)).trim()||genTitle(c.genre),genre:c.genre,brief:c.brief,speed:c.speed,writer:w.id,fee,startW:absW(),doneW:absW()+wk,status:'writing',kind:'draft',rewrites:0,log:[]};
 S.cash-=fee;if(typeof logTx==='function')try{logTx(-fee,'Script: '+d.title)}catch(e){}
 w.busy=Math.max(w.busy||-1,Math.floor(d.doneW/4));S.drafts=S.drafts||[];S.drafts.push(d);
 addNews(`✍️ ${esc(S.name)} hires ${esc(w.n)} to write <i>${esc(d.title)}</i>.`);if(typeof hap==='function')hap('confirm');save();render();toast(`✍️ ${esc(w.n)} starts writing · about ${wk} weeks`)}

function drTick(){if(!S||!S.drafts)return;const now=absW();{const used=new Set(S.projects.map(p=>p.title).concat(S.films.map(f=>f.title)));S.drafts=S.drafts.filter(d=>!(d.status==='done'&&used.has(d.title)))}
 S.drafts.filter(d=>d.status==='writing').forEach(d=>{const w=person(d.writer);
  if(d.lastW===now)return;d.lastW=now;
  if(ev('wga')){d.doneW++;if(!d.strikeNote){d.strikeNote=1;d.log.push('Paused by the writers\' strike')}return}
  if(d.ask){d.doneW++;return}
  if(d.kind==='draft'&&now<d.doneW-1&&w){const r=Math.random();
   if(r<.035){const n=RI(1,3);d.doneW+=n;d.log.push(`Writer's block: ${n} week${n>1?'s':''} late`);addInbox('✍️',w.n,`${d.title} is running late`,`${w.n} has writer's block. Expect the draft about ${n} week${n>1?'s':''} later.`)}
   else if(r<.05&&!d.asked){d.asked=1;d.ask=+(d.fee*.3).toFixed(2);addInbox('💸',w.n,`Bonus request on ${d.title}`,`${w.n} wants a ${M(d.ask)} bonus to keep going. Open Writers' room to answer.`,'writersRoom()');toast(`💸 ${esc(w.n)} wants a bonus to finish <i>${esc(d.title)}</i>`)}
   else if(r<.058&&!hasT(w,'hardworking')){d.quit=1;d.doneW=now}}
  if(now>=d.doneW)drFinish(d)})}

function drFinish(d){const w=person(d.writer);d.status='done';d.doneAt=absW();
 if(d.kind==='draft'){d.sc=drScore(w||{skill:50,spec:''},d.genre,d.brief,d.speed);if(d.quit){Object.keys(d.sc).forEach(k=>d.sc[k]=clamp(d.sc[k]-RI(10,18),5,99));d.log.push(`${w?w.n:'The writer'} quit. You got an unfinished draft`)}if(d.bonusNo){Object.keys(d.sc).forEach(k=>d.sc[k]=clamp(d.sc[k]-RI(2,7),5,99));d.log.push('Writer finished unhappy after you refused the bonus')}}
 else if(d.kind==='rewrite'){const ks=DR_AREAS.slice(0,5).map(a=>a[0]).sort((a,b)=>d.sc[a]-d.sc[b]).slice(0,2);const pw=Math.max(.35,1-d.rewrites*.25);ks.forEach(k=>{const g=Math.round(R(4,10)*pw*((w?w.skill:60)/70));d.sc[k]=clamp(d.sc[k]+g,5,99)});if(Math.random()<.25){const k=pick(['originality','hook']);d.sc[k]=clamp(d.sc[k]-RI(1,4),5,99)}d.log.push(`Rewrite #${d.rewrites} done: ${ks.map(k=>DR_AREAS.find(a=>a[0]===k)[1].toLowerCase()).join(' and ')} improved`)}
 else if(d.kind==='doctor'){const doc=person(d.doc);const k=d.area;const s=doc?doc.skill:60;const g=Math.round(Math.max(2,(s-d.sc[k])*.5+3));d.sc[k]=clamp(d.sc[k]+g,5,99);d.log.push(`${doc?doc.n:'Script doctor'} polished the ${DR_AREAS.find(a=>a[0]===k)[1].toLowerCase()} (+${(g/10).toFixed(1)})`)}
 d.kind='done';delete d.ask;drScript(d);const q=d.scObj.q;
 if(w&&q>=75&&!d.fameGiven){d.fameGiven=1;w.fame=clamp(w.fame+RI(2,4),1,99);w.skill=clamp(w.skill+1,20,99)}
 addInbox('📜',w?w.n:'Writers',`Draft ready: ${d.title}`,`Grade ${drGrade(q)}. Open the report to see its strengths and weaknesses.`,`drView(${d.id})`);
 toast(`📜 Draft ready: <i>${esc(d.title)}</i> · grade ${drGrade(q)}`);if(typeof sfx==='function')try{sfx('win')}catch(e){}}

function drAnswer(id,pay){const d=(S.drafts||[]).find(x=>x.id===id);if(!d||!d.ask)return;if(pay){S.cash-=d.ask;if(typeof logTx==='function')try{logTx(-d.ask,'Writer bonus')}catch(e){}d.log.push(`You paid a ${M(d.ask)} bonus`)}else{d.bonusNo=1;d.log.push('You refused the bonus');const w=person(d.writer);if(w)w.rel=clamp((w.rel||0)-10,-100,100)}delete d.ask;save();writersRoom()}

/* ---------- views ---------- */
function drCard(d){const w=person(d.writer);const now=absW();
 if(d.status==='writing'){const tot=Math.max(1,d.doneW-d.startW),done=clamp(now-d.startW,0,tot);const left=Math.max(0,d.doneW-now);const lab={draft:'Writing first draft',rewrite:'Rewriting',doctor:'Script doctor at work'}[d.kind];
  return `<div class="card dr26"><div class="pcard">${portrait(w,44)}<div style="flex:1;min-width:0"><div class="row"><b class="ellip">${GEN[d.genre].icon} ${esc(d.title)}</b><small>${left?left+' wk left':'Due now'}</small></div><small class="muted" style="text-transform:none;letter-spacing:0">${lab} · ${esc(w?w.n:'')}${ev('wga')?' · ⏸ strike':''}</small></div></div>${bar(Math.round(done/tot*100))}
  ${d.ask?`<div class="ask26">💸 <b>${esc(w?w.n:'')}</b> wants a <b>${M(d.ask)}</b> bonus to keep going.<div class="row" style="margin-top:8px;gap:8px"><button class="btn sm gold" style="margin:0;flex:1" onclick="drAnswer(${d.id},1)">Pay</button><button class="btn sm ghost" style="margin:0;flex:1" onclick="drAnswer(${d.id},0)">Refuse</button></div></div>`:''}</div>`}
 const q=d.scObj?d.scObj.q:drOverall(d.sc);
 return `<button class="card lrow dr26" onclick="drView(${d.id})"><span class="grd26 g${drGrade(q)[0]}">${drGrade(q)}</span><span style="flex:1;text-align:left"><b>${GEN[d.genre].icon} ${esc(d.title)}</b><br><small class="muted">by ${esc(w?w.n:'')} · ${d.rewrites?d.rewrites+' rewrite'+(d.rewrites>1?'s':'')+' · ':''}tap for report</small></span><b>›</b></button>`}

function writersRoom(){const ds=S.drafts||[];const act=ds.filter(d=>d.status==='writing'),fin=ds.filter(d=>d.status==='done');
 modal(`<h2>Writers' room</h2><p class="muted" style="font-size:13px;margin:-4px 0 10px">Hire writers to create scripts you own. Up to <b>${drCap()}</b> at once (more as your studio's reputation grows).</p>
 <button class="btn gold" onclick="modal();startFilm();W.mode='orig';wiz()">✍️ Commission a new script</button>
 ${act.length?`<div class="sec"><h2>Being written</h2></div>${act.map(drCard).join('')}`:''}
 ${fin.length?`<div class="sec"><h2>Finished drafts</h2></div>${fin.map(drCard).join('')}`:''}
 ${!ds.length?'<div class="empty">No scripts in development yet.</div>':''}`)}

function drView(id){const d=(S.drafts||[]).find(x=>x.id===id);if(!d)return writersRoom();if(d.status!=='done')return writersRoom();const w=person(d.writer);const s=drScript(d);const sc=d.sc;
 const rows=DR_AREAS.map(([k,l])=>{const v=sc[k];const c=v>=70?'#1F9D5C':v<50?'#D63A3F':'#B5821C';return `<div class="drrow"><span>${l}</span><b style="color:${c}">${(v/10).toFixed(1)}</b><span class="bar26"><i style="width:${v}%;background:${c}"></i></span><small>${drNote(k,v)}</small></div>`}).join('');
 const est=GEN[d.genre].budget*(d.brief==='franchise'?1.3:d.brief==='prestige'?.75:1)*(typeof I==='function'?I():1)/1;
 const stars=sc.characters>=78?'Top stars will want the lead role':sc.characters>=60?'Solid actors will sign on':'Harder to attract big names';
 const dirs=s.q>=75?'Respected directors will be interested':s.q>=55?'Working directors will take it':'Only hungry newcomers will direct it';
 const docs=S.people.writers.filter(x=>x.id!==d.writer&&!busy(x)).sort((a,b)=>b.skill-a.skill).slice(0,3);
 const weak=DR_AREAS.slice(0,5).map(a=>a[0]).sort((a,b)=>sc[a]-sc[b])[0];
 const rwCost=+(d.fee*.35).toFixed(2),docCost=x=>+(crewFee(x,'writers')*.5).toFixed(2);
 const canRw=w&&!busy(w)&&d.rewrites<3;
 MKEEP=true;modal(`<div class="drhead"><span class="grd26 big g${drGrade(s.q)[0]}">${drGrade(s.q)}</span><div><small class="muted">First draft report${d.rewrites?' · after '+d.rewrites+' rewrite'+(d.rewrites>1?'s':''):''}</small><h2 style="margin:2px 0">${esc(d.title)}</h2><small class="muted">${GEN[d.genre].icon} ${d.genre} · ${DR_BRIEFS.find(b=>b[0]===d.brief)[1]} · by ${esc(w?w.n:'')}</small></div></div>
 <div class="card">${rows}</div>
 <div class="card"><div class="row"><span>Overall script quality</span><b>${(s.q/10).toFixed(1)}/10</b></div><div class="row" style="margin-top:6px"><span>Suggested budget</span><b>~${M(est)}</b></div><div class="muted" style="font-size:13px;margin-top:8px">⭐ ${stars}<br>🎬 ${dirs}${s.hype?`<br>📣 Strong hook: +${s.hype} awareness at release`:''}${s.crit>0?`<br>🏆 Critics bonus +${s.crit}`:''}</div>
 ${d.log.length?`<div class="muted" style="font-size:12px;margin-top:8px;border-top:1px solid rgba(0,0,0,.08);padding-top:6px">${d.log.map(esc).join('<br>')}</div>`:''}</div>
 <button class="btn gold" onclick="drMake(${d.id})">🎬 Make this movie</button>
 <div class="sec"><h2>Improve it</h2></div>
 <button class="card lrow" ${canRw?`onclick="drRewrite(${d.id})"`:'disabled style="opacity:.5"'}><span style="flex:1;text-align:left"><b>✏️ Rewrite with ${esc(w?w.n:'the writer')}</b><br><small class="muted">${canRw?`${M(rwCost)} · 2–4 weeks · fixes the two weakest areas`:d.rewrites>=3?'No more rewrites: the writer is out of ideas':'Writer is busy right now'}</small></span><b>›</b></button>
 <small class="psec" style="display:block;margin:8px 0 4px">Script doctor for the ${DR_AREAS.find(a=>a[0]===weak)[1].toLowerCase()}</small>
 ${docs.map(x=>`<button class="card lrow" onclick="drDoctor(${d.id},'${x.id}','${weak}')">${portrait(x,36)}<span style="flex:1;text-align:left"><b>${esc(x.n)}</b> <small>craft ${x.skill}</small><br><small class="muted">${M(docCost(x))} · 2–3 weeks</small></span><b>›</b></button>`).join('')||'<p class="muted">No script doctors free right now.</p>'}
 <div class="pgrid2" style="margin-top:10px"><button class="btn ghost" onclick="writersRoom()">📚 Shelve it</button><button class="btn ghost" onclick="drSell(${d.id})">💰 Sell for ${M(drSellPrice(d))}</button></div>`)}

function drSellPrice(d){const q=drScript(d).q;return +(d.fee*(.3+q/90)).toFixed(2)}
function drRewrite(id){const d=S.drafts.find(x=>x.id===id);const w=person(d.writer);if(!w||busy(w))return;const c=+(d.fee*.35).toFixed(2);S.cash-=c;if(typeof logTx==='function')try{logTx(-c,'Rewrite: '+d.title)}catch(e){}
 d.rewrites++;d.kind='rewrite';d.status='writing';d.startW=absW();d.doneW=absW()+RI(2,4);w.busy=Math.max(w.busy||-1,Math.floor(d.doneW/4));save();toast(`✏️ ${esc(w.n)} is rewriting <i>${esc(d.title)}</i>`);writersRoom()}
function drDoctor(id,did,area){const d=S.drafts.find(x=>x.id===id);const x=person(did);if(!x||busy(x))return;const c=+(crewFee(x,'writers')*.5).toFixed(2);S.cash-=c;if(typeof logTx==='function')try{logTx(-c,'Script doctor: '+d.title)}catch(e){}
 d.kind='doctor';d.doc=did;d.area=area;d.status='writing';d.startW=absW();d.doneW=absW()+RI(2,3);x.busy=Math.max(x.busy||-1,Math.floor(d.doneW/4));save();toast(`🩺 ${esc(x.n)} is polishing <i>${esc(d.title)}</i>`);writersRoom()}
function drSell(id){const d=S.drafts.find(x=>x.id===id);if(!d)return;const p=drSellPrice(d);const r=(S.rivals||[]).filter(x=>x.alive);const buyer=r.length?pick(r).n:'A rival studio';S.cash+=p;if(typeof logTx==='function')try{logTx(p,'Sold script: '+d.title)}catch(e){}
 S.drafts=S.drafts.filter(x=>x!==d);addNews(`💰 ${esc(buyer)} buys the script <i>${esc(d.title)}</i> from ${esc(S.name)} for ${M(p)}.`);save();toast(`Sold to ${esc(buyer)} for ${M(p)}`);writersRoom()}
function drMake(id){const d=S.drafts.find(x=>x.id===id);if(!d)return;const s=drScript(d);modal();startFilm();if(typeof W==='undefined'||!W)return;if(!W.sc.includes(s))W.sc.unshift(s);W.mode='market';W.script=s;wiz()}

/* ---------- commission screen inside the New movie wizard ---------- */
function commissionUI(){const c=W.com=W.com||{title:genTitle('Drama'),genre:'Drama',brief:'crowd',speed:'normal',writer:null};W._role='writers';
 const ds=(S.drafts||[]);const full=drActive().length>=drCap();
 let h=ds.length?`<div class="card" style="padding:10px 12px"><div class="row"><b>Your scripts</b><button class="btn sm ghost" style="margin:0" onclick="writersRoom()">Writers' room ›</button></div>${ds.filter(d=>d.status==='done').map(d=>`<button class="lrow" onclick="drView(${d.id})"><span class="grd26 g${drGrade(drScript(d).q)[0]}">${drGrade(drScript(d).q)}</span><span style="flex:1;text-align:left;margin-left:8px">${esc(d.title)}</span><small class="muted">report ›</small></button>`).join('')}${drActive().map(d=>`<div class="lrow"><span>⏳ ${esc(d.title)}</span><small class="muted">${Math.max(0,d.doneW-absW())} wk left</small></div>`).join('')}</div>`:'';
 h+=`<div class="card"><b>✍️ Commission a script</b><p class="muted" style="font-size:13px;margin:4px 0 8px">Hire a writer. They take a few weeks, then you get a draft report showing its strong and weak areas.</p>
 <small>Working title</small><div class="row"><input type="text" maxlength="40" value="${esc(c.title)}" oninput="W.com.title=this.value"><button class="btn sm ghost" style="margin:6px 0 0" onclick="W.com.title=genTitle(W.com.genre);wiz()">🎲</button></div>
 <small style="display:block;margin-top:10px">Genre</small><div class="chips" style="margin-top:6px;flex-wrap:wrap">${GENRES.map(x=>`<button class="${c.genre===x?'on':''}" onclick="W.com.genre='${x}';W.com.title=genTitle('${x}');wiz()">${GEN[x].icon} ${x}</button>`).join('')}</div>
 <small style="display:block;margin-top:10px">Brief</small><div class="chips" style="margin-top:6px;flex-wrap:wrap">${DR_BRIEFS.map(b=>`<button class="${c.brief===b[0]?'on':''}" onclick="W.com.brief='${b[0]}';wiz()">${b[1]}</button>`).join('')}</div>
 <small style="display:block;margin-top:10px">Deadline</small><div class="chips" style="margin-top:6px;flex-wrap:wrap">${DR_SPEEDS.map(s=>`<button class="${c.speed===s[0]?'on':''}" onclick="W.com.speed='${s[0]}';wiz()">${s[1]}</button>`).join('')}</div>
 <small class="muted" style="display:block;margin-top:6px">${c.speed==='rush'?'Faster, costs 25% more, weaker draft.':c.speed==='slow'?'Takes longer, costs 10% more, better draft.':'The usual schedule.'}</small></div>
 <h3 style="margin:8px 0">Pick a writer</h3>`;
 h+=W.wrs.filter(x=>!busy(x)).map(x=>personCard(x,c.writer===x.id,`W.com.writer='${x.id}';wiz()`,false,lockC(x),`<span class="tag">⏱ ~${drWeeks(x,c.genre,c.speed)} wks</span>${x.spec===c.genre?'<span class="tag good">Genre expert</span>':''}`)).join('');
 const w=person(c.writer);
 h+=w?`<div class="card" style="position:sticky;bottom:8px;z-index:3;box-shadow:0 6px 20px rgba(0,0,0,.15)"><div class="row"><span>${esc(w.n)} · ~${drWeeks(w,c.genre,c.speed)} weeks</span><b>${M(drFee(w,c.speed))}</b></div><button class="btn gold" ${full?'disabled':''} onclick="commission()">${full?`Writers' room full (${drCap()})`:'✍️ Commission script'}</button></div>`:'';
 return h}

/* ---------- hooks ---------- */
const _wt26=weekTick;weekTick=function(){_wt26();try{drTick()}catch(e){console.error(e)}};
const _nm26=nextMonth;nextMonth=function(){const r=_nm26.apply(this,arguments);try{if(!S.over)drTick()}catch(e){console.error(e)}return r};
const _scr26=scripts;scripts=function(){const a=_scr26();const mine=(S.drafts||[]).filter(d=>d.status==='done').map(drScript).filter(s=>!a.includes(s));return mine.concat(a)};
const _gl26=greenlight;greenlight=function(){const sc=W&&W.script;const n=S.projects.length;_gl26.apply(this,arguments);try{if(sc&&sc._draft&&S.projects.length>n){S.drafts=(S.drafts||[]).filter(d=>d.id!==sc._draft);save()}}catch(e){}};
actorFee=(function(o){return function(a){const f=o(a);try{if(typeof W!=='undefined'&&W&&W.script&&W.script._draft&&(W.script.chars||0)>=78)return f*.9}catch(e){}return f}})(actorFee);
const _wr26=weekRows;weekRows=function(){const rows=_wr26();try{(S.drafts||[]).filter(d=>d.status==='done'&&d.doneAt>=absW()-1).slice(0,2).forEach(d=>rows.unshift(['#7C5CE0',`📜 Draft ready: <b>${esc(d.title)}</b> · grade ${drGrade(drScript(d).q)}`,`drView(${d.id})`]));(S.drafts||[]).filter(d=>d.ask).slice(0,1).forEach(d=>rows.unshift(['#D63A3F',`💸 ${esc(pname(d.writer))} wants a bonus for <b>${esc(d.title)}</b>`,'writersRoom()']))}catch(e){}return rows};
hq8=(function(o){return function(){let h=o();try{const n=(S.drafts||[]).filter(d=>d.status==='done'||d.ask).length;const btn=`<button class="qt" onclick="writersRoom()">${ic('bulb','#B5821C')}<span>Writers</span>${n?`<i>${n}</i>`:''}</button>`;const k=h.indexOf('<button class="qt" onclick="pitchRoom()"');if(k>=0)h=h.slice(0,k)+btn+h.slice(k)}catch(e){}return h}})(hq8);
homeRowIcon=(function(o){return function(c,t){const m=String(t);if(/Draft ready/.test(m))return '📜';if(/wants a bonus/.test(m))return '💸';return o(c,t)}})(homeRowIcon);


applyTheme();title();
</script>
</body>
