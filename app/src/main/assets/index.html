<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hollywood Studio Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&family=Playfair+Display:wght@700;900&family=Creepster&family=Orbitron:wght@700&family=Cinzel:wght@700&family=Bangers&family=Pacifico&family=Special+Elite&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b10;--card:#1a1620;--card2:#241e2c;--gold:#e8b84a;--gold2:#ffd77a;--text:#f3ece0;--muted:#a99f92;--red:#ff5d62;--green:#3dd68c;--blue:#6aa8ff;--line:#2e2737}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#0d0b10}
body{background:radial-gradient(ellipse at top,#2a1d10 0%,var(--bg) 55%) fixed;color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
#app{max-width:540px;margin:0 auto;padding:12px 12px 90px}
h1,h2,h3,.bebas{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px;font-weight:400}
h1{font-size:44px;line-height:.95;color:var(--gold);text-shadow:0 0 24px rgba(232,184,74,.35)}
h2{font-size:28px;color:var(--gold);margin:4px 0 10px}
h3{font-size:21px}
small,.lbl{color:var(--muted);font-size:11px;letter-spacing:.7px;text-transform:uppercase}
p{line-height:1.45}
.muted{color:var(--muted)}.neg{color:var(--red)}.pos{color:var(--green)}.gold{color:var(--gold)}
.hud{display:grid;grid-template-columns:1.1fr .9fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:12px;position:sticky;top:6px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.hud div{display:flex;flex-direction:column}.hud b{font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px}
.opt{cursor:pointer;transition:.12s}.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px rgba(232,184,74,.18)}
.opt.locked{opacity:.42;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{background:var(--card2);border-radius:20px;padding:3px 9px;font-size:12px;color:var(--muted)}
.tag.hot{color:#ffb35c;background:#3a2412}.tag.good{color:var(--green);background:#123224}.tag.bad{color:var(--red);background:#3a1416}.tag.blue{color:var(--blue);background:#14243a}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;margin-top:9px;font-family:inherit;color:var(--text)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1206}
.btn.ghost{background:var(--card2);border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:14px;width:auto;display:inline-block;margin:6px 6px 0 0}
.btn:disabled{opacity:.38;cursor:not-allowed}
.bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.big{font-size:26px;font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;letter-spacing:1px}
input[type=text],textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;margin-top:6px;font-family:inherit}
input[type=range]{width:100%;accent-color:var(--gold);margin:8px 0 2px;height:28px}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.seg button{flex:1;min-width:60px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.seg button.on{border-color:var(--gold);color:var(--gold);background:#2e2414}
.steps{display:flex;gap:4px;margin-bottom:10px}.steps i{flex:1;height:4px;border-radius:3px;background:var(--card2)}.steps i.on{background:var(--gold)}
.film{display:flex;gap:10px;align-items:center}
.poster{width:44px;height:62px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid rgba(255,255,255,.08)}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}
.chart div{flex:1;background:linear-gradient(180deg,var(--gold2),#a8792a);border-radius:4px 4px 0 0;position:relative;min-height:2px;animation:grow .5s ease-out both}
.chart span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.news{font-size:14px;padding:8px 0;border-bottom:1px dashed var(--line)}.news:last-child{border:0}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(18,15,22,.97);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:9;padding-bottom:env(safe-area-inset-bottom)}
.tabbar div{display:flex;max-width:540px;width:100%}
.tabbar button{flex:1;min-width:0;background:none;border:0;color:var(--muted);padding:9px 0 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.tabbar button b{display:block;font-size:20px;margin-bottom:1px}
.tabbar button.on{color:var(--gold)}
.marquee{text-align:center;padding:22px 8px 8px}.lights{letter-spacing:5px;color:var(--gold);font-size:12px}
.trophy{font-size:54px;text-align:center;animation:pop .6s}@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.center{text-align:center}.section{margin:16px 0 8px;display:flex;justify-content:space-between;align-items:end}
.grade{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:42px;line-height:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:540px;max-height:85vh;overflow:auto;padding:16px 14px 28px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:600}td.r,th.r{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:var(--card2)}

/* ===== v3 visual layer ===== */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.scene{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;background:#0b0820}
.bulb{animation:blink 1s infinite}@keyframes blink{50%{fill:#fff8d0;opacity:.45}}
.beam1{transform-origin:90px 300px;animation:sweep 4s ease-in-out infinite alternate}.beam2{transform-origin:290px 300px;animation:sweep 5s ease-in-out infinite alternate-reverse}
@keyframes sweep{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.countup{font-family:'Bebas Neue',Impact;font-size:54px;color:var(--green);text-align:center;letter-spacing:1px;line-height:1}
.popcard{background:var(--card);border:2px solid var(--gold);border-radius:6px;padding:22px 16px;text-align:center;margin:10px 0;animation:pop .5s}
.stage{position:relative;background:radial-gradient(ellipse at 50% 0%,#5a3b10 0%,#160c06 60%,#0b0604 100%);border-radius:14px;overflow:hidden;min-height:430px;margin-bottom:10px;border:1px solid #5a3b10}
.curtain{position:absolute;top:0;bottom:0;width:22%;background:repeating-linear-gradient(90deg,#6b0f18 0 10px,#8a1622 10px 20px);box-shadow:inset -10px 0 20px #0008;z-index:2}
.curtain.l{left:0;border-bottom-right-radius:60% 10%}.curtain.r{right:0;border-bottom-left-radius:60% 10%;box-shadow:inset 10px 0 20px #0008}
.spot{position:absolute;left:50%;top:-20px;width:300px;height:520px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 0%,#fff6c855 0%,#fff6c811 50%,transparent 70%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);z-index:1}
.stage-in{position:relative;z-index:3;padding:18px 24% 18px;text-align:center}
@media(max-width:420px){.stage-in{padding:16px 18%}}
.nominee{display:flex;align-items:center;gap:8px;background:#0008;border:1px solid #5a3b10;border-radius:10px;padding:6px;margin:6px 0;text-align:left;font-size:13px}
.nominee.win{border-color:var(--gold);box-shadow:0 0 18px #ffd77a66;background:#3a2a0a}
.envelope{width:120px;height:80px;margin:16px auto;background:#f5e6c8;border-radius:4px;position:relative;box-shadow:0 6px 20px #000a;animation:wobble .6s infinite alternate}
.envelope:after{content:'';position:absolute;left:0;right:0;top:0;border-left:60px solid transparent;border-right:60px solid transparent;border-top:44px solid #e2cfa5}
@keyframes wobble{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.spinner{width:46px;height:46px;border:4px solid #ffd77a33;border-top-color:var(--gold);border-radius:50%;margin:14px auto;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.paper{background:#f3ead7;color:#1d1a14;border-radius:4px;padding:14px;font-family:Georgia,'Times New Roman',serif;box-shadow:0 8px 24px #000a;margin-bottom:10px}
.paper h1{font-family:Georgia,serif;color:#1d1a14;font-size:30px;text-align:center;letter-spacing:2px;text-shadow:none;font-weight:900;margin:0}
.paper .rule{border-top:2px solid #1d1a14;border-bottom:1px solid #1d1a14;height:4px;margin:6px 0 10px}
.paper .crit{border-bottom:1px dashed #1d1a1455;padding:8px 0}.paper .stars{color:#a8792a;letter-spacing:2px}
.vid{background:#d9c8ff;color:#1b1030;border-radius:16px;padding:12px;margin-bottom:10px}
.vid .thumb{background:#1b1030;border-radius:10px;display:flex;gap:10px;align-items:center;padding:8px;position:relative}
.vid .play{width:44px;height:44px;border-radius:50%;background:#7b2cff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;box-shadow:0 0 20px #7b2cff}
.vid .meta{background:#fff;border-radius:10px;padding:10px;margin-top:8px;font-size:13px}
.phone{background:linear-gradient(180deg,#1e2a1e,#0f160f);border:1px solid #2f4a2f;border-radius:18px;padding:16px;text-align:center;margin-bottom:10px}
.ring{animation:ring .25s infinite alternate;display:inline-block}@keyframes ring{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.pcard{display:flex;gap:10px;align-items:center}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;font-weight:700;font-size:13px}
.tile b{display:block;font-size:30px;margin-bottom:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.hype{height:12px;border-radius:6px;background:#2a2430;overflow:hidden}.hype i{display:block;height:100%;background:linear-gradient(90deg,#ff5d62,#ffd77a,#3dd68c)}
.ceo{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#2a2230,#1a1620);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.statgrid div{border-radius:8px;padding:8px;font-size:12px;background:#ffffff0d}.statgrid b{display:block;font-size:17px}
.sg-good{background:#1d3a28!important}.sg-bad{background:#3a1d1f!important}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.chips button{flex:0 0 auto;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:12px;font-weight:700;font-family:inherit}
.chips button.on{border-color:var(--gold);color:var(--gold);background:#2e2414}
.meter{height:10px;border-radius:5px;background:#2a2430;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%}
.ep{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.ep input[type=text]{margin:0;padding:8px;font-size:14px}
.reveal{animation:pop .6s}
select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:15px;margin-top:6px;font-family:inherit}
</style>
</head>

  const inDev=S.projects.some(p=>p.fid===fr.id);
  if(!last||inDev||fr.fans<20)return;
  const n=fr.parts+1;
  out.push({type:'Sequel',genre:fr.genre,title:fr.name+(n===2?' 2':n===3?' 3':': Chapter '+n),base:fr.name,part:n,fid:fr.id,q:RI(35,82),hype:Math.min(36,6+fr.fans*.35)-Math.max(0,n-3)*4,cost:+((1+fr.fans/15)*I()).toFixed(1),adapt:1,writer:pick(S.people.writers).id});
  if(fr.fans>=50&&Math.random()<.5){const g=fr.genre;out.push({type:'Spinoff',genre:g,title:fr.name+': '+pick(['Origins','Legacy','Rogue','Dawn','The Lost Years','Outcasts']),base:fr.name+' spinoff',part:1,fid:fr.id,q:RI(30,80),hype:fr.fans*.22,cost:+((1+fr.fans/20)*I()).toFixed(1),adapt:1,writer:pick(S.people.writers).id})}
 });
 // shared-universe crossover
 const uni=S.franchises.filter(f=>f.universe&&f.fans>=35);
 if(uni.length>=2&&!S.projects.some(p=>p.type==='Crossover')&&Math.random()<.6){const a=uni[0],b=uni[1];
  out.push({type:'Crossover',genre:a.genre,title:a.name+' vs. '+b.name,base:a.name+' vs. '+b.name,part:1,fid:a.id,q:RI(40,85),hype:Math.min(48,(a.fans+b.fans)*.3),cost:+(6*I()).toFixed(1),adapt:1,writer:pick(S.people.writers).id})}
 let guard=0;
 while(out.length<6&&guard++<60){
  const st=pick(STYPES);const g=st.genres?pick(st.genres):pick(GENRES);const title=genTitle(g);
  if(out.some(o=>o.title===title)||S.films.some(f=>f.title===title))continue;
  const w=pick(S.people.writers);
  const q=clamp(Math.round(R(st.q[0],st.q[1])*.75+w.skill*.25+S.rep/14),10,98);
  out.push({type:st.k,genre:g,title,q,hype:st.hype*(st.game&&ev('gametrend')?1.8:1),crit:st.crit||0,adapt:st.adapt||0,fr:st.fr,game:st.game,writer:w.id,cost:+(R(st.cost[0],st.cost[1])*(0.6+q/100)*I()).toFixed(1)});
 }
 return out;
}

 S.projects.slice().forEach(p=>{

   addNews(p.chem>3?`✨ Table read for <b>${esc(p.title)}</b>: ${esc(L)} and ${esc(C)} have electric chemistry.`:p.chem<-3?`😬 Table read for <b>${esc(p.title)}</b>: ${esc(L)} and ${esc(C)} just don't click.`:`📖 Table read for <b>${esc(p.title)}</b> goes smoothly.`)}
  if(Math.random()<.3&&!p.acquired){const pool=PEVENTS.filter(e=>e.ph.includes(ph)&&(!e.vfx||GEN[p.genre].vfx>.5)&&(!e.stunt||p.depts.stunts>10));

function rivalTitle(){return genTitle(pick(['Drama','Biopic','Thriller','Sci-Fi','Romance']))}
function filmAwards(){
 const y=S.year-1;const films=S.films.filter(f=>yearOf(f.releaseT)===y&&f.dist!=='sell');
 const aw=f=>0.85+GEN[f.genre].award*.15;const sk=id=>{const p=person(id);return p?p.skill:55};
 const lead=(f,g)=>{const a=person(f.cast.lead);return a&&a.g===g?(a.skill*.5+f.critic*.5)*(.88+GEN[f.genre].award*.12):0};
 const cats=[
  {k:'Best Picture',s:f=>(f.critic*.7+f.q*.3)*aw(f),th:[89,99]},
  {k:'Best Director',s:f=>f.q*aw(f),th:[87,98]},
  {k:'Best Actor',s:f=>lead(f,'M'),th:[86,97]},
  {k:'Best Actress',s:f=>lead(f,'F'),th:[86,97]},
  {k:'Best Supporting Performance',s:f=>{const ids=[f.cast.co].concat(f.cast.sup).filter(Boolean);if(!ids.length)return 0;return (Math.max(...ids.map(sk))*.5+f.critic*.5)*(.88+GEN[f.genre].award*.12)},th:[85,96]},
  {k:'Best Original Screenplay',s:f=>f.adapt?0:f.critic*(.88+GEN[f.genre].award*.12)+(sk(f.writer)-60)/8,th:[86,97]},
  {k:'Best Adapted Screenplay',s:f=>!f.adapt?0:f.critic*(.88+GEN[f.genre].award*.12)+(sk(f.writer)-60)/8-(f.part>1?10:0),th:[85,96]},
  {k:'Best Cinematography',s:f=>f.dp?sk(f.dp)*.5+f.critic*.45+(['Sci-Fi','Biopic','Drama'].includes(f.genre)?4:0):0,th:[85,96]},
  {k:'Best Original Score',s:f=>f.comp?sk(f.comp)*.5+f.critic*.45:0,th:[85,96]},
  {k:'Best Visual Effects',s:f=>Math.min(1,f.prod/(250*inf(f.releaseT)))*40+GEN[f.genre].vfx*35+f.critic*.2,th:[82,96]},
  {k:'Best Animated Feature',s:f=>f.genre==='Animation'?f.critic:0,th:[86,97]},
 ];
 const res=[];
 cats.forEach(c=>{let best=null,bs=0;films.forEach(f=>{let s=c.s(f);if(!s)return;s+=(f.fyc?Math.log2(1+f.fyc/(5*inf(f.releaseT)))*2:0)+(f.dist==='platform'?2:0)+([8,9,10,11].includes(f.releaseT%12)?1.5:0)+(f.fest&&f.fest.score>=85?2:0);if(s>bs){bs=s;best=f}});
  if(!best||bs<c.th[0]-6)return;const win=bs>R(c.th[0],c.th[1]);res.push({cat:c.k,film:best,win,rival:rivalTitle()});best.noms.push(c.k);
  if(win){best.awards.push(c.k);S.awards.film++;gainRep(5);const bump=+(6*I()).toFixed(1);S.cash+=bump;best.profit+=bump;
   const pid=c.k==='Best Director'?best.dir:c.k.includes('Act')?best.cast.lead:c.k.includes('Screenplay')?best.writer:c.k==='Best Cinematography'?best.dp:c.k==='Best Original Score'?best.comp:null;
   const pp=person(pid);if(pp){if(pp.star!=null)pp.star=clamp(pp.star+8,0,99);if(pp.fame!=null)pp.fame=clamp(pp.fame+8,0,99)}}});
 const wins=res.filter(r=>r.win);if(wins.length)addNews(`🏆 ${esc(S.name)} wins ${wins.length} Golden Statue${wins.length>1?'s':''} at the ${y} ceremony!`);
 awardsScreen(`THE ${y} GOLDEN STATUE AWARDS`,'Awards night',films.length,res,'The Academy rewards acclaimed work: dramas and biopics with 85%+ reviews, released September–December, with a festival premiere and a For Your Consideration campaign.');
}
function tvAwards(){
 const t=tNow();const seasons=[];S.shows.forEach(sh=>sh.seasons.forEach(se=>{if(t-se.t<=12)seasons.push({sh,se})}));
 const res=[];const cats=[
  {k:'Best Drama Series',ok:s=>['Prestige Drama','Crime Drama','Fantasy Epic','Sci-Fi Series'].includes(s.sh.genre)},
  {k:'Best Comedy Series',ok:s=>['Comedy','Animated Series'].includes(s.sh.genre)},
  {k:'Best Limited Series',ok:s=>s.sh.genre==='Limited Series'},
  {k:'Best Lead Performance (TV)',ok:s=>!!s.sh.lead}];
 cats.forEach(c=>{let best=null,bs=0;seasons.filter(c.ok).forEach(s=>{const sc=s.se.critic*(.85+TV_GENRES[s.sh.genre].award*.15)+(c.k.includes('Lead')?((person(s.sh.lead)||{skill:50}).skill-60)/5:0);if(sc>bs){bs=sc;best=s}});
  if(!best||bs<80)return;const win=bs>R(84,97);res.push({cat:c.k,film:best.sh,win,rival:pick(TVW[0])+' '+pick(TVW[1])});if(win){best.sh.awards.push(c.k);S.awards.tv++;gainRep(3)}});
 if(res.some(r=>r.win))addNews(`📺 ${esc(S.name)} wins big at the Golden Screen Awards!`);
 awardsScreen(`THE ${S.year} GOLDEN SCREEN AWARDS`,'TV awards night',seasons.length,res,'Make acclaimed series (80%+ reviews) to compete for Golden Screens.');
}

 if(TW.step===0){const ps=pitches();h+=`<h2>Choose a pitch</h2>`+(ps.length?ps.map((p,i)=>`<div class="card opt ${TW.pitch===p?'sel':''}" onclick="TW.pitch=S.pitches[${i}];TW.writer=TW.pitch.writer;tvWiz()"><div class="row"><b>${TV_GENRES[p.genre].icon} ${esc(p.title)}</b><span class="muted">${M(p.cost)}</span></div><div class="muted" style="font-size:13px;margin-top:4px">${p.genre} · pitched by ${esc(pname(p.writer))} · ${(p.q/10).toFixed(1)}/10</div>${bar(p.q)}</div>`).join(''):'<p class="card muted">No pitches this month.</p>');
  h+=`<button class="btn gold" ${TW.pitch?'':'disabled'} onclick="TW.step=1;tvWiz()">Next →</button>`+back}
 else if(TW.step===1){W={script:{genre:'Drama'},_role:'writers'};
  const pw=person(TW.pitch.writer);const ws=[pw].concat(TW.wrs.filter(w=>w.id!==pw.id));
  h+=`<h2>Showrunner & star</h2><h3 style="margin:8px 0">✍️ Showrunner</h3>`+ws.map(w=>personCard(w,TW.writer===w.id,`TW.writer='${w.id}';tvWiz()`,false,lockC(w))).join('');
  h+=`<h3 style="margin:12px 0 8px">⭐ Lead actor</h3>`+TW.acts.map(a=>personCard(a,TW.lead===a.id,`TW.lead=TW.lead==='${a.id}'?null:'${a.id}';tvWiz()`,true,lockA(a))).join('');
  h+=`<button class="btn gold" ${TW.writer?'':'disabled'} onclick="TW.step=2;tvWiz()">Next →</button>`+back}
 else{const g=TW.pitch.genre;const ideal=tvEpIdeal(g);if(TW.epB==null)TW.epB=+ideal.toFixed(1);const cost=TW.eps*TW.epB;
  h+=`<h2>Season plan</h2><div class="card"><small>Episodes</small><div class="seg">${[6,8,10,13].map(n=>`<button class="${TW.eps===n?'on':''}" onclick="TW.eps=${n};tvWiz()">${n}</button>`).join('')}</div></div>
  <div class="card"><div class="row"><small>Budget per episode</small><b id="eb">${M(TW.epB)}</b></div><input type="range" min="0.5" max="${Math.round(30*I())}" step="0.5" value="${TW.epB}" oninput="TW.epB=+this.value;document.getElementById('eb').textContent=M(TW.epB);document.getElementById('tc').textContent=M(TW.eps*TW.epB)"><p class="muted" style="font-size:12px">Typical ${g}: ${M(ideal)} per episode. Prestige dramas can cost $15M+ per episode.</p></div>
  <div class="card"><small>Where it airs</small><div class="seg">${S.streaming?`<button class="${TW.outlet==='own'?'on':''}" onclick="TW.outlet='own';tvWiz()">📡 ${esc(S.streaming.name)}</button>`:''}<button class="${TW.outlet==='network'?'on':''}" onclick="TW.outlet='network';tvWiz()">Broadcast network</button><button class="${TW.outlet==='rival'?'on':''}" onclick="TW.outlet='rival';tvWiz()">Rival streamer</button></div><p class="muted" style="font-size:12px;margin-top:6px">${TW.outlet==='own'?'Grows your subscribers; no licence fee.':'They pay a licence fee (usually cost-plus) when each season is delivered.'}</p></div>
  <div class="card"><div class="row"><b>Season cost</b><b id="tc">${M(cost)}</b></div><small>Paid during production (${3+Math.ceil(TW.eps/4)} months)</small></div>
  <button class="btn gold" onclick="greenlightShow(TW);save();TAB='slate';render()">🟢 ORDER THE SERIES</button>`+back}
 $('#app').innerHTML=h;window.scrollTo(0,0)}

function filmReport(f,ctx){const t=tNow();
 const canFyc=!f.fyc&&f.dist!=='sell'&&f.critic>=72&&yearOf(f.releaseT)===S.year&&S.month>=8;
 let h=`<div class="film">${poster(f.genre,56)}<div style="flex:1"><h3>${esc(f.title)}</h3><p class="muted" style="font-size:13px">${f.genre} · ${f.rating} · ${tLabel(f.releaseT)} · ${f.dist==='stream'?'Streaming':f.dist==='sell'?'Sold to streamer':f.dist==='platform'?'Platform':(f.screens||0).toLocaleString()+' screens'}<br>Dir. ${esc(pname(f.dir))} · ${esc(pname(f.cast.lead))}${f.cast.co?' & '+esc(pname(f.cast.co)):''}</p></div><div class="center"><div class="grade gold">${f.grade}</div><small>Audience</small></div></div>
 <div class="card" style="margin-top:10px"><div class="row"><small>Critics</small><span class="big" style="color:${f.critic>=60?'var(--green)':'var(--red)'}">🍅 ${f.critic}%</span></div>${(f.reviews||[]).map(r=>`<div class="news" style="padding:6px 0"><div class="row"><b style="font-size:13px">${r.o}</b><small>${r.s}/100</small></div><i class="muted">"${r.q}"</i></div>`).join('')}</div>`;
 if(f.awards.length||f.noms.length)h+=`<div class="card"><small>Awards</small>${f.noms.map(n=>`<div style="margin-top:4px">${f.awards.includes(n)?'🏆 <b>'+n+'</b>':'Nominated: '+n}</div>`).join('')}</div>`;
 if(f.dist==='stream')return h+`<div class="card"><div class="row"><span>Views in first month</span><b>${f.views}M</b></div><div class="row" style="margin-top:6px"><span class="muted">Total cost</span><span>${M(f.costTotal)}</span></div><p class="muted" style="font-size:13px;margin-top:6px">Its value shows up as subscriber growth on ${esc(S.streaming?S.streaming.name:'your service')}.</p></div>`;
 if(f.dist==='sell')return h+`<div class="card"><div class="row"><span>Licence fee</span><b>${M(f.revenue)}</b></div><div class="row" style="margin-top:6px"><span class="muted">Cost</span><span>−${M(f.costTotal)}</span></div><div class="row" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><b>Profit</b><b class="${f.profit>=0?'pos':'neg'}">${M(f.profit)}</b></div></div>`;
 const mx=Math.max(...f.weeks,.01);
 h+=`<div class="grid2"><div class="card stat"><small>${f.dist==='platform'?'Limited opening':'Opening weekend'}</small><span class="big">${M(f.opening)}</span></div><div class="card stat"><small>Worldwide</small><span class="big">${M(f.ww)}</span></div><div class="card stat"><small>Domestic</small><span class="big">${M(f.dom)}</span></div><div class="card stat"><small>International</small><span class="big">${M(f.intl)}</span></div></div>
 <div class="card"><small>Weekly domestic gross</small><div class="chart">${f.weeks.slice(0,12).map((w,i)=>`<div style="height:${w/mx*100}%;animation-delay:${i*.05}s"><span>W${i+1}</span></div>`).join('')}</div><div style="height:16px"></div></div>
 <div class="card"><small>World box office</small><table style="margin-top:4px">${f.countries.slice(0,9).map(c=>`<tr><td>${c.f} ${c.k}</td><td class="r">${c.ban?'<span class="neg">Not released</span>':M(c.g)}</td></tr>`).join('')}${f.countries.filter(c=>c.ban).slice(0,2).filter(c=>f.countries.indexOf(c)>=9).map(c=>`<tr><td>${c.f} ${c.k}</td><td class="r neg">Not released</td></tr>`).join('')}</table></div>
 <div class="card">${[['Domestic rentals (~50%)',f.domRent],['Overseas rentals (~40%; China 25%)',f.intlRent],['Home, PVOD & TV licensing',f.ancillary],['Tax rebate',f.rebate]].map(r=>`<div class="row muted" style="font-size:13px;margin-top:4px"><span>${r[0]}</span><span>${M(r[1])}</span></div>`).join('')}
 ${f.backendPay?`<div class="row muted" style="font-size:13px;margin-top:4px"><span>Star's back-end (5%)</span><span>−${M(f.backendPay)}</span></div>`:''}${f.partner?`<div class="row muted" style="font-size:13px;margin-top:4px"><span>Co-financier's 40%</span><span>−${M(f.partner)}</span></div>`:''}
 <div class="row muted" style="font-size:13px;margin-top:4px"><span>Your costs</span><span>−${M(f.costTotal)}</span></div>
 <div class="row" style="margin-top:9px;padding-top:9px;border-top:1px solid var(--line)"><b>Ultimate profit</b><b class="big ${f.profit>=0?'pos':'neg'}">${f.profit>=0?'+':''}${M(f.profit)}</b></div>${f.lib?`<small style="display:block;margin-top:6px">Joins ${esc(S.streaming.name)} after its theatrical window.</small>`:''}</div>`;
 if(canFyc)h+=`<div class="card" id="fyc" style="border-color:var(--gold)"><b>🏆 For Your Consideration</b><p class="muted" style="font-size:13px;margin:4px 0">Screeners, trade ads, Q&amp;As before March's Golden Statues.</p>${[5,15,30].map(a=>`<button class="btn sm ${a===30?'gold':'ghost'}" onclick="fycCampaign(${f.id},${Math.round(a*I())},'${ctx}')">${M(a*I())}</button>`).join('')}</div>`;
 return h}

 <div class="card"><h3>Domestic market share</h3><table>${rows.map((r,i)=>`<tr><td>${i+1}. ${r.me?'<b class="gold">'+esc(r.n)+'</b>':esc(r.n)}</td><td class="r">${M(r.dom)}</td><td class="r">${pct(r.share)}</td></tr>`).join('')}</table></div>
 <div class="grid3"><div class="card stat"><small>Releases</small><span class="big">${mine.length}</span></div><div class="card stat"><small>Gross</small><span class="big">${M(sum(mine,f=>f.ww))}</span></div><div class="card stat"><small>Profit</small><span class="big ${sum(mine,f=>f.profit)>=0?'pos':'neg'}">${M(sum(mine,f=>f.profit))}</span></div></div>
 ${lib?`<div class="card"><div class="row"><span>📚 Library licensing income</span><b class="pos">+${M(lib)}</b></div></div>`:''}${S.lastTax?`<div class="card"><div class="row"><span>🧾 Corporate tax (21%)</span><b class="neg">−${M(S.lastTax)}</b></div></div>`:''}${S.streaming&&svcLive()?`<div class="card"><div class="row"><span>📡 ${esc(S.streaming.name)}</span><b>${fmtN(S.streaming.subs)} subscribers</b></div></div>`:''}

 <div class="card center"><small>Legacy score</small><div class="big" style="font-size:52px;color:var(--gold)">${score}</div><b>${rank}</b></div>
 <div class="grid3"><div class="card stat"><small>Films</small><span class="big">${S.films.length}</span></div><div class="card stat"><small>Gross</small><span class="big">${M(total)}</span></div><div class="card stat"><small>Awards</small><span class="big">🏆 ${aw}</span></div></div>
 ${best?`<div class="card film">${poster(best.genre)}<div><small>Biggest hit</small><div><b>${esc(best.title)}</b></div><div class="muted" style="font-size:13px">${M(best.ww)} worldwide · ${tLabel(best.releaseT)}</div></div></div>`:''}
 <button class="btn gold" onclick="wipe();S=null;title()">🎬 Found a new studio</button>`;window.scrollTo(0,0)}
function settings(){modal(`<h3>Menu</h3><button class="btn ghost" onclick="exportSave()">📋 Copy save code</button><p class="muted" style="font-size:12px;margin-top:4px">Your game saves automatically. Use a save code to move it to another device.</p><button class="btn ghost" onclick="modal();S=null;title()">🏠 Main menu</button><button class="btn ghost" onclick="modal()">Close</button>`)}

function importSave(){modal(`<h3>Load a save code</h3><textarea id="ic" rows="5"></textarea><button class="btn gold" onclick="doImport()">Load</button><button class="btn ghost" onclick="modal()">Cancel</button><p id="ie" class="neg" style="font-size:13px;margin-top:6px"></p>`)}

 else{const g=TW.pitch.genre;const ideal=tvEpIdeal(g);if(TW.epB==null)TW.epB=+ideal.toFixed(1);const cost=TW.eps*TW.epB;
  h+=`<h2>Season plan</h2><div class="card"><div class="row"><small>Budget per episode</small><b id="eb">${M(TW.epB)}</b></div><input type="range" min="0.5" max="${Math.round(30*I())}" step="0.5" value="${TW.epB}" oninput="TW.epB=+this.value;document.getElementById('eb').textContent=M(TW.epB);document.getElementById('tc').textContent=M(TW.eps*TW.epB)"><p class="muted" style="font-size:12px">Typical ${g}: ${M(ideal)} per episode.</p></div>
  <div class="card"><small>Release style</small><div class="seg"><button class="${TW.mode==='binge'?'on':''}" onclick="TW.mode='binge';tvWiz()">📦 All at once<br><small>binge</small></button><button class="${TW.mode==='weekly'?'on':''}" onclick="TW.mode='weekly';tvWiz()">📅 Weekly<br><small>one per week</small></button></div><p class="muted" style="font-size:12px;margin-top:6px">${TW.mode==='binge'?'Huge launch spike and sign-ups, but buzz fades fast.':'Slower start, longer buzz, more social chatter. Cliffhangers pay off.'}</p></div>
  <div class="card"><small>Where it airs</small><div class="seg">${S.streaming?`<button class="${TW.outlet==='own'?'on':''}" onclick="TW.outlet='own';tvWiz()">📡 ${esc(S.streaming.name)}</button>`:''}<button class="${TW.outlet==='network'?'on':''}" onclick="TW.outlet='network';tvWiz()">Network TV</button><button class="${TW.outlet==='rival'?'on':''}" onclick="TW.outlet='rival';tvWiz()">Rival streamer</button></div></div>
  <div class="card"><div class="row"><b>Season cost</b><b id="tc">${M(cost)}</b></div></div>
  <button class="btn gold" onclick="TW.epNames=TW.epNames.map((e,i)=>e||'Episode '+(i+1));greenlightShow(TW);save();TAB='hq';render()">🟢 ORDER THE SERIES</button>`+back}
 $('#app').innerHTML=h;window.scrollTo(0,0)}
const EPW=[['The','A','Last','First','Broken','Silent','Burning','Hidden','Cold','Long'],['Night','Signal','Promise','Door','Storm','Lie','Goodbye','Reckoning','Return','Bargain','Witness','Crown']];
function epTitle(){return pick(EPW[0])+' '+pick(EPW[1])}
function showModal(id){const s=S.shows.find(x=>x.id===id);if(!s)return;const last=s.seasons[s.seasons.length-1];
 const epv=last&&last.epViews||[];const mx=Math.max(...epv,1);
 modal(`<div class="pcard"><div style="width:70px;height:105px;border-radius:6px;background:linear-gradient(160deg,#1a3a4a,#0d0b10);display:flex;align-items:center;justify-content:center;font-size:34px">${TV_GENRES[s.genre].icon}</div><div><h3>${esc(s.title)}</h3><p class="muted" style="font-size:13px">${s.genre} · ${s.eps} eps · ${s.mode==='weekly'?'weekly':'binge'}<br>${s.lead?esc(pname(s.lead)):''}</p>${last?`<span class="tag ${last.critic>=85?'hot':last.critic>=60?'good':'bad'}">${last.critic>=85&&last.views>20?'🔥 VIRAL HIT':last.critic>=65?'$ HIT':last.critic>=50?'★ STANDARD':'📉 FLOP'}</span>`:''}</div></div>
 ${epv.length?`<div class="card"><small>Viewers per episode (season ${last.n})</small><div class="chart">${epv.map((v,i)=>`<div style="height:${v/mx*100}%"><span>${i+1}${(s.cliff||[])[i]?'❓':''}</span></div>`).join('')}</div><div style="height:16px"></div></div>`:''}
 <div class="card">${(s.epNames||[]).map((e,i)=>`<div class="ep" style="font-size:13px"><b style="width:22px">${i+1}</b><span style="flex:1">${esc(e)}</span>${(s.cliff||[])[i]?'❓':''}</div>`).join('')}</div>
 <div class="card"><table><tr><th>Season</th><th class="r">Critics</th><th class="r">Views</th><th class="r">Fee</th></tr>${s.seasons.map(se=>`<tr><td>S${se.n}</td><td class="r">${se.critic}%</td><td class="r">${se.views}M</td><td class="r">${se.fee?M(se.fee):'—'}</td></tr>`).join('')||'<tr><td colspan=4 class="muted">Premieres '+tLabel(s.readyT)+'</td></tr>'}</table></div>
 ${s.renew?`<button class="btn gold" onclick="renewShow(${id},true);save();modal();render()">🔁 Renew for season ${s.season+1}</button><button class="btn ghost" onclick="renewShow(${id},false);save();modal();render()">✂️ Cancel</button>`:''}<button class="btn ghost" onclick="modal()">Close</button>`)}

/* ---------- Streaming donut on Empire tab ---------- */
const _viewEmpire=viewEmpire;
viewEmpire=function(){const sv=S.streaming;const items=[{n:TECH_STREAMER.n,v:TECH_STREAMER.subs,c:'#9b59ff'}].concat(S.rivals.filter(r=>r.alive&&r.svc).map(r=>({n:r.svc,v:r.subs,c:r.c})));if(sv&&svcLive())items.push({n:sv.name,v:Math.max(sv.subs,.5),c:'#00e0b0',me:1});
 const tot=sum(items,x=>x.v);
 return `<div class="card"><h3>🌍 Global streaming market</h3><small style="text-transform:none">${fmtN(tot)} subscribers worldwide</small><div class="row" style="margin-top:8px"><div>${donut(items,130)}</div><div style="flex:1">${items.sort((a,b)=>b.v-a.v).map(i=>`<div style="font-size:12px;margin:3px 0"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${i.c}"></span> ${i.me?'<b class="gold">'+esc(i.n)+' (you)</b>':esc(i.n)} · ${fmtN(i.v)} (${(i.v/tot*100).toFixed(1)}%)</div>`).join('')}</div></div>${sv&&svcLive()?'<p class="muted" style="font-size:12px;margin-top:6px">💡 Every giant started small. Keep adding quality films and shows.</p>':''}</div>`+_viewEmpire()}


title();
</script>
