<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120E16">
<title>Shaadi Inc.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#120E16;--p1:#1E1724;--p2:#2A2031;--line:#3A2D44;--iv:#F6EEDF;--mu:#B9AEB8;--dim:#7E7287;--gold:#D9A931;--mari:#F29F05;--red:#C8102E;--henna:#5E8C46;--rose:#E8A0A8;--ok:#5FB37A;--warn:#E9A23B;--bad:#E5484D;
--serif:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--iv);font-family:var(--sans);font-size:15px;line-height:1.45;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.2px}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px}
.mu{color:var(--mu)}.dim{color:var(--dim)}.gold{color:var(--gold)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.sm{font-size:13px}.xs{font-size:12px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.topbar{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.topbar .house{flex:1;min-width:0}
.topbar .house b{font-family:var(--serif);font-size:20px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .house span{font-size:12px;color:var(--mu)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;background:var(--p1);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip i{font-style:normal;color:var(--gold)}
.main{flex:1;overflow-y:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
.nav{display:flex;border-top:1px solid var(--line);background:var(--p1);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--gold)}
.nav .dot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:4px;background:var(--red)}
.card{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.hl{border-color:#6b5420;background:linear-gradient(180deg,#2a2016,#1E1724)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--p2);border-radius:12px;padding:11px 16px;font-weight:500;font-size:15px}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a1206}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:none}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.sec{font-family:var(--serif);font-size:19px;margin:18px 0 10px;display:flex;align-items:baseline;gap:8px}
.sec small{font-family:var(--sans);font-size:12px;color:var(--mu)}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;border-radius:4px;transition:width .5s}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}.kv span:nth-child(odd){color:var(--mu)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--p2);border:1px solid var(--line);color:var(--mu);margin:2px 4px 2px 0}
.tag.g{color:var(--gold);border-color:#5a4718}.tag.r{color:#ff8a8f;border-color:#5a2026}.tag.o{color:var(--ok);border-color:#2f5a3c}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.demand{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:5px 0}
.demand .ic{width:18px;flex:none;text-align:center}
.sheet-bg{position:fixed;inset:0;background:rgba(5,3,8,.66);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--p1);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.opt{display:block;width:100%;text-align:left;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.opt.sel{border-color:var(--gold);background:#2d2418}
.opt:disabled{opacity:.45}
.opt .t{font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 76px);background:var(--p2);border:1px solid var(--gold);color:var(--iv);padding:10px 16px;border-radius:12px;z-index:80;font-size:14px;max-width:90%;text-align:center;animation:fade .2s;pointer-events:none}
.scene{position:relative;border-radius:14px;overflow:hidden;background:#0d0a12;border:1px solid var(--line);margin-bottom:12px;touch-action:none}
.scene canvas{display:block;width:100%;touch-action:none}
.scene .ov{position:absolute;left:10px;top:8px;font-size:12px;color:var(--mu);pointer-events:none}
.meters{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.meters .lab{font-size:12px;color:var(--mu);margin-bottom:4px;display:flex;justify-content:space-between}
.clock{text-align:center;font-family:var(--serif);font-size:22px;line-height:1}
.clock small{display:block;font-family:var(--sans);font-size:11px;color:var(--mu);margin-top:3px}
.phases{display:flex;gap:4px;margin:10px 0}
.phases i{flex:1;height:4px;border-radius:2px;background:var(--line)}.phases i.d{background:var(--gold)}.phases i.c{background:var(--mari)}
.event h3{margin-bottom:6px}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;background:radial-gradient(ellipse at 50% 30%,#2b1a24,#120E16 70%)}
.splash h1{font-size:52px;line-height:1;margin:18px 0 6px;color:var(--iv)}
.splash .sub{color:var(--gold);font-family:var(--serif);font-size:19px;font-style:italic}
.input{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--iv);font:inherit;font-size:16px;margin-bottom:10px;user-select:text;-webkit-user-select:text}
.list-item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:21px;flex:none;overflow:hidden;background:var(--p2)}
.log{font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.log b{color:var(--gold);font-weight:500;min-width:62px}
.big-num{font-family:var(--serif);font-size:34px;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--p2);border-radius:12px;padding:10px 12px}
.mini .l{font-size:12px;color:var(--mu)}.mini .v{font-family:var(--serif);font-size:22px}
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.slot.empty{border-style:dashed}
.slot .si{width:34px;height:34px;border-radius:10px;background:var(--p1);display:flex;align-items:center;justify-content:center;flex:none;color:var(--gold)}
.slot .si svg{width:20px;height:20px}
.pattern{height:10px;margin:0 -16px 12px;background:repeating-linear-gradient(90deg,var(--gold) 0 2px,transparent 2px 10px),var(--red);opacity:.5}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>

// Tiny painter's-algorithm 3D renderer on Canvas 2D. No WebGL needed.
const E3=(()=>{

const cache={};
function boxG(w,h,d){const k='b'+w+'_'+h+'_'+d;if(cache[k])return cache[k];const x=w/2,z=d/2,P=[[-x,0,-z],[x,0,-z],[x,0,z],[-x,0,z],[-x,h,-z],[x,h,-z],[x,h,z],[-x,h,z]],F=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];return cache[k]=mk(F.map(f=>f.map(i=>P[i])),[0,h/2,0])}

class Scene{

  if(!low){const n=A.createBufferSource(),b=A.createBuffer(1,A.sampleRate*.08,A.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);n.buffer=b;const ng=A.createGain(),hp=A.createBiquadFilter();hp.type='highpass';hp.frequency.value=1500;ng.gain.value=vol*.6;n.connect(hp).connect(ng).connect(master);n.start(t)}}

function predictScores(b){const p=planObj(b),C=CLASSES[b.cls];let base=50+(S.head.trait==='charming'?6:0);const sc={bride:base,groom:base};
 let q=0,n=0;for(const s of SLOTS){const v=p[s.id];if(!v)continue;let vq=v.q;if(S.head.trait==='showman'&&['decor','lights','procession'].includes(s.id))vq+=.6;q+=vq;n++}

 const over=p.venue?b.guests/p.venue.cap:1;if(over>1){sc.bride-=(over-1)*50;sc.groom-=(over-1)*50}
 return{bride:clamp(sc.bride,0,100),groom:clamp(sc.groom,0,100),over,avgQ:avg}}
function autoPlan(b,skill=3){const plan={};
 for(const s of SLOTS){const opts=VENDORS.filter(v=>v.slot===s.id&&!vendorOk(v,b));let best=null,bs=-1e9;
  for(const v of opts){const tmp=Object.assign({},b.plan,plan,{[s.id]:v.id});const tb=Object.assign({},b,{plan:tmp});const pr=predictScores(tb);const cost=vCost(v,b);
   let sc=(pr.bride+pr.groom)/2*(.6+skill*.12)-cost/b.fee*60;if(s.id==='venue'&&b.guests>v.cap)sc-=40;if(s.id==='feast'&&b.trad==='jain'&&v.food!=='jain')sc-=50;if(s.id==='feast'&&(b.trad==='marwari')&&v.food==='any')sc-=40;

// ---------- wedding day ----------
function startWedding(b){const p=planObj(b),pr=predictScores(b),tr=TRADITIONS[b.trad];
 const slack=ri(30,170)+(S.head.trait==='devout'?40:0);const pre=tr.muhurat?240:150;
 const W={bid:b.id,phase:0,time:1080,muhurat:1080+pre+slack,b:pr.bride,g:pr.groom,cost:0,rep:0,log:[],evQ:[],used:{},cur:null,flags:{},done:false};
 b.wd=W;W.evQ=pickPhaseEvents(b,0);nextEvent(b);return W}
function evCtx(b){const p=planObj(b);return{plan:p,trad:b.trad,cls:b.cls,month:miM(b.wm),muhurat:TRADITIONS[b.trad].muhurat,over:p.venue?b.guests/p.venue.cap:1,rival:S.rival.rep>S.rep*.8,rel:sl=>vRel(p[sl])}}
function pickPhaseEvents(b,ph){const c=evCtx(b),W=b.wd;const pool=EVENTS.filter(e=>e.ph===ph&&!W.used[e.id]);
 const forced=['jain_onion','meat_veg','crowded','food_short','fire_spark','pandit_late','ele_stop','mare_spook','palki_tilt','drunk_singer'];
 const out=[];for(const e of pool){if(e.when&&forced.includes(e.id)&&e.when(c))out.push(e)}
 const rest=pool.filter(e=>!forced.includes(e.id)&&(!e.when||e.when(c))&&!(e.id==='seat'&&itemCount(b,'seating')>=2));
 const want=ph===4?1:(R()<.45?2:1);while(out.length<want&&rest.length){const i=Math.floor(R()*rest.length);out.push(rest.splice(i,1)[0])}
 out.forEach(e=>W.used[e.id]=1);return out.slice(0,3)}
const PHASE_MIN=[90,60,90,60,60];
function nextEvent(b){const W=b.wd;if(W.evQ.length){W.cur=W.evQ.shift();return W.cur}
 // phase ends
 W.time+=PHASE_MIN[W.phase];W.phase++;
 const tr=TRADITIONS[b.trad],cerPh=tr.muhurat?3:2;
 if(W.phase===cerPh){const late=W.time-W.muhurat;let pen;if(late>0){pen=Math.min(28,8+late/4)*(tr.muhurat?1:.5);W.b-=pen;W.g-=pen;W.log.push({t:'The ceremony began '+late+' minutes after the '+tr.clockName.toLowerCase()+'.',bad:1});W.rep-=2}else{W.b+=4;W.g+=4;W.log.push({t:'The ceremony began on time, '+(-late)+' minutes before the '+tr.clockName.toLowerCase()+'.'})}
  if(W.flags.risk){if(R()<.5){W.b-=10;W.g-=10;W.log.push({t:'The original time was wrong after all. The elders are upset.',bad:1})}}
  if(W.flags.storm){const sh=itemCount(b,'canopy')>=2?.4:1;if(R()<.55){W.b-=14*sh;W.g-=14*sh;W.log.push({t:'The storm soaked the mandap during the ritual.',bad:1})}else W.log.push({t:'The storm passed by. Lucky.'})}}
 if(W.phase>=5){W.cur=null;W.done=true;return null}
 W.evQ=pickPhaseEvents(b,W.phase);return nextEvent(b)}
function chooseEvent(b,ci){const W=b.wd,e=W.cur,c=e.ch[ci];const res={cost:c.c||0,t:c.t||0,b:c.b||0,g:c.g||0,r:c.r||0};
 W.cost+=res.cost;W.time+=res.t;W.b+=res.b;W.g+=res.g;W.rep+=res.r;
 if(c.x==='risk')W.flags.risk=1;if(c.x==='storm')W.flags.storm=1;if(c.x==='honour'){S.stats.honour=(S.stats.honour||0)+1}
 if(c.x==='vendorhurt'){const fid=b.plan.feast;S.vrel[fid]=Math.max(0,(S.vrel[fid]||0)-3)}
 W.log.push({t:e.t.split('.')[0]+'. You chose: '+c.l.toLowerCase()+'.',res});W.b=clamp(W.b,0,100);W.g=clamp(W.g,0,100);
 nextEvent(b);return res}
function autoRunWedding(b,skill){startWedding(b);let guard=0;while(!b.wd.done&&guard++<30){const e=b.wd.cur;let best=0,bs=-1e9;e.ch.forEach((c,i)=>{const s=(c.b||0)+(c.g||0)-(c.c||0)/8-Math.max(0,c.t||0)/10+(c.r||0)*2+(skill-3)*R()*3;if(s>bs){bs=s;best=i}});if(R()>.4+skill*.12)best=Math.floor(R()*e.ch.length);chooseEvent(b,best)}return finishWedding(b,true)}
function finishWedding(b,auto){const W=b.wd,C=CLASSES[b.cls];const bs=Math.round(clamp(W.b,0,100)),gs=Math.round(clamp(W.g,0,100)),avg=(bs+gs)/2;
 const vc=planCost(b);let tip=0,withheld=0;if(avg>=85)tip=Math.round(b.fee*.15);else if(avg>=75)tip=Math.round(b.fee*.07);if(avg<40)withheld=Math.round(b.fee*.3);
 const rest=b.fee-b.advance-withheld;S.money+=rest+tip-vc-W.cost;
 const tier=fameTier(),low=(b.cls==='artisan'&&tier>=2)||(b.cls==='merchant'&&tier>=4);let rep=((avg-55)/6)*C.repMul*(low&&avg>55?.3:1)+W.rep;if(S.head.trait==='proud')rep*=1.2;rep=Math.round(rep*10)/10;S.rep=Math.max(0,S.rep+rep);
 for(const s of SLOTS){const id=b.plan[s.id];S.vrel[id]=(S.vrel[id]||0)+(avg>=60?1:.5);S.vuse[id]=(S.vuse[id]||0)+1}
 const profit=b.fee-withheld+tip-vc-W.cost;
 b.done=true;b.result={bs,gs,avg,tip,withheld,vc,ev:W.cost,profit,rep,auto:!!auto};
 S.stats.weddings++;S.stats.earned+=profit;if(avg>=90)S.stats.perfect++;
 const entry={i:b.wm,name:b.bride.surname+' and '+b.groom.surname,trad:b.trad,cls:b.cls,guests:b.guests,avg,profit,auto:!!auto};S.chron.unshift(entry);if(S.chron.length>400)S.chron.length=400;
 if(!S.stats.best||avg>S.stats.best.avg)S.stats.best=entry;
 const verdict=avg>=85?'a triumph':avg>=70?'a success':avg>=50?'a mixed affair':'a disaster';

 if(avg>=80&&R()<.6){const c=genClient();if(c){c.referral=true;c.cls=b.cls;S.inquiries.push(c)}}

function blockers(){const out=[];const now=nowMi();for(const b of activeBookings()){if(b.wm===now&&!b.delegate)out.push({b,t:'The '+b.bride.surname+' wedding is this month. Run the wedding day first.'});else if(b.wm===now+0&&!b.locked&&!b.delegate)out.push({b,t:'Plan the '+b.bride.surname+' wedding.'})}return out}
function monthCosts(){return [8,20,45,100,200][fameTier()]+S.staff.reduce((a,s)=>a+s.wage,0)+Math.round(S.debt*.03)}
function advanceMonth(){const ev=[];const now=nowMi();
 // delegated weddings this month
 for(const b of activeBookings()){if(b.wm===now&&b.delegate){const st=S.staff.find(s=>s.id===b.delegate)||{skill:2,name:'Your assistant'};if(!b.locked){b.plan=autoPlan(b,st.skill);b.locked=true}const r=autoRunWedding(b,st.skill);ev.push({t:st.name+' ran the '+b.bride.surname+' wedding: score '+Math.round(r.avg)+', profit '+money(r.profit)+'.'})}}
 // overdue (should not happen) - auto-run badly
 for(const b of activeBookings()){if(b.wm<now+0&&!b.done){if(!b.locked)b.plan=autoPlan(b,1);autoRunWedding(b,1)}}
 S.inquiries=S.inquiries.filter(q=>{if(q.exp<=now){if(R()<.6&&S.rival){S.rival.rep+=1.5}return false}return true});
 const mc=monthCosts();S.money-=mc;
 S.month++;if(S.month>11){S.month=0;S.year++;S.head.age++;S.staff.forEach(s=>s.age=(s.age||30)+1);yearly(ev)}
 S.rep-=Math.max(0,S.rep-100)*.005;for(const k in S.fx)if(typeof S.fx[k]==='number'&&!k.endsWith('V'))S.fx[k]=Math.max(0,S.fx[k]-1);
 // history

 // rival

 if(S.inquiries.length&&R()<.18){const q=S.inquiries.splice(Math.floor(R()*S.inquiries.length),1)[0];S.rival.rep+=2;ev.push({t:'The '+q.bride.surname+' family went to the '+S.rival.name+' instead.'})}
 // money trouble
 if(S.money<0){const need=Math.ceil(-S.money/100)*100+200;S.debt+=need;S.money+=need;ev.push({t:'Seth Bhikamchand the moneylender lent you '+money(need)+' at 3% a month.',bad:1});addLog('Borrowed '+money(need)+' from the moneylender.')}
 if(S.debt>6000)S.bankrupt=true;
 genInquiries(false);
 if(S.year>END_YEAR&&!S.ended){S.ended=true;ev.push({t:'The 18th century ends. Stage 1 is complete.',end:1})}
 save();return ev}
function yearly(ev){const a=S.head.age;if(a>=58&&R()<.1+(a-58)*.04){ev.push({succession:1,t:S.head.name+' has died at the age of '+a+'. The house needs a new head.'});S.pendingHeir=makeHeirs()}}
function makeHeirs(){const sn=S.house.replace(/^House of /,'');const tr=Object.keys(TRADITIONS);const t=Object.keys(TRAITS);
 const a={name:pick(FIRST)+' '+sn,trait:pick(t),age:ri(24,34),female:false},b2={name:pick(FEM)+' '+sn,trait:pick(t.filter(x=>x!==a.trait)),age:ri(22,32),female:true};return[a,b2]}
function chooseHeir(i){const h=S.pendingHeir[i];S.heads.push({name:S.head.name,trait:S.head.trait,gen:S.head.gen,until:S.year,age:S.head.age});S.head={name:h.name,trait:h.trait,age:h.age,gen:S.head.gen+1,female:h.female};S.rep=Math.round(S.rep*.93);delete S.pendingHeir;addLog(h.name+' becomes head of the house. Generation '+S.head.gen+'.');save()}
function applyHist(h){const f=h.fx;if(f.boom)S.fx.boom=f.boom;if(f.nobleBoost)S.fx.nobleBoost=f.nobleBoost;if(f.mourn)S.fx.mourn=f.mourn;if(f.slump)S.fx.slump=f.slump;if(f.famine)S.fx.famine=f.famine;if(f.decorCheap)S.fx.decorCheap=f.decorCheap;if(f.royalBoost)S.fx.royalBoost=f.royalBoost;if(f.budget){S.fx.budget=f.len;S.fx.budgetV=f.budget}if(f.rep)S.rep+=f.rep;
 if(f.mourn)S.inquiries=S.inquiries.filter(q=>q.cls!=='royal')}

function staffCandidates(){const used=new Set(S.staff.map(s=>s.name));return [0,1,2].map(()=>{const sk=ri(1,5);let n=pick(STAFF_NAMES);let g=0;while(used.has(n)&&g++<20)n=pick(STAFF_NAMES);used.add(n);return{name:n,skill:sk,wage:6+sk*6+fameTier()*sk*3,hire:30+sk*35}})}

"use strict";
// Stages the wedding day in the 3D scene: camera, baraat, problems, pheras, farewell.

function setupDay(sc,b){const p=planObj(b);const D={sc,b,trad:b.trad,roles:b.trad==='muslim'?ROLES_M:ROLES_H,role:null,procZ:20,procTarget:10.2,procMoving:false,hold:false,ev:[],labels:[],tmp:[],rain:null,fire:null,ritual:null,doli:null};
 D.proc=buildProcession(sc,p.procession?p.procession.type:null,0,20);D.rider=D.proc.rider;
 if(D.rider){D.proc.objs=D.proc.objs.filter(e=>e.o!==D.rider.body);D.proc.pts=D.proc.pts.filter(e=>e.q!==D.rider.face)}
 D.dancers=[];for(let i=0;i<8;i++){const F=figure(sc,{fem:i%3===1,mood:1});F.off=[(i%4-1.5)*.9,2.2+Math.floor(i/4)*1.1];D.dancers.push(F)}
 D.drummers=[];for(let i=0;i<2;i++){const F=figure(sc,{fem:false,col:0xF6EEDF,tur:'#C8102E'});F.off=[i?1:-1,1.4];D.drummers.push(F)}
 // bride waits near the mandap with her family
 D.bride=figure(sc,{fem:true,col:0xC8102E,veil:'#C8102E',mood:1});D.bride.set(-1.2,3.2);
 D.bfam=[0,1,2].map(i=>{const F=figure(sc,{fem:i===1,beard:i===0,mood:1});F.set(-2.4+i*.9,6.2);return F});
 D.officiant=figure(sc,{fem:false,col:b.trad==='muslim'?0xF6EEDF:0xF29F05,tur:b.trad==='muslim'?'#F6EEDF':null,beard:true,mood:0});D.officiant.set(1.3,-1.4,.45);

function placeProc(D,t){const z=D.procZ;D.proc.at(0,z);const ry=D.proc.riderY;if(D.rider&&D.rider.mounted!==false)D.rider.set(0,z,ry+(D.procMoving?Math.abs(Math.sin(t*4))*.06:0));

 if(D.procMoving&&!D.hold){D.procZ=Math.max(D.procTarget,D.procZ-dt*1.7);if(D.procZ<=D.procTarget){D.procMoving=false;if(D.onArrive){const f=D.onArrive;D.onArrive=null;f()}}}

 if(D.rain)for(const q of D.rain){q.p[1]-=dt*14;if(q.p[1]<0){q.p[1]=10+Math.random()*4;q.p[0]=(Math.random()-.5)*20;q.p[2]=(Math.random()-.5)*20}}

 if(D.doli){D.doli.z+=dt*1.6;D.doli.g.at(0,D.doli.z);D.doli.bearers.forEach((F,i)=>F.set(F.ox,D.doli.z+F.oz,Math.abs(Math.sin(t*6+i))*.05));if(D.doli.z>19){D.doli.done=true}}

function label(D,p,text,kind){const lb={p,text,kind};D.sc.labels.push(lb);D.labels.push(lb);return lb}

function dayPhase(D,ph){const role=D.roles[ph]||'farewell';D.role=role;clearLabels(D);if(D.rain){D.sc.parts=D.sc.parts.filter(q=>!D.rain.includes(q));D.rain=null;D.sc.dark=0}D.sc.camTo(CAMS[role]);

// ritual: seven pheras (Hindu/Jain) or the Nikah. Calls done() at the end.

 if(D.trad==='muslim'){const lb=label(D,()=>[0,2.2,.4],'The Nikah begins','good');let t0=null;const lines=['The Qazi reads the vows','"Qubool hai"','"Qubool hai"','"Qubool hai"','They are married'];

function dayResolve(D,e,ci,res){const sc=D.sc,id=e.id;clearLabels(D);

 if(id==='food_short'&&ci!==2)sc._pots.forEach(p=>p.vis=true);
 if(id==='food_short')sc._G.forEach(F=>{if(F.mode==='still'&&D.role!=='feast')F.mode='wander'});
 if(D.fire){D.fire.forEach(o=>o.vis=false);D.fire=null;sc._canopy.col=[90,40,30]}
 if(id==='pandit_late')D.officiant.show(true);
 if(id==='rain'&&ci!==2){sc.parts=sc.parts.filter(q=>!D.rain.includes(q));D.rain=null;sc.dark=0}
 if(id==='late_baraat'||id==='vidaai'||id==='rukhsati')D.bfam[0].face.face.mood=1;
 if(id==='toran'&&D.rider&&ci===0){const R0=D.rider;let k=0;D.tmp.push({keep:1,tick:(t,dt)=>{if(k>1)return;k+=dt;R0.set(R0.x,R0.z,Math.sin(Math.min(1,k)*Math.PI)*1.2)}})}
 // remove temporary people and objects
 for(const a of D.tmp){if(a.figs)a.figs.forEach(F=>F.show(false));if(a.f)a.f.show(false);if(a.o)a.o.vis=false}
 D.tmp=D.tmp.filter(a=>a.tick&&!a.figs&&!a.f&&!a.o&&a.keep);
 const d=(res.b||0)+(res.g||0);const at=D.role==='feast'?[5.5,2.6,0]:D.role==='arrive'?[0,3.6,D.procZ]:D.role==='farewell'?[0,3,8]:[0,3,1];
 if(d>0){flash(D,at,'Families pleased  +'+d,'good');AUD.sfx('good')}else if(d<0){flash(D,at,'Families unhappy  '+d,'say');AUD.sfx('bad')}else AUD.sfx('tap');
}

 body.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{const e=W.cur,ci=+el.dataset.c;const r=chooseEvent(b,ci);dayResolve(D,e,ci,r);save();
  if(W.phase===UI.shown&&W.cur&&!W.done){UI.busy=true;UI.busyText='…';renderWedding();setTimeout(()=>{UI.busy=false;showEv();renderWedding()},1300)}else renderWedding()});
 if($('#fin'))$('#fin').onclick=()=>{if(D.role!=='farewell'||!D.doli){dayDoli(D)}UI.busy=true;UI.busyText='The doli carries the bride away…';renderWedding();setTimeout(()=>{UI.busy=false;finishWedding(b,false);AUD.sfx(b.result.avg>=70?'big':'bad');renderWedding()},2600)};
}
function resultView(b,body){const r=b.result;const v=r.avg>=85?'A triumph':r.avg>=70?'A success':r.avg>=50?'A mixed affair':'A disaster';
 if(UI.dir&&r.avg>=70&&!UI.dir.cele){UI.dir.cele=1;addFireworks(UI.dir.sc,4);UI.dir.sc.camTo({tg:[0,2,0],dist:22,ph:.55,th:null})}
 body.innerHTML='<div class="card hl" style="text-align:center"><div class="xs gold">The wedding is over</div><h1 style="margin:6px 0">'+v+'</h1><div class="big-num gold">'+Math.round(r.avg)+'</div><div class="xs mu">out of 100</div></div>'+
 '<div class="grid2"><div class="mini"><div class="l">Bride\'s family</div><div class="v">'+r.bs+'</div></div><div class="mini"><div class="l">Groom\'s family</div><div class="v">'+r.gs+'</div></div></div>'+
 '<div class="card" style="margin-top:12px"><div class="kv"><span>Fee</span><span>'+money(b.fee)+'</span>'+(r.tip?'<span>Gift of thanks</span><span class="ok">+'+money(r.tip)+'</span>':'')+(r.withheld?'<span>Payment withheld</span><span class="bad">−'+money(r.withheld)+'</span>':'')+'<span>Vendors and decoration</span><span>−'+money(r.vc)+'</span><span>Costs on the day</span><span>−'+money(r.ev)+'</span><span><b>Profit</b></span><span class="'+(r.profit>=0?'ok':'bad')+'"><b>'+money(r.profit)+'</b></span><span>Fame</span><span class="'+(r.rep>=0?'gold':'bad')+'">'+(r.rep>=0?'+':'')+r.rep+'</span></div></div>'+
 '<button class="btn pri full" id="done">Back to the house</button>';
 $('#done').onclick=()=>{UI.view=null;UI.tab='home';UI.dir=null;render()}}

// ---------------- Decorate ----------------
function okSpot(b,x,z,plan){if(Math.abs(x)>8.2||Math.abs(z)>8.2)return false;if(Math.abs(x)<3.3&&Math.abs(z)<3.3)return false;if(plan.feast&&x>5.2&&Math.abs(z)<3.8)return false;if(plan.music&&x<-5.4&&z>3.2&&z<6)return false;if(Math.abs(x)<2.8&&z>6.4)return false;return !(b.items||[]).some(i=>Math.hypot(i.x-x,i.z-z)<1.5)}
function renderDecor(){const b=S.bookings.find(x=>x.id===UI.view.id);if(!b){UI.view=null;return render()}b.items=b.items||[];
 const app=document.getElementById('app');const p=planObj(b);
 if(!app.querySelector('#dsc')){app.innerHTML='<div class="topbar"><button class="btn sm ghost" id="back">← Done</button><div class="house" style="text-align:center"><b style="font-size:17px">Decorate the venue</b><span>Tap the ground to place</span></div><div class="chip"><i>₹</i>'+Math.round(S.money).toLocaleString('en-IN')+'</div></div><div class="main" id="main" style="padding-top:10px"><div class="scene" id="dsc"></div><div id="dbody"></div></div>';
  $('#back').onclick=()=>{save();UI.view={t:'plan',id:b.id};render()};
  const cv=document.createElement('canvas');$('#dsc').appendChild(cv);const sc=new E3.Scene(cv,Math.min(380,Math.round(innerHeight*.45)));UI.scene=sc;UI.dsc=sc;
  const rebuild=()=>{buildVenue(sc,p,{trad:b.trad,items:b.items,noGuests:true,noProc:true})};rebuild();sc.th=.6;sc.ph=.95;sc.dist=24;sc.auto=false;sc.start();
  sc.onTap=(x,y)=>{const g=sc.toGround(x,y);if(!g)return;const gx=Math.round(g[0]*2)/2,gz=Math.round(g[1]*2)/2;
   if(UI.tool==='remove'){const i=b.items.findIndex(it=>Math.hypot(it.x-g[0],it.z-g[1])<1.2);if(i>=0){b.items.splice(i,1);AUD.sfx('tap');rebuild();drawDecorBody(b)}return}
   const it=DECOR_BY[UI.tool||'urn'];if(!it)return;if(it.minFame&&fameTier()<it.minFame){toast('Needs more fame');return}
   if(b.items.length>=24){toast('That is enough decoration');return}
   if(!okSpot(b,gx,gz,p)){toast('Can\'t place it there');return}
   b.items.push({k:it.k,x:gx,z:gz});AUD.sfx('place');rebuild();drawDecorBody(b)};
  UI.rebuildDecor=rebuild}
 drawDecorBody(b)}
function drawDecorBody(b){const body=$('#dbody');const bt=beauty(b),tg=beautyTarget(b),bonus=beautyBonus(b);UI.tool=UI.tool||'arch';
 let h='<div class="card" style="padding:12px 14px"><div class="row"><div style="flex:1"><div class="lab xs mu" style="display:flex;justify-content:space-between"><span>Beauty '+bt+'</span><span>Families expect about '+tg+'</span></div><div class="bar" style="margin-top:4px"><i style="width:'+Math.min(100,bt/(tg*1.6)*100)+'%;background:var(--gold)"></i></div></div></div><div class="row xs" style="margin-top:8px"><span class="mu">'+b.items.length+' items · '+money(itemsCost(b))+'</span><span class="sp"></span><span class="'+(bonus>=0?'ok':'bad')+'">Happiness '+(bonus>=0?'+':'')+bonus.toFixed(1)+'</span></div></div>';
 h+='<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 10px;padding-left:16px;padding-right:16px">'+DECOR_ITEMS.map(it=>{const lock=it.minFame&&fameTier()<it.minFame;return '<button class="opt'+(UI.tool===it.k?' sel':'')+'" data-tool="'+it.k+'" style="flex:none;width:128px;margin:0" '+(lock?'disabled':'')+'><div class="t sm">'+it.name+'</div><div class="xs gold">'+money(it.cost)+' · beauty '+it.beauty+'</div><div class="xs mu" style="margin-top:2px">'+(lock?'Needs '+FAME[it.minFame].name:it.desc)+'</div></button>'}).join('')+'</div>';
 h+='<div class="row" style="gap:8px"><button class="btn sm'+(UI.tool==='remove'?' red':'')+'" data-tool="remove">Remove</button><button class="btn sm" id="auto">Decorate for me</button><span class="sp"></span><button class="btn sm ghost" id="clr">Clear all</button></div>';
 body.innerHTML=h;
 body.querySelectorAll('[data-tool]').forEach(el=>el.onclick=()=>{UI.tool=el.dataset.tool;AUD.sfx('tap');drawDecorBody(b)});
 $('#clr').onclick=()=>{b.items=[];UI.rebuildDecor();drawDecorBody(b)};
 $('#auto').onclick=()=>{const p=planObj(b);const want=beautyTarget(b)*.9;const pool=DECOR_ITEMS.filter(i=>!(i.minFame&&fameTier()<i.minFame)).sort((a,c)=>c.beauty/c.cost-a.beauty/a.cost);let g=0;
  const plan=['seating','seating','canopy','canopy','arch','arch','swing','lamp','lamp','lamp','lamp','banana','banana','urn','urn','rangoli','rangoli','peacock','fountain','elephant'];
  for(const k of plan){if(beauty(b)>=want&&k!=='seating')break;const it=DECOR_BY[k];if(it.minFame&&fameTier()<it.minFame)continue;for(let tries=0;tries<60;tries++){const a=Math.random()*6.28,r=4+Math.random()*4;const x=Math.round(Math.cos(a)*r*2)/2,z=Math.round(Math.sin(a)*r*2)/2;if(okSpot(b,x,z,p)){b.items.push({k,x,z});break}}}
  AUD.sfx('good');UI.rebuildDecor();drawDecorBody(b)};
}

// ---------------- Vendors ----------------
function vVend(m){let h='<p class="sm mu" style="margin-top:0">Vendors you hire often become friends of the house: up to 10% cheaper and more reliable.</p>';
 for(const s of SLOTS){h+='<div class="sec">'+s.name+'</div><div class="card">';VENDORS.filter(v=>v.slot===s.id).forEach(v=>{const rl=relLvl(v.id),locked=v.minFame&&fameTier()<v.minFame;
  h+='<div class="list-item"><span class="si" style="width:34px;height:34px;border-radius:10px;background:var(--p2);display:flex;align-items:center;justify-content:center;color:var(--gold)">'+svg(s.icon,18)+'</span><div style="flex:1;min-width:0"><div class="'+(locked?'dim':'')+'">'+v.name+'</div><div class="xs mu">'+(locked?'Unlocks at '+FAME[v.minFame].name:v.note)+'</div><div class="bar" style="margin-top:5px;height:4px"><i style="width:'+rl*10+'%;background:var(--gold)"></i></div></div><div style="text-align:right">'+stars(v.q)+'<div class="xs dim">Hired '+(S.vuse[v.id]||0)+'×</div></div></div>'});h+='</div>'}
 m.innerHTML=h}

// ---------------- House ----------------
function vHouse(m){const hd=S.head;let h='<div class="card hl"><div class="row">'+portrait(hd.name,hd.female,64)+'<div><div class="xs gold">Head of the house · Generation '+hd.gen+'</div><div style="font-family:var(--serif);font-size:22px">'+hd.name+'</div><div class="sm mu">Age '+hd.age+' · '+TRAITS[hd.trait].name+'</div><div class="xs dim">'+TRAITS[hd.trait].desc+'</div></div></div></div>';
 h+='<div class="sec">Wedding managers<small>'+S.staff.length+'</small></div><div class="card">'+(S.staff.length?S.staff.map(s=>'<div class="list-item"><div class="av">'+portrait(s.name,/Bibi|Kanwar/.test(s.name))+'</div><div style="flex:1"><div>'+s.name+'</div><div class="xs mu">'+money(s.wage)+' a month</div></div>'+stars(s.skill)+'<button class="btn sm ghost" data-a="fire:'+s.id+'">Let go</button></div>').join(''):'<p class="sm mu" style="margin:0">Managers add a booking slot and can run weddings for you.</p>')+'<button class="btn full" style="margin-top:10px" data-a="hire">Hire a manager</button></div>';
 h+='<div class="sec">Charity</div><div class="card row"><div style="flex:1"><div>Sponsor weddings for poor couples</div><div class="xs mu">₹2,500, once a year. Earns fame and blessings.</div></div><button class="btn sm" data-a="charity">Sponsor</button></div>';h+='<div class="sec">Improve the house</div>';UPGRADES.forEach(u=>{const own=S.upgrades[u.id];h+='<div class="card row"><div style="flex:1"><div>'+u.name+'</div><div class="xs mu">'+u.desc+'</div></div>'+(own?'<span class="tag o">Owned</span>':'<button class="btn sm '+(S.money>=u.cost?'pri':'')+'" data-a="up:'+u.id+'">'+money(u.cost)+'</button>')+'</div>'});
 if(S.debt)h+='<div class="sec">Moneylender</div><div class="card row"><div style="flex:1"><div class="bad">'+money(S.debt)+' owed</div><div class="xs mu">3% interest every month. The house falls if debt passes ₹6,000.</div></div><button class="btn sm" data-a="repay">Repay ₹500</button></div>';
 if(S.heads.length){h+='<div class="sec">Past heads of the house</div><div class="card">'+S.heads.map(p=>'<div class="list-item"><div class="av">'+portrait(p.name,false)+'</div><div><div>'+p.name+'</div><div class="xs mu">Generation '+p.gen+' · led until '+p.until+' · '+TRAITS[p.trait].name+'</div></div></div>').join('')+'</div>'}
 m.innerHTML=h}
function hireSheet(){const C=staffCandidates();sheet('<h2>Hire a wedding manager</h2><p class="sm mu">Each manager adds one booking slot and can plan and run weddings for you.</p>'+C.map((c,i)=>'<button class="opt" data-s="'+i+'"><div class="row">'+portrait(c.name,/Bibi|Kanwar/.test(c.name),40)+'<div style="flex:1"><div class="t">'+c.name+'</div><div class="xs mu">Hiring gift '+money(c.hire)+' · '+money(c.wage)+' a month</div></div>'+stars(c.skill)+'</div></button>').join(''),i=>{const err=hire(C[+i]);if(err)toast(err);else{toast('Hired '+C[+i].name);closeSheet();render()}})}

// ---------------- Chronicle ----------------
function vChron(m){let h='';if(S.stats.best){const b=S.stats.best;h+='<div class="card hl"><div class="xs gold">Most celebrated wedding</div><div style="font-family:var(--serif);font-size:20px">'+b.name+'</div><div class="xs mu">'+dateStr(b.i)+' · '+TRADITIONS[b.trad].name+' · '+b.guests+' guests · score '+Math.round(b.avg)+'</div></div>'}
 h+='<div class="grid2"><div class="mini"><div class="l">Total profit</div><div class="v">'+money(S.stats.earned)+'</div></div><div class="mini"><div class="l">Stood firm against greedy demands</div><div class="v">'+(S.stats.honour||0)+'</div></div></div>';
 h+='<div class="sec">Weddings</div><div class="card">'+(S.chron.length?S.chron.slice(0,60).map(c=>'<div class="log"><b>'+MS[miM(c.i)]+' '+miY(c.i)+'</b><span style="flex:1">'+c.name+(c.auto?' <span class="dim">(manager)</span>':'')+'</span><span class="'+(c.avg>=70?'ok':c.avg>=50?'warn':'bad')+'">'+Math.round(c.avg)+'</span></div>').join(''):'<p class="sm mu" style="margin:0">Your first wedding will be written here.</p>')+'</div>';
 h+='<div class="sec">History of the house</div><div class="card">'+S.log.slice(0,80).map(l=>'<div class="log"><b>'+MS[miM(l.i)]+' '+miY(l.i)+'</b><span>'+l.t+'</span></div>').join('')+'</div>';
 m.innerHTML=h}

window.addEventListener('resize',()=>{if(UI.scene&&document.body.contains(UI.scene.cv))UI.scene.resize()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)save()});
