name: Build Nexa System APK
on:
  push:
    paths:
      - 'nexa-app/**'
      - 'nexa-system/**'
      - '.github/workflows/build-nexa-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexa-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NexaSystem-apk
          path: nexa-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NexaSystem.apk
          gh release delete nexa-latest --yes --cleanup-tag || true
          gh release create nexa-latest NexaSystem.apk --target "$GITHUB_SHA" --title "Nexa System (story game)" --notes "Tap NexaSystem.apk to download and install."
