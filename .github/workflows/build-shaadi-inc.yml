name: Build Shaadi Inc APK
on:
  push:
    branches: [shaadi-inc]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle assembleDebug --no-daemon
      - name: Publish APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ShaadiInc.apk
          gh release delete shaadi-inc --yes --cleanup-tag || true
          gh release create shaadi-inc ShaadiInc.apk --target shaadi-inc --title "Shaadi Inc. (Stage 1)" --notes "Tap ShaadiInc.apk to download and install." --latest=false
