name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HollywoodSim-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HollywoodSim.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HollywoodSim.apk --title "Hollywood Studio Simulator" --notes "Tap HollywoodSim.apk to download and install." --latest
