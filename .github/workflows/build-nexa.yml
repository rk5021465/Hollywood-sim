name: Build NEXA APK
on:
  push:
    branches: [nexa-godot]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot templates, SDK and keystore
        run: |
          mkdir -p ~/.local/share/godot/export_templates/ ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ || true
          ls ~/.local/share/godot/export_templates/
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which java))))
          echo "JAVA_DIR=$JAVA_DIR"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $GITHUB_WORKSPACE/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "/usr/lib/android-sdk"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$JAVA_DIR" "$GITHUB_WORKSPACE" > ~/.config/godot/$f
          done
      - name: Import project
        run: godot --headless --editor --quit-after 2000 --path . 2>&1 | tee import.log || true
      - name: Script check + smoke run (main menu for a few seconds)
        run: |
          godot --headless --path . --quit-after 600 2>&1 | tee run.log || true
          echo "===== ERRORS ====="
          grep -E "SCRIPT ERROR|Parse Error|ERROR:|Invalid|Cannot|Identifier" import.log run.log | grep -v "missing image" | head -150 || true
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/NEXA.apk 2>&1 | tail -80
          ls -la build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXA-apk
          path: |
            build/NEXA.apk
            import.log
            run.log
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexa
          name: NEXA latest build
          prerelease: true
          files: build/NEXA.apk
